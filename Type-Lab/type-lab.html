<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Type Lab — кинетика и постеры для любых шрифтов</title>
<style>
:root{--bg:#0d0d0f;--p:#151518;--p2:#1c1c21;--line:#2a2a31;--tx:#ececf0;--mu:#8b8b96;--ac:#d6ff3f;--r:8px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:250px minmax(0,1fr) 310px;overflow:hidden}
aside{background:var(--p);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
aside.l{border-right:1px solid var(--line)}aside.rt{border-left:1px solid var(--line)}
h1{font-size:15px;margin:0;letter-spacing:.02em;font-weight:650}h1 small{display:block;color:var(--mu);font-weight:400;font-size:11.5px;margin-top:2px}
h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--mu);margin:0 0 7px;font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--p2);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#4a4a55}.btn.pri{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}
.list{display:flex;flex-direction:column;gap:1px}
.it{background:none;border:0;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.it:hover{background:var(--p2)}.it.on{background:var(--tx);color:#111}
.it i{font-style:normal;color:var(--mu);font-size:11px}.it.on i{color:#555}
.it .x{opacity:.5;padding:0 3px}.it .x:hover{opacity:1}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.top .nm{font-weight:650;font-size:14px}.top .ds{color:var(--mu);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;background:repeating-conic-gradient(#111114 0 25%,#0d0d0f 0 50%) 0 0/24px 24px}
canvas#cv{max-width:100%;max-height:100%;box-shadow:0 10px 50px #000a}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line)}
.bar input[type=range]{flex:1}
label.r{display:grid;grid-template-columns:112px 1fr 40px;align-items:center;gap:8px;margin:5px 0}
label.r>span{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
label.r output{text-align:right;font-variant-numeric:tabular-nums;color:var(--mu);font-size:11.5px}
label.r select,label.r input[type=text]{grid-column:2/4}
input[type=range]{width:100%;accent-color:var(--ac);height:16px;margin:0}
select,textarea,input[type=text],input[type=search]{background:var(--p2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:74px;font-size:14px}
input[type=color]{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;background:none;padding:2px;cursor:pointer}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.cols3 span{display:block;color:var(--mu);font-size:11px;margin-bottom:3px}
.pals{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pal{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0;position:relative;overflow:hidden}
.pal b{position:absolute;inset:auto 0 0 0;height:50%}.pal u{position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--p2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;cursor:pointer;font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
.chip.on{background:var(--tx);color:#111;border-color:var(--tx)}
.note{color:var(--mu);font-size:11.5px;margin:4px 0 0}
details{border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;color:var(--mu);font-size:11.5px}
details ul{margin:8px 0 0;padding-left:16px;color:var(--mu);font-size:11.5px}details li{margin:4px 0}
dialog{background:var(--p);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(460px,92vw)}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 12px;font-size:15px}
dialog label.c{display:flex;gap:8px;align-items:center;margin:7px 0}
progress{width:100%;height:8px;accent-color:var(--ac)}
#lfList{max-height:50vh;overflow:auto;margin-top:10px}
#drop{position:fixed;inset:0;background:#0d0d0fe6;display:none;align-items:center;justify-content:center;font-size:22px;z-index:9;border:2px dashed var(--ac)}
</style>
</head>
<body>
<aside class="l">
  <h1>Type Lab<small>кинетика и постеры для любых шрифтов</small></h1>
  <section>
    <h2>Шрифты</h2>
    <div class="row"><button class="btn pri" id="bUp">Загрузить файл</button><button class="btn" id="bLocal">С компьютера…</button></div>
    <input type="file" id="fIn" accept=".ttf,.otf,.woff,.woff2,.ttc" multiple hidden>
    <p class="note">TTF, OTF, WOFF, WOFF2. Можно перетащить в окно. Файлы никуда не отправляются.</p>
    <div class="list" id="fonts" style="margin-top:8px"></div>
  </section>
  <section><h2>Кинетика</h2><div class="list" id="pk"></div></section>
  <section><h2>Постеры и спесимены</h2><div class="list" id="pp"></div></section>
</aside>
<main>
  <div class="top"><span class="nm" id="pName"></span><span class="ds" id="pDesc"></span>
    <button class="btn" id="bRand" title="Случайные параметры пресета">Случайно</button>
    <button class="btn" id="bPng">PNG</button><button class="btn" id="bMp4">MP4</button>
    <button class="btn pri" id="bAll">Скачать всё (ZIP)</button></div>
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="bar"><button class="btn" id="bPlay" style="width:86px">Пауза</button><input type="range" id="scrub" min="0" max="1" step="0.001" value="0"><span class="note" id="tInfo" style="margin:0;width:120px;text-align:right"></span></div>
</main>
<aside class="rt" id="panel"></aside>

<dialog id="dExp"><h3>Скачать всё одним архивом</h3>
  <label class="c"><input type="checkbox" id="xP" checked> Постеры и спесимены — PNG</label>
  <label class="c"><input type="checkbox" id="xM" checked> Все анимации — MP4</label>
  <label class="c"><input type="checkbox" id="xS" checked> Кадр из каждой анимации — PNG</label>
  <p class="note" id="xNote"></p>
  <progress id="xProg" value="0" max="1" hidden></progress><p class="note" id="xStat"></p>
  <div class="row" style="margin-top:12px"><button class="btn" id="xCancel">Закрыть</button><button class="btn pri" id="xGo">Собрать ZIP</button></div>
</dialog>
<dialog id="dLocal"><h3>Шрифты, установленные на компьютере</h3>
  <input type="search" id="lfQ" placeholder="Поиск по названию"><div class="list" id="lfList"></div>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="dLocal.close()">Закрыть</button></div>
</dialog>
<div id="drop">Отпустите, чтобы добавить шрифт</div>

<script>
'use strict';
/* ───────── helpers ───────── */
const $=s=>document.querySelector(s),TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,k)=>a+(b-a)*k,fr=x=>x-Math.floor(x);
const EASE={
  expo:k=>k<=0?0:k>=1?1:k<.5?2**(20*k-10)/2:(2-2**(-20*k+10))/2,
  cubic:k=>k<.5?4*k*k*k:1-(-2*k+2)**3/2,
  sine:k=>.5-.5*Math.cos(Math.PI*k),
  back:k=>{const c=1.70158*1.525;return k<.5?((2*k)**2*((c+1)*2*k-c))/2:((2*k-2)**2*((c+1)*(k*2-2)+c)+2)/2},
  linear:k=>k};
const EASE_L={expo:'Expo — резко',cubic:'Cubic — мягко',sine:'Sine — плавно',back:'Back — с перелётом',linear:'Linear'};
const bounceOut=x=>{const n=7.5625,d=2.75;return x<1/d?n*x*x:x<2/d?n*(x-=1.5/d)*x+.75:x<2.5/d?n*(x-=2.25/d)*x+.9375:n*(x-=2.625/d)*x+.984375};
const FORMATS={poster:['Постер 4:5',1080,1350],story:['Сторис 9:16',1080,1920],square:['Квадрат 1:1',1080,1080],wide:['Видео 16:9',1920,1080],a:['A-формат',1414,2000]};
const PALS=[['#0b0b0c','#f4f1ea','#ff3b1f'],['#f4f1ea','#0b0b0c','#ff3b1f'],['#ffe500','#0b0b0c','#0b0b0c'],['#1b2bff','#ffffff','#ffe500'],['#ff3b1f','#0b0b0c','#f4f1ea'],['#e9e4d8','#1c3a2b','#ff5a1f'],['#0e2a22','#d9ffcf','#ff7ad1'],['#ff8fd0','#14110f','#ffffff'],['#111111','#d6ff3f','#ffffff']];
const TXT={lat:'Typography is what language looks like. A typeface earns its place on the page through rhythm, colour and the small decisions hidden in every curve. Set a paragraph, squint, and look at the grey it makes: even, calm, alive. Numbers 0123456789, punctuation — “quotes”, (brackets), & ampersands — all deserve the same care as the letters.',
cyr:'Шрифт — это то, как выглядит язык. Гарнитура заслуживает место на странице ритмом, цветом набора и мелкими решениями, спрятанными в каждой кривой. Наберите абзац, прищурьтесь и посмотрите на серое пятно: ровное, спокойное, живое. Цифры 0123456789, пунктуация — «кавычки», (скобки), № и & — требуют того же внимания, что и буквы.'};

/* ───────── state ───────── */
const S=Object.assign({text:'TYPE\nIN\nMOTION',sub:'Specimen 2026 — regular, bold, italic',case:'asis',track:0,bg:PALS[0][0],fg:PALS[0][1],ac:PALS[0][2],format:'poster',dur:4,fps:30,loops:2,ease:'expo',pngScale:2,preset:'wave',params:{},playing:true,font:-1},
  (()=>{try{return JSON.parse(localStorage.getItem('typelab')||'{}')}catch{return{}}})());
S.font=-1;
let saveT;const persist=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('typelab',JSON.stringify(S))}catch{}},300)};
let dirty=true,t0=performance.now(),curT=0;

/* ───────── fonts ───────── */
const fonts=[
  {id:-1,name:'System Sans',css:'"Helvetica Neue",Helvetica,Arial,sans-serif',sys:1,feat:{},axes:{}},
  {id:-2,name:'System Serif',css:'Georgia,"Times New Roman",serif',sys:1,feat:{},axes:{}},
  {id:-3,name:'System Mono',css:'ui-monospace,Menlo,Consolas,monospace',sys:1,feat:{},axes:{}}];
let fid=0;
const curFont=()=>fonts.find(f=>f.id===S.font)||fonts[0];
const DEF_ON=new Set(['liga','clig','calt','kern','rlig','ccmp','locl','mark','mkmk','rvrn','cont']);
const HIDE=new Set(['ccmp','locl','mark','mkmk','rvrn','rlig','aalt','curs','dist','abvm','blwm','abvs','blws','akhn','rphf','pref','pres','psts','haln','nukt','half','init','medi','fina','isol','vert','vrt2','mset','cpsp']);
const FNAME={liga:'Лигатуры',dlig:'Декоративные лигатуры',hlig:'Исторические лигатуры',calt:'Контекстные альтернативы',kern:'Кернинг',smcp:'Капитель',c2sc:'Капитель из прописных',onum:'Минускульные цифры',lnum:'Маюскульные цифры',tnum:'Табличные цифры',pnum:'Пропорциональные цифры',frac:'Дроби',sups:'Верхние индексы',subs:'Нижние индексы',sinf:'Научные индексы',ordn:'Порядковые',zero:'Перечёркнутый ноль',case:'Формы для прописных',salt:'Стилистические альтернативы',swsh:'Росчерки',titl:'Титульные формы',hist:'Исторические формы',numr:'Числители',dnom:'Знаменатели',ornm:'Орнаменты'};
const FSAMPLE={smcp:'Small Caps Hamburg',c2sc:'CAPS TO SMALL',onum:'0123456789',lnum:'0123456789',tnum:'1110 9876',pnum:'1110 9876',frac:'1/2 3/4 5/8',sups:'x2 H2O 1st',subs:'H2O CO2',sinf:'H2O CO2',ordn:'1a 2o No',zero:'0O 1000',case:'(H-H) [A:B]',liga:'fi fl ffi office',dlig:'ct st Th fb',hlig:'ct st',numr:'12345',dnom:'12345',kern:'AVATAR To Ty'};
const fname=t=>FNAME[t]||(/^ss\d\d$/.test(t)?'Стилистический набор '+ +t.slice(2):/^cv\d\d$/.test(t)?'Вариант знака '+ +t.slice(2):t);

async function parseFont(buf){
  const dv=new DataView(buf),tag=(d,o)=>String.fromCharCode(d.getUint8(o),d.getUint8(o+1),d.getUint8(o+2),d.getUint8(o+3));
  const WANT=new Set(['name','GSUB','GPOS','fvar','cmap']),T={},sig=tag(dv,0);
  if(sig==='wOF2')return null;
  if(sig==='wOFF'){const n=dv.getUint16(12);
    for(let i=0;i<n;i++){const o=44+i*20,t=tag(dv,o);if(!WANT.has(t))continue;const off=dv.getUint32(o+4),cl=dv.getUint32(o+8),ol=dv.getUint32(o+12);
      let b=new Uint8Array(buf,off,cl);
      if(cl<ol)b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
      T[t]=new DataView(b.buffer,b.byteOffset,b.byteLength)}
  }else{const base=sig==='ttcf'?dv.getUint32(12):0,n=dv.getUint16(base+4);
    for(let i=0;i<n;i++){const o=base+12+i*16,t=tag(dv,o);if(WANT.has(t))T[t]=new DataView(buf,dv.getUint32(o+8),dv.getUint32(o+12))}}
  const info={name:'',feats:[],axes:[],wght:null,chars:[]};
  if(T.name){const d=T.name,n=d.getUint16(2),so=d.getUint16(4),got={};
    for(let i=0;i<n;i++){const o=6+i*12,pl=d.getUint16(o),id=d.getUint16(o+6),len=d.getUint16(o+8),off=so+d.getUint16(o+10);
      if(![1,4,16].includes(id)||(got[id]&&pl!==3))continue;let s='';
      if(pl===3||pl===0)for(let j=0;j+1<len;j+=2)s+=String.fromCharCode(d.getUint16(off+j));else for(let j=0;j<len;j++)s+=String.fromCharCode(d.getUint8(off+j));
      if(s)got[id]=s}
    info.name=got[4]||got[16]||got[1]||''}
  const fs=new Set();
  for(const k of['GSUB','GPOS'])if(T[k]){const d=T[k],fl=d.getUint16(6);if(!fl)continue;const n=d.getUint16(fl);for(let i=0;i<n;i++)fs.add(tag(d,fl+2+i*6))}
  info.feats=[...fs].sort();
  if(T.fvar){const d=T.fvar,ao=d.getUint16(4),n=d.getUint16(8),sz=d.getUint16(10);
    for(let i=0;i<n;i++){const o=ao+i*sz,ax={tag:tag(d,o),min:d.getInt32(o+4)/65536,def:d.getInt32(o+8)/65536,max:d.getInt32(o+12)/65536};
      if(ax.tag==='wght')info.wght=ax;else info.axes.push(ax)}}
  if(T.cmap){const d=T.cmap,n=d.getUint16(2);let best=null,bs=-1;
    for(let i=0;i<n;i++){const o=4+i*8,pl=d.getUint16(o),en=d.getUint16(o+2),so=d.getUint32(o+4),f=d.getUint16(so);
      const sc=f===12?2:f===4&&(pl===3&&en===1||pl===0)?1:-1;if(sc>bs){bs=sc;best={so,f}}}
    const ok=c=>c>0x20&&!(c>=0x7f&&c<=0xa0)&&c!==0xad&&!(c>=0x300&&c<=0x36f)&&!(c>=0x2000&&c<=0x200f)&&!(c>=0x2028&&c<=0x202f)&&!(c>=0xfe00&&c<=0xfe0f)&&c!==0xfeff&&c<0xffff0;
    const add=(s,e)=>{for(let c=s;c<=e&&info.chars.length<4000;c++)if(ok(c))info.chars.push(String.fromCodePoint(c))};
    if(best&&best.f===4){const o=best.so,sx=d.getUint16(o+6);for(let i=0;i<sx;i+=2){const e=d.getUint16(o+14+i),s=d.getUint16(o+16+sx+i);if(s!==0xffff)add(s,Math.min(e,0xfffe))}}
    else if(best&&best.f===12){const o=best.so,g=d.getUint32(o+12);for(let i=0;i<g;i++)add(d.getUint32(o+16+i*12),d.getUint32(o+20+i*12))}}
  return info}

function faceDesc(f,extra){const d={};if(f.info?.wght)d.weight=`${Math.max(1,f.info.wght.min)} ${Math.min(1000,f.info.wght.max)}`;
  const fs=Object.entries(Object.assign({},f.feat,extra)).map(([t,on])=>`"${t}" ${on?1:0}`).join(', ');if(fs)d.featureSettings=fs;
  if(f.varCss)d.variationSettings=f.varCss;return d}
async function rebuildFace(f){
  f.varCss=(f.info?.axes||[]).map(a=>`"${a.tag}" ${f.axes[a.tag]??a.def}`).join(', ');
  const name=`${f.base}_${++f.ver}`,my=f.ver,ff=new FontFace(name,f.buf,faceDesc(f));
  await ff.load();if(my!==f.ver)return;document.fonts.add(ff);if(f.face)document.fonts.delete(f.face);
  f.face=ff;f.css=`"${name}",sans-serif`;dirty=true}
let rbT;const rebuildSoon=f=>{clearTimeout(rbT);rbT=setTimeout(()=>rebuildFace(f),50)};
async function addFont(buf,hint){
  let info=null;try{info=await parseFont(buf)}catch(e){console.warn('parse',e)}
  const f={id:++fid,name:info?.name||hint.replace(/\.[^.]+$/,''),buf,info,base:'TL'+fid,ver:0,feat:{},axes:{},wght:info?.wght?clamp(400,info.wght.min,info.wght.max):400};
  if(info?.wght)f.wght=info.wght.def;
  try{await rebuildFace(f)}catch(e){alert('Не удалось прочитать шрифт: '+hint);return}
  fonts.push(f);S.font=f.id;ui()}
const FEATC=new Map(),PENDING=new Set();
function featFace(f,tag,on){const key=`${f.id}|${f.varCss}|${tag}|${on}`,c=FEATC.get(key);if(c)return c.ok?c.css:null;
  const name=`${f.base}_x${FEATC.size}`,ent={ok:false,css:`"${name}",sans-serif`};FEATC.set(key,ent);
  const p=new FontFace(name,f.buf,faceDesc(f,{[tag]:on})).load().then(ff=>{document.fonts.add(ff);ent.ok=true;dirty=true}).catch(()=>{}).finally(()=>PENDING.delete(p));
  PENDING.add(p);return null}

/* ───────── drawing kit ───────── */
const mctx=document.createElement('canvas').getContext('2d'),MC=new Map();
function metr(E,str,w,fam){w=Math.round(w??E.wb);fam=fam||E.fam;const key=fam+'|'+w+'|'+str;let m=MC.get(key);
  if(!m){mctx.font=`${w} 200px ${fam}`;const q=mctx.measureText(str);m={asc:(q.actualBoundingBoxAscent||140)/200,desc:Math.max(0,q.actualBoundingBoxDescent||0)/200};if(MC.size>4000)MC.clear();MC.set(key,m)}
  return m}
let offCv=null;
function mkEnv(c,W,H,t,k,pr){
  const f=curFont(),v=f.info?.wght,cs=s=>S.case==='upper'?s.toUpperCase():S.case==='lower'?s.toLowerCase():s;
  let lines=S.text.split('\n').map(s=>s.trim()).filter(Boolean).map(cs);if(!lines.length)lines=['TYPE'];
  const E={c,W,H,t,k,P:S.params[pr.id],f,fam:f.css,fg:S.fg,bg:S.bg,ac:S.ac,lines,line:lines.join(' '),sub:S.sub,tr:S.track,wb:v?f.wght:400,isVar:!!v,dur:S.dur,ease:EASE[S.ease]||EASE.expo,
    sw(x){return this.ease(1-Math.abs(2*fr(x)-1))},ss(x){return this.sw(x)*2-1},
    font(px,w,fam){this.c.font=`${Math.round(w??this.wb)} ${Math.max(.1,px).toFixed(2)}px ${fam||this.fam}`;try{this.c.letterSpacing=(this.tr*px).toFixed(2)+'px'}catch{}},
    wt(q,mix=1){return v?Math.round(lerp(this.wb,lerp(v.min,v.max,clamp(q)),mix)/5)*5:this.wb},
    mw(s){return this.c.measureText(s).width},
    fit(s,target,w){this.font(100,w);return 100*target/Math.max(1,this.mw(s)-this.tr*100)},
    off(){if(!offCv){offCv=document.createElement('canvas');offCv.style.cssText='position:fixed;left:-99999px;top:0;width:10px;height:10px';document.body.appendChild(offCv)}offCv.style.fontVariationSettings=this.f.varCss||'normal';if(offCv.width!==W*k||offCv.height!==H*k){offCv.width=W*k;offCv.height=H*k}

function glyphRow(E,str,cx,y,size,fn){const c=E.c,ch=Array.from(str),n=ch.length,it=[];let x=0;

    for(;s<L[nx];gi++){const w=u.ws[gi%u.ch.length],sc=s+w/2;s+=w;if(sc<0||u.ch[gi%u.ch.length]===' ')continue;
      while(p<nx-1&&L[p+1]<sc)p++;const x=-M+(p+(sc-L[p])/(L[p+1]-L[p]))*dx;
      c.save();c.translate(x,yc+A*Math.sin(TAU*x/lam+ph));c.rotate(Math.atan(sl(x)));c.fillText(u.ch[gi%u.ch.length],0,0);c.restore()}}});

  $('#pName').textContent=p.name;$('#pDesc').textContent=p.desc;$('#bMp4').disabled=p.g!=='k';
  CT=[];const P=S.params[p.id],inf=f.info,fmt=FORMATS[S.format]||FORMATS.poster;
  let h=`<section><h2>Текст</h2><textarea data-c="${CT.push(v=>S.text=v)-1}" spellcheck="false">${esc(S.text)}</textarea>

/* ───────── export ───────── */
let BUSY=false;
const tick=()=>new Promise(r=>setTimeout(r,0));
const safe=s=>s.replace(/[^\wЀ-ӿ-]+/g,'_').slice(0,40)||'font';
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function exCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.style.cssText='position:fixed;left:-99999px;top:0;width:10px;height:10px';c.style.fontVariationSettings=curFont().varCss||'normal';document.body.appendChild(c);return c}
async function makePNG(p,t,scale){const[,W,H]=FORMATS[S.format],c=exCanvas(W*scale,H*scale),x=c.getContext('2d');
  render(x,W,H,t,scale,p);if(PENDING.size){await Promise.all([...PENDING]);render(x,W,H,t,scale,p)}

async function pickCodec(W,H,fps){if(!('VideoEncoder'in window))return null;
  for(const codec of['avc1.640033','avc1.4d0033','avc1.42003e','avc1.42E01F']){const cfg={codec,width:W,height:H,bitrate:(W*H>1.6e6?12:9)*1e6,framerate:fps,avc:{format:'avc'}};
    try{if((await VideoEncoder.isConfigSupported(cfg)).supported)return cfg}catch{}}return null}
async function makeMP4(p,onProg,cancel){
  const[,W,H]=FORMATS[S.format],fps=S.fps,n=Math.max(2,Math.round(S.dur*fps)),total=n*S.loops,cfg=await pickCodec(W,H,fps);
  if(!cfg)throw new Error('Этот браузер не умеет кодировать H.264 (WebCodecs). Откройте в Chrome, Edge или Safari.');
  const c=exCanvas(W,H),x=c.getContext('2d'),samples=[];let desc=null,err=null;

      render(x,W,H,(i%n)/n,1,p);const vf=new VideoFrame(c,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});enc.encode(vf,{keyFrame:i%fps===0});vf.close();
      while(enc.encodeQueueSize>6)await tick();if(i%4===0){onProg?.(i/total);await tick()}}
    await enc.flush()}finally{try{enc.close()}catch{}c.remove()}
  if(err)throw err;if(!desc)throw new Error('Кодек не вернул конфигурацию');

function muxMP4(samples,avcC,W,H,fps){
  const u32=n=>[n>>>24&255,n>>>16&255,n>>>8&255,n&255],u16=n=>[n>>8&255,n&255],str=s=>[...s].map(c=>c.charCodeAt(0)),z=n=>new Array(n).fill(0);

  const box=(type,...parts)=>{const body=cat(parts);return cat([u32(body.length+8),str(type),body])},full=(type,v,fl,...parts)=>box(type,[v,fl>>16&255,fl>>8&255,fl&255],...parts);

    box('trak',

      box('mdia',full('mdhd',0,0,u32(0),u32(0),u32(ts),u32(dur),u16(0x55c4),u16(0)),

            full('stts',0,0,u32(1),u32(samples.length),u32(delta)),

            full('stsc',0,0,u32(1),u32(1),u32(samples.length),u32(1)),
            full('stsz',0,0,u32(0),u32(samples.length),samples.flatMap(s=>u32(s.d.length))),
            full('stco',0,0,u32(1),u32(off)))))));

function makeZip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;const d=new Date(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();

const baseName=p=>`${safe(curFont().name)}_${p.id}_${S.format}`;
async function busy(btn,label,fn){if(BUSY)return;BUSY=true;const old=btn.textContent;btn.disabled=true;

let xCancel=false;
$('#bAll').onclick=()=>{const k=PRESETS.filter(p=>p.g==='k').length,z=PRESETS.length-k,[,W,H]=FORMATS[S.format];
