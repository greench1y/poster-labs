<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grid Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&family=Archivo:wght@400;500;700;900&family=Archivo+Black&family=Anton&family=Unbounded:wght@800&family=Rubik+Mono+One&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<style>
/* minimal UI: white, hairlines, one neutral sans, grey labels, no ornaments — the poster is the only colour */
:root{--bg:#f4f4f4;--panel:#fff;--line:#d4d4d4;--tx:#111;--mut:#555;--hov:#ececec;--trk:#bdbdbd}
@media (prefers-color-scheme: dark){:root{--bg:#0d0d0d;--panel:#161616;--line:#3a3a3a;--tx:#f2f2f2;--mut:#b0b0b0;--hov:#242424;--trk:#555}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 "Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:1fr 300px;height:100vh}
#stage{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:14px 20px}
#top .logo{font-weight:700;margin-right:14px}
#top .sp{flex:1}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:none;border:0;padding:6px 10px;color:var(--tx);font-weight:500;cursor:pointer;white-space:nowrap;border-radius:6px;transition:color .12s,background .12s}
button:hover{color:var(--tx);background:var(--hov)}
button kbd{font:inherit;font-weight:400;color:var(--mut);margin-left:4px}
#view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 32px 24px}
canvas#cv{max-width:100%;max-height:100%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.06)}
#bar{display:flex;gap:12px;align-items:center;padding:12px 20px 16px}
#bar button{width:32px;padding:6px 0;text-align:center}
#bar input[type=range]{flex:1}
#tlab{color:var(--mut);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
#panel{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:8px 0 40px}
details{border-bottom:1px solid var(--line);padding:0 20px}
details:last-of-type{border-bottom:0}
summary{cursor:pointer;padding:12px 0;user-select:none;list-style:none;display:flex;align-items:center;gap:6px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"";order:-1;width:5px;height:5px;border-right:1.5px solid var(--tx);border-bottom:1.5px solid var(--tx);transform:rotate(-45deg);margin:0 6px 0 1px;transition:transform .15s}
details[open]>summary::after{transform:rotate(45deg)}
details[open]{padding-bottom:12px}
summary .tag{font-weight:400;color:var(--mut)}
summary button.dice{order:5}summary input.hdr{order:6}
summary button.dice{margin-left:auto;padding:3px;line-height:0;color:var(--mut)}
summary button.dice:hover{color:var(--tx)}
summary button.dice svg{width:17px;height:17px}
summary input.hdr{margin:0 0 0 6px;cursor:pointer}
summary:not(:has(.dice))>input.hdr{margin-left:auto}
details.off>summary{color:var(--mut)}
details.off>*:not(summary){opacity:.5}
.row{display:grid;grid-template-columns:88px 1fr 34px;gap:10px;align-items:center;margin:7px 0}
.row.wide{grid-template-columns:88px 1fr}
.row label{color:var(--mut);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.row select,.row input[type=text],textarea{width:100%;background:var(--panel);border:1px solid var(--trk);border-radius:6px;padding:5px 7px;outline:none}
.row select:focus,.row input[type=text]:focus,textarea:focus{border-color:var(--mut)}
textarea{resize:vertical;min-height:30px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--trk)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;background:var(--tx);border:0}
input[type=range]::-moz-range-track{height:2px;background:var(--trk)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--tx);border:0}
.row input[type=color]{width:100%;height:24px;border:1px solid var(--trk);border-radius:6px;background:transparent;padding:2px;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
input[type=checkbox]{accent-color:var(--tx);width:15px;height:15px}
.row input[type=checkbox]{justify-self:start;margin:0}
.inks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.inks input{width:100%;height:24px;border:1px solid var(--trk);border-radius:6px;background:transparent;padding:2px;cursor:pointer}
.inks input.dim{opacity:.25}
.hint{color:var(--mut);margin:6px 0 8px;line-height:1.45}
#top button.on{background:var(--hov)}
#bWall{display:inline-flex;align-items:center;gap:6px}
#cWall{margin:0;pointer-events:none} /* the button toggles; the box only shows the state */
button:disabled{opacity:.35;cursor:default}
canvas#wall{max-width:100%;max-height:100%;display:none}
#app.wallon canvas#cv{display:none}
#app.wallon canvas#wall{display:block}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:var(--tx);color:var(--panel);padding:7px 12px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}#panel{border-left:0;border-top:1px solid var(--line)}}
.inks{grid-template-columns:repeat(4,1fr)}
.subh{color:var(--mut);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px}
.chips button{padding:3px 7px;border:1px solid var(--trk);border-radius:5px;font-weight:400;font-size:12px;color:var(--mut)}
.chips button.on{background:var(--tx);color:var(--panel);border-color:var(--tx)}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="top">
      <div class="logo">Grid Lab</div>
      <button id="bAll" title="Randomize everything except text and format">Random <kbd>R</kbd></button>
      <button id="bTil" title="Randomize the tile layers (recipes after the references)">Tiles <kbd>G</kbd></button>
      <button id="bWarp" title="Randomize the space warps">Space <kbd>W</kbd></button>
      <button id="bTxt" title="Randomize the text × tiles interaction">Text <kbd>T</kbd></button>
      <button id="bLay" title="Randomize the readable layout">Layout <kbd>L</kbd></button>
      <button id="bCol" title="Random palette">Colors <kbd>C</kbd></button>
      <button id="bWall" title="Preview a row of static banners on a wall"><input type="checkbox" id="cWall" tabindex="-1"> Wall <kbd>V</kbd></button>
      <span class="sp"></span>
      <button id="bPng">PNG ×2</button>
      <button id="bMp4">MP4</button>
    </div>
    <div id="view"><canvas id="cv"></canvas><canvas id="wall"></canvas></div>
    <div id="bar">
      <button id="bPlay" title="Play / pause (space)">❚❚</button>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <span id="tlab">0.0s</span>
    </div>
  </div>
  <div id="panel"></div>
</div>
<div id="toast"></div>
<input type="file" id="fFont" accept=".ttf,.otf,.woff,.woff2" hidden>
<script>
'use strict';
/* Grid Lab — two layers: a readable Swiss text layer and an animated GPU layer of shape instances on a grid.
   Each tile layer places one shape per cell (26 shapes, glyphs from the title font), splits cells into a quadtree,
   turns them in quarter steps, picks shapes and inks by zones / columns / maps, and reacts to the letters per tile. */
/* ================= basics ================= */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, CAP=.72;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const R=Math.random, ri=(a,b)=>a+Math.floor(R()*(b-a+1)), rf=(a,b)=>a+R()*(b-a), pick=a=>a[Math.floor(R()*a.length)];
function hsh(n){const x=Math.sin(n*127.1+P.seed*.0137)*43758.5453;return x-Math.floor(x)}
function fmt(v){return Math.abs(v)>=100?Math.round(v):(Math.round(v*100)/100)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),1600)}


/* ================= data ================= */
const FORMATS={'3:4':[3,4],'4:5':[4,5],'2:3':[2,3],'A-series 1:√2':[1,Math.SQRT2],'F4 895×1280':[895,1280],'1:1':[1,1],'9:16':[9,16],'16:9':[16,9]};
const READ_FONTS={'Inter':'"Inter"','Helvetica':'"Helvetica Neue",Helvetica,Arial,sans-serif','Space Grotesk':'"Space Grotesk"','IBM Plex Sans':'"IBM Plex Sans"','Archivo':'"Archivo"','IBM Plex Mono':'"IBM Plex Mono"','Instrument Serif':'"Instrument Serif"'};
/* former broken-layer faces now live in the shared title list */
Object.assign(READ_FONTS,{'Archivo Black':'"Archivo Black"','Anton':'"Anton"','Unbounded':'"Unbounded"','Rubik Mono One':'"Rubik Mono One"','Bricolage':'"Bricolage Grotesque"'});
const TEMPLATES={giant:'Giant title',cells:'Letter cells',scatter:'Scattered words',columns:'Columns',bigdate:'Big date',corners:'Corners',stagger:'Staggered list',mirror:'Mirrored',vertical:'Vertical title',repeat:'Header + footer',axis:'Axis',bands:'Bands'};
const RMOTION={none:'None',reveal:'Line reveal',slide:'Column slide',jump:'Grid jumps',rise:'Row drift',track:'Tracking',marquee:'Marquee title',step:'Step templates',drift:'Grid breathe'};
const BLAYOUT={fill:'Fill page',stack:'Stack',repeat:'Repeat rows',letters:'Letter grid'};
const BMOTION={none:'None',scroll:'Scroll',hscroll:'Line marquee',lines:'Line shift',pulse:'Pulse',breathe:'Tracking',wobble:'Wobble'};
const CASES={none:'As typed',upper:'UPPER',lower:'lower'};
const BLENDS={'source-over':'Normal','multiply':'Multiply','screen':'Screen','difference':'Difference','exclusion':'Exclusion'};
/* space warps (shared with Line Lab) */
/* space warps: ps = [label,min,max,step,default,[random lo,hi]] (Geo Lab set + noise) */
const WARPS={
 shear:{n:'Shear cells',ops:['Checker','Columns','Random'],ps:[['Amount',-3,3,.01,1.5,[-2,2]],['Cell',.03,.6,.005,.18,[.08,.4]],['Rows',.2,4,.01,1,[.4,2.5]]]},
 steps:{n:'Column steps',ops:['Stairs','Random','Wave','Rows stairs','Rows random'],ps:[['Amount',-.3,.3,.001,.05,[-.1,.1]],['Width',.02,.5,.005,.1,[.05,.25]],['Wave freq',.1,4,.01,1]]},
 fold:{n:'Fold',ops:['Fold X','Fold Y'],ps:[['Amount',0,.4,.001,.1,[.03,.15]],['Frequency',1,40,.1,8,[3,16]],['Envelope',0,1,.01,.5]]},
 uturn:{n:'U-turn',ops:['Bottom','Top','Left','Right'],ps:[['Amount',0,1,.01,1,[.8,1]],['Center X',-.5,.5,.01,0,[-.25,.25]],['Center Y',-.5,.5,.01,0,[-.3,.3]]]},
 polar:{n:'Polar',ops:['Polar','Log spiral','Tunnel'],ps:[['Amount',0,1,.01,1,[.7,1]],['Segments',1,24,1,6,[2,12]],['Twist',-3,3,.01,0,[-1,1]]]},
 perspective:{n:'Perspective',ops:['Floor + ceiling','Floor','Wall'],ps:[['Amount',0,1,.01,1,[.8,1]],['Depth',.05,1,.01,.3,[.1,.6]],['Horizon',-.45,.45,.01,0,[-.25,.25]]]},
 swirl:{n:'Swirl',ops:['Swirl','Ring twist','Ring steps'],ps:[['Amount',-6,6,.01,2,[-4,4]],['Size',.5,20,.01,3,[1,8]],['Center',-.4,.4,.01,0,[-.2,.2]]]},
 kaleido:{n:'Kaleido',ops:['Radial','Mirror X','Mirror Y','Mirror XY'],ps:[['Amount',0,1,.01,1,[.8,1]],['Segments',2,16,1,6,[3,10]],['Offset',-.5,.5,.01,0,[-.2,.2]]]},
 tile:{n:'Tile mirror',ops:['Mirror','Repeat','Brick'],ps:[['Amount',0,1,.01,1,[.8,1]],['Tile',.05,1,.005,.3,[.15,.5]],['Shift',0,1,.01,0]]},
 ripple:{n:'Ripple',ops:['Round','Square','Diamond'],ps:[['Amount',0,.15,.001,.02,[.005,.03]],['Frequency',1,80,.1,20,[8,40]],['Center',-.4,.4,.01,0,[-.2,.2]]]},
 wave:{n:'Wave',ops:['X by Y','Y by X','Both'],ps:[['Amount',0,.3,.001,.04,[.01,.08]],['Frequency',.5,40,.1,6,[2,16]],['Phase step',0,4,.01,0,[0,1.5]]]},
 lens:{n:'Lens',ops:['Bulge','Pinch','Orbiting bulge'],ps:[['Amount',0,3,.01,1,[.5,2.5]],['Radius',.05,1,.01,.35,[.2,.6]],['Center',-.4,.4,.01,0,[-.2,.2]]]},
 pixel:{n:'Quantize',ops:['Squares','Rows','Columns','Steps'],ps:[['Amount',0,1,.01,1,[.8,1]],['Cell',.004,.2,.001,.03,[.02,.08]],['Jitter',0,1,.01,0,[0,.6]]]},
 noise:{n:'Noise',ops:['Smooth','Ridged','Curl'],ps:[['Amount',0,.4,.001,.06,[.02,.12]],['Scale',.3,12,.01,3,[1,6]],['Detail',0,1,.01,.5]]},
};
const WKEYS=Object.keys(WARPS);

/* text × tiles: cell-level modes test the letter mask at each tile's centre, so letters become tile mosaics */
const TMODES={none:'None',pixel:'Tiles in letters',pixout:'Tiles outside letters',swap:'Tiles 2 in letters',finer:'Finer inside',coarser:'Bigger tiles inside',grow:'Bigger shapes inside',turn:'Turn inside',ink:'Accent inside',invert:'Invert inside',knock:'Knockout',window:'Window',push:'Push apart',glass:'Glass letters',lglass:'Liquid glass'};
const GLASS_K=['glass','lglass']; /* text-glass modes: handled by glassCol(), the layer's own uTMode gets 0 */
const TMK=Object.keys(TMODES);
const CELLMODES=['pixel','pixout','swap','finer','coarser','grow','turn','ink'];
/* shape library — order = shader ids */
const SHAPES=['Square','Circle','Ring','Quarter','Quarter arc','Dome','Triangle','Stripes','Diagonal','Target','Nested squares','Nested diamonds','Rainbow','Plus','Cross','Dots','Bead','Truchet','Diamond','Corner L','Half bar','Chevron','Checker','Pill','Cube','Glyph'];
const BANDED=new Set([7,8,9,10,11,12,15,21,22]);
const PICKS=['Random','Zones','Columns','Rows','Level','Checker','Diagonal','Map'];
const ROTS=['None','Random 90°','Random 180°','Zones','Checker','Columns','Noise field','Radial'];
const STYLES=['Fill','Outline','Gradient','Glow','Fill + line'];
const BANDMODES=['Cut (gaps)','Ink sequence','Two-tone'];
const CMODES=['Single ink','Random','Zones','By shape','Columns','Rows','Level','Gradient Y','Map'];
const TILEBG=['None','Next ink','Random ink','Zone ink','Line color'];
const BORDERS=['None','Filled tiles','All tiles'];
const MAPSRC=['None','Noise','Gradient X','Gradient Y','Radial','Random','Text','Rings','Zones'];
const MOTIONS=['None','Flip 90°','Spin','Pulse','Shuffle shapes','Wave','Split breathe','Color steps'];
const BLENDS2=['Normal','Multiply','Screen','Difference'];


/* [name, colours (1st = ground, rest = inks, up to 7), text, accent, line] — the first fourteen are the references */
const PALETTES=[
 ['Glyph night',['#1d2027','#f1eee6'],'#f1eee6','#ff5a36','#f1eee6'],
 ['Confetti',['#fbfaf7','#e8322b','#f6c21c','#1d1d1f','#7cc7e8','#f29ab8','#f08a2c','#9b9b9b'],'#111111','#e8322b','#111111'],
 ['Letterpress',['#f1efe9','#ea4523','#1e2b4d','#9c6a45','#ead9ad','#cfe1e4'],'#1e2b4d','#ea4523','#1e2b4d'],
 ['Pop tiles',['#fdf8e8','#2e66b5','#e8492a','#f6cf2f','#1f9a63','#f39021','#f38fb0','#67b7e3'],'#151515','#e8492a','#151515'],
 ['Marbling',['#eef4f0','#ff2a6a','#ffe600','#2ac8b8','#7a3cff','#ff4a1c','#6bd84a','#2a9bff'],'#111111','#ff2a6a','#2a9bff'],
 ['Gouache',['#f6f2ea','#b9f23a','#111111','#2f56d6','#7fb6ff','#ff4c1e','#c8a6ff','#ff4fa3'],'#111111','#ff4c1e','#111111'],
 ['Wendy',['#39d36b','#ff7ae6','#000000','#eeeeee','#1a6e2f','#148a8a','#e85aa5'],'#000000','#ff7ae6','#000000'],
 ['Pixel map',['#f3f1ee','#2b2b2b','#a9cce8','#1f6fbf','#ffc20e','#ffd3b0','#e81e0e','#a3180c'],'#2b2b2b','#e81e0e','#ffc49a'],
 ['Glitch',['#f2f2f2','#ff1a1a','#0a0a0a','#1f5bff','#ffd83a','#14702e','#f6c6c0','#c3832c'],'#0a0a0a','#ff1a1a','#0a0a0a'],
 ['Ellipse',['#9d8f84','#2f5a1f','#ff2d6b','#c88a0b','#4b4a8c','#0c0c18','#e57390','#ff1414'],'#0c0c18','#ff2d6b','#2f5a1f'],
 ['Sleepwalker',['#fbf7ea','#ff2a2a','#f7a6d7','#1e1e22','#24386e','#1d8a3a','#f5e62a'],'#1e1e22','#ff2a2a','#1e1e22'],
 ['Bokeh',['#050505','#ff6a1a','#ffd23a','#ff2a4a','#2aff8a','#3aa0ff','#fff2c0'],'#f4f4f4','#ffd23a','#f4f4f4'],
 ['Digressing',['#ffffff','#ff1f8e','#12a58a','#d4e830'],'#111111','#ff1f8e','#111111'],
 ['Mosaic',['#000000','#f3f0e8','#ff6fae','#1f6fc7','#1f7a3a','#ffc21a','#ff6a1a','#e8261a'],'#f3f0e8','#ffc21a','#1f6fc7'],
 ['Swiss',['#f2f2f2','#111111','#ff2a1a'],'#111111','#ff2a1a','#111111'],
 ['Blueprint',['#0f2350','#e8eef8','#7fb2ff'],'#e8eef8','#7fb2ff','#7fb2ff'],
 ['Riso',['#f4efe6','#ff4f8b','#2a5bd7','#ffd400'],'#111111','#ff4f8b','#111111'],
 ['Acid',['#e9ff3b','#111111','#7a5cff'],'#111111','#7a5cff','#111111'],
 ['Kraft',['#e6d9c3','#1b1814','#b0472c','#3f6b8a'],'#1b1814','#b0472c','#1b1814'],
];

function mkWarp(type,on,o={}){return Object.assign({on,type,op:0,p:WARPS[type].ps.map(q=>q[4]),sp:0,pu:0},o)}
function mkSlot(o={}){return Object.assign({on:true,shp:[0,1,2,3,4,7],pick:0,lay:0,D:8,asp:1,lv:2,split:.5,sx:0,sy:0,ang:0,cx:0,cy:0,
  size:1,w:.5,n:4,rd:0,gap:0,rot:1,sty:0,lw:.3,soft:0,op:1,blend:0,band:0,cmode:0,ink:0,tbg:0,border:0,
  msrc:0,msc:2,mS:0,mQ:0,mD:0,drop:0,nz:5,zsc:1.5,zdr:false,mo:0,cyc:1,mv:0},o)}
const DEF={tfrost:0,tdisp:.7,wall:false,wallN:5,wallMode:'mix',wallPeople:2,wallTex:true,
 fmt:'3:4',q:.75,aa:true,loop:8,seed:1234,
 title:'Open Jam #30',desc:'Noise Kitchen\n2.12.2026 / 18:00\nKino, Petrohradská\n@noise.kitchen',
 tpl:'giant',rfont:'Inter',tw:900,tspan:1,body:14,mid:2.4,lead:1.15,cols:8,rows:12,margin:38,gutter:12,stairs:0,rcase:'upper',rcol:'text',band:false,rblend:'source-over',grid:false,
 rax:{},
 rmo:'none',rmoAmt:.5,rmoSpd:1,
 tshow:true,tmode:'ink',tamt:.7,tblur:1,tfill:'none',tsrc:'big',
 glyphs:'SYØ+&',
 slots:[mkSlot({shp:[1,2,3,4,5,8,10,15,19,20,25],D:6,lv:3,split:.62,n:4,size:.94}),mkSlot({on:false,shp:[1],D:24,lv:0,ink:1})],
 warps:[mkWarp('noise',false),mkWarp('wave',false),mkWarp('swirl',false)],
 pal:['#1d2027','#f1eee6','#f1eee6','#f1eee6','#f1eee6','#f1eee6','#f1eee6','#f1eee6'],nCol:2,cyc:0,grain:0,txt:'#f1eee6',acc:'#ff5a36',lc:'#f1eee6',
 pngScale:2,mp4Scale:1,fps:30,mq:.15,
};
const LSKEY='gridlab.v1';
/* fictional events with very different amounts of text, to test the layout quickly */
const PRESETS=[
 {n:'One word',title:'Open',desc:''},
 {n:'Club night',title:'Open Jam #30',desc:'Noise Kitchen\nFri 02.12 / 23:00\nKino, Petrohradská'},
 {n:'Exhibition',title:'Pattern\nLanguage',desc:'Geometry, rhythm & optical noise\n14.01–28.02.2027\nHall 3, Kunsthalle\n@geo.lab'},
 {n:'Concert',title:'Orchestra of Broken Clocks',desc:'Live in concert\n22.03.2027, 20:00\nRoxy, Dlouhá 33\nTickets at roxy.example'},

function animItems(items,G,ph){

  items.forEach((it,i)=>{

    else if(m==='jump'){const st=Math.floor(ph*k*4);it.x+=Math.round((hsh(i*7.1+st*3.3)-.5)*a*5)*step}
    else if(m==='rise')it.y+=a*(G.rh+G.g)*1.5*Math.sin(TAU*ph*k+i*.7);
    else if(m==='track')it.ls=a*.3*(.5+.5*Math.sin(TAU*ph*k+i*.6));
    else if(m==='reveal'){const t0=.04+.5*i/Math.max(1,n);it.vis=ph>.94?0:clamp((ph-t0)/(.12+a*.2))}

function drawItem(c,it){

  const wt=it.big?axWeight(P.rfont,P.rax,it.wt):it.wt;
  c.font=`${wt} ${it.sz}px ${it.big?DFAM():BODY_FAM}`;c.textAlign=it.al;c.textBaseline='alphabetic';
  if(HAS_LS)c.letterSpacing=(it.ls*it.sz)+'px';
  const lines=it.s.split('\n'),lh=it.sz*it.lh,fg=colorOf(P.rcol),dir=it.al==='right'?-1:1;
  let budget=it.vis==null?1e9:Math.floor(it.vis*it.s.replace(/\n/g,'').length);
  lines.forEach((ln,i)=>{
    if(budget<=0)return;const shown=ln.slice(0,budget);budget-=ln.length;
    const y=i*lh+it.sz*CAP,sx=it.mq!=null?0:i*STEP*dir;
    if(it.box||P.band){const w=c.measureText(ln).width,pd=it.sz*.18;const x0=sx+(it.al==='right'?-w:it.al==='center'?-w/2:0);
      c.fillStyle=P.acc;c.fillRect(x0-pd,y-it.sz*CAP-pd,w+2*pd,it.sz*CAP+2*pd+it.sz*.2)}

  const D=applyCase(P.desc||'',P.rcase).split('\n').map(x=>x.trim()).filter(Boolean);

/* fvar reader (axes of a variable font): TTF/OTF/WOFF; WOFF2 is brotli-compressed and can't be read here */

      if(pid===3||pid===0){for(let j=0;j<len;j+=2)t+=String.fromCharCode(nt.getUint16(so+off+j))}
      else if(pid===1){for(let j=0;j<len;j++)t+=String.fromCharCode(nt.getUint8(so+off+j))}
      if(t)names[id]=t}}}catch(e){}

  const t4=o=>String.fromCharCode(tbl.getUint8(o),tbl.getUint8(o+1),tbl.getUint8(o+2),tbl.getUint8(o+3)),fx=o=>tbl.getInt32(o)/65536;

}

let fontCount=0;
$('#fFont').onchange=async e=>{

    try{axes=await readFvar(buf.slice(0))}
    catch(err){if(err&&err.message==='woff2'){axes=[{tag:'wght',min:100,def:400,max:900,name:'Weight'},{tag:'wdth',min:50,def:100,max:200,name:'Width'}];

    for(const desc of [()=>{const d={};if(wa&&wa.min>=1&&wa.max<=1000)d.weight=`${wa.min} ${wa.max}`;if(wd)d.stretch=`${wd.min}% ${wd.max}%`;return d},()=>({}),()=>({weight:'100 900'})]){

/* horizontal motion blur: average of shifted copies, so the body stays solid and only the edges smear */
function drawPasserBy(c,x,foot,h,blur,L,dir){
  const pad=h*.6,w=Math.ceil(h*.8+pad*2),hh=Math.ceil(h*1.1);
  const a=el('canvas');a.width=w;a.height=hh;const ac=a.getContext('2d');drawWalker(ac,w/2,hh-2,h,L,dir);

  /* smooth box motion blur by doubling: each pass averages the image with itself shifted (2 taps, alpha .5 each),
     6 passes = 64 evenly spaced taps over the blur length — no ghost copies and no 8-bit banding */
  let cur=a,sh=blur/63;const BW=w+Math.ceil(blur)+2;
  for(let k=0;k<6;k++){const t=el('canvas');t.width=BW;t.height=hh;const tc=t.getContext('2d');tc.globalCompositeOperation='lighter';tc.globalAlpha=.5;
    tc.drawImage(cur,0,0);tc.drawImage(cur,sh,0);cur=t;sh*=2}
  c.save();c.filter=`blur(${Math.max(.5,h*.004).toFixed(1)}px)`; /* a touch of defocus, like the street photos */
  c.drawImage(cur,x-w/2-blur/2,foot-hh+2);c.restore();
}
/* mid and light tones, so the silhouettes read against the dark wall */
const W_COATS=['#b9a083','#5f7358','#7d838b','#9a4a3f','#4a6290','#8a8f96','#c4b9a8','#7a5a44','#3f6f86','#a8935a','#d0cbc2','#b06a3a','#6c5a8a','#e0dbd2'];
const W_SKINS=['#f0cdb0','#e0b799','#c99b7f','#a97a5c','#8f6449','#5e3f2c'];
const W_HAIRS=['#151010','#2a1d16','#4a3020','#a07a50','#c9a46c','#6b6b6b'];
const W_DARKS=['#4a4f57','#3b4a63','#5a5550','#6b6f76','#3f3a34','#2f3a4c','#7a7468'];

const wShade=(col,k)=>{const v=col.startsWith('rgb')?col.match(/[\d.]+/g).slice(0,3).map(Number):hex2rgb(col).map(x=>x*255);
  return 'rgb('+v.map(x=>Math.min(255,Math.round(x*k))).join(',')+')'}; /* accepts #rgb, #rrggbb and rgb() */
/* a cached crowd: count, depth, looks and directions vary; the Wall dice reshuffles it */
let wallCrowd=null;
function makeCrowd(){
  const mx=clamp(P.wallPeople|0,0,8) /* at most 8 people in the scene */,n=mx?ri(Math.ceil(mx/3),mx):0,ppl=[];
  for(let i=0;i<n;i++){
    const coat=pick(W_COATS),legs=pick(W_DARKS),d=R(),hv=rf(.88,1.1); /* d: 0 far … 1 close to the camera */
    ppl.push({d,x:R(),dir:R()<.5?1:-1,hv:rf(.84,1.12),knee:rf(.2,.3),blur:rf(.1,.2), /* higher minimum: nobody stands still */
      L:{hv,coat,coat2:wShade(coat,.82),legs,legs2:wShade(legs,.8),skin:pick(W_SKINS),hairC:pick(W_HAIRS),shoe:pick(['#5a4636','#e8e4dc','#4a4a52','#7a2a22','#b8a27a','#2f3a4c']),
        hair:pick([0,0,1,1,2,3,4,5]),sole:pick(['#e8e4dc','#2a2a2a','#8a6a4a']),cuffs:R()<.3,buttons:R()<.5,belt:R()<.25,beard:R()<.2,glasses:R()<.25,phones:R()<.15,phone:R()<.2,hatC:pick(['#111','#7a2a22','#d8d2c6','#2c3b57','#3d4a3a']),
        coatLen:pick([3.35,3.35,3.1,2.6,2.3]),wd:rf(.85,1.18),legW:rf(.85,1.1),stride:rf(.2,.32),
        bag:pick([null,null,'backpack','shoulder','tote']),bagC:pick(['#6b4a2e','#2a3550','#111','#c9b48a','#7a2a22']),
        scarf:R()<.3?pick(['#b23a2e','#d9c27a','#e8e4dc','#2f5d50']):null,cup:R()<.2}});
  }
  ppl.sort((a,b)=>a.d-b.d);wallCrowd={mx,ppl};
}
function renderWall(ph,scale=1){
  wallRects=[];
  const W=2000*scale,H=1125*scale;if(wcv.width!==W){wcv.width=W;wcv.height=H}
  const c=wctx,n=clamp(P.wallN|0,1,8),[b0w,b0h]=baseSize(),a=b0w/b0h,gapF=.035;
  /* close-up of the wall, no floor: banners tight in a row, as if pasted next to each other */
  const bH=Math.min(H*.62,W*.92/(a*(n+(n-1)*gapF))),bW=bH*a,gap=bW*gapF;
  const cy=H*.43,x0=(W-(n*bW+(n-1)*gap))/2;
  c.drawImage(buildWallBG(W,H),0,0); /* cached concrete wall */
  if(P.wallMode==='mix'&&!wallSet)makeWallSet();
  if(!wallCrowd||wallCrowd.mx!==clamp(P.wallPeople|0,0,8))makeCrowd();
  const orig=P,wasExp=exporting;
  exporting=true;renderK=clamp(bH/b0h,.15,2.5);ensureSize();
  try{
    for(let i=0;i<n;i++){
      P=JSON.parse(JSON.stringify(orig)); /* each banner renders from a copy */
      if(P.wallMode==='mix'){ /* the current poster (own design and text) hangs in the middle, random designs with neighbouring presets around it */
        const m=Math.floor(n/2);
        if(i!==m){Object.assign(P,JSON.parse(JSON.stringify(wallSet[(i<m?i+1:i)%wallSet.length])));
          const L=PRESETS.length,pr=PRESETS[(((P.preset|0)+i-m)%L+L)%L];setTxt(pr)}}
      else if(P.wallMode==='series'){const L=PRESETS.length,pr=PRESETS[(((P.preset|0)+i)%L+L)%L];setTxt(pr)}
      flushVar(); /* fresh font axes for this banner */
      render(P.wallMode==='phases'?(ph+i/n)%1:ph); /* phases: n moments spread over the loop */
      P=orig;
      const x=x0+i*(bW+gap),y=cy-bH/2;wallRects[i]=[x,y,bW,bH];
      c.save();c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=16*scale;c.shadowOffsetY=6*scale;c.fillStyle='#000';c.fillRect(x,y,bW,bH);c.restore();
      c.drawImage(cv,x,y,bW,bH);

  /* passers-by: farther ones smaller and less blurred, closer ones big with feet below the frame */
  /* cut at the knee by the bottom edge; height differs by body length (hv), not by scale */
  /* everyone at the same distance (same scale); d only orders who walks in front */
  wallCrowd.ppl.forEach(p=>{const h=H*.7,hv=p.L.hv||1;
    let foot=H+h*hv*(p.knee||.25);

    const top=foot-h*(1+.81*(hv-1));if(top<H/3)foot+=H/3-top;
    drawPasserBy(c,W*(-.05+p.x*1.1),foot,h,h*p.blur,p.L,p.dir)});
}
/* ---------- click a neighbouring banner on the wall: it becomes the current poster, with the user's text ---------- */
let wallRects=[];
function adoptBanner(i){
  const n=wallRects.length,m=Math.floor(n/2);
  if(P.wallMode!=='mix'||!wallSet||i===m)return;
  const k=(i<m?i+1:i)%wallSet.length,v=wallSet[k];if(!v)return;
  /* the poster being replaced takes the clicked slot, so nothing is lost; a loaded font never moves to a neighbour */
  const old=JSON.parse(JSON.stringify(P));WALL_KEEP.forEach(x=>delete old[x]);
  const FL=typeof WALL_FONTS==='function'?WALL_FONTS():[['rfont',READ_FONTS,'rax']];
  FL.forEach(([fk,map,ax])=>{if(typeof USERF!=='undefined'&&USERF[old[fk]]){const alt=Object.keys(map).filter(q=>!USERF[q]&&q!==v[fk]);if(alt.length){old[fk]=alt[Math.floor(R()*alt.length)];if(ax)old[ax]={}}}});
  wallSet[k]=old;
  Object.assign(P,JSON.parse(JSON.stringify(v))); /* design keys only: text, format and timing stay as they are */
  if(typeof fixText==='function')try{fixText()}catch(e){}
  setWall(false);changed();buildUI();toast('Now editing this poster · Wall shows the previous one in its place');
}
function wallHit(e){const r=wcv.getBoundingClientRect(),x=(e.clientX-r.left)*wcv.width/r.width,y=(e.clientY-r.top)*wcv.height/r.height;
  return wallRects.findIndex(b=>x>=b[0]&&x<=b[0]+b[2]&&y>=b[1]&&y<=b[1]+b[3])}
wcv.onmousemove=e=>{const i=wallHit(e);wcv.style.cursor=(P.wallMode==='mix'&&i>=0&&i!==Math.floor(wallRects.length/2))?'pointer':'default'};
wcv.onclick=e=>{const i=wallHit(e);if(i<0)return;if(P.wallMode!=='mix'){toast('Clicking a banner works in Random designs mode');return}adoptBanner(i)};
function setWall(v){P.wall=v;$('#app').classList.toggle('wallon',v);$('#bWall').classList.toggle('on',v);$('#cWall').checked=v;$('#bMp4').disabled=v;if(v)openS.add('wall');dirty=true}
/* variable-font axes come from the canvas element styles: force a recalc and drop cached fonts before each banner */
function flushVar(){try{if(typeof applyVariations==='function')applyVariations();

  ['dctx','mDctx','sctx','mctx'].forEach(n=>{try{const c=eval(n);if(c)c.font='1px serif'}catch(e){}})}catch(e){}}
/* i = -1 restores the user's own text (Custom); 0…n-1 are the samples. Leaving Custom keeps it in P.custom */
function applyPreset(i){const n=PRESETS.length;
  if(P.preset===-1||P.preset==null)P.custom=txtSnap();
  if(i===-1){if(!P.custom)return;P.preset=-1;Object.assign(P,JSON.parse(JSON.stringify(P.custom)));changed();buildUI();toast('Custom');return}
  P.preset=((i%n)+n)%n;const pr=PRESETS[P.preset];setTxt(pr);changed();buildUI();toast(pr.n)}
function stepPreset(k){const ids=[...(P.custom?[-1]:[]),...PRESETS.map((_,i)=>i)];const j=Math.max(0,ids.indexOf(P.preset??-1));applyPreset(ids[(j+k+ids.length)%ids.length])}
async function exportPNG(){
  if(exporting)return;
  if(P.wall){exporting=true;try{renderWall(phase(),2);const b=await new Promise(r=>wcv.toBlob(r,'image/png'));dl(b,`grid-lab-wall-${P.seed}-${wcv.width}x${wcv.height}.png`)}
    catch(e){alert('PNG error: '+(e&&e.message||e))}finally{exporting=false;renderWall(phase());dirty=true}return}exporting=true;const btn=$('#bPng'),ph=phase();
  try{renderK=P.pngScale;ensureSize();if(needsWarm())await warm(ph,30,btn,'PNG');render(ph,1/30);
    const b=await new Promise(r=>cv.toBlob(r,'image/png'));dl(b,`grid-lab-${P.seed}-${RW}x${RH}.png`)}

async function exportMP4(){
  if(exporting||P.wall)return;
  if(!window.VideoEncoder||!window.VideoFrame||!window.Mp4Muxer){alert('MP4 export needs WebCodecs (Chrome / Edge / Safari 16.4+) and internet to load the muxer.');return}
  const btn=$('#bMp4'),fps=P.fps,N=Math.round(P.loop*fps);exporting=true;
  try{
    renderK=P.mp4Scale;ensureSize();render(0,1/fps);
    const w=RW,h=RH,bitrate=Math.round(w*h*fps*P.mq);
    let codec=null;
    for(const c of ['avc1.640034','avc1.640033','avc1.640028','avc1.4d0028','avc1.42001f']){
      try{const s=await VideoEncoder.isConfigSupported({codec:c,width:w,height:h,bitrate,framerate:fps});if(s.supported){codec=c;break}}catch(e){}}
    if(!codec)throw new Error(`H.264 is not supported at ${w}×${h} — try MP4 scale ×1`);
    if(needsWarm())await warm(0,fps,btn,'MP4');
    const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:w,height:h},fastStart:'in-memory'});
    let err=null;const enc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>{err=e}});

      if(err)throw err;render(i/N,1/fps);

      enc.encode(vf,{keyFrame:i%fps===0});vf.close();

{const f=$('#bAll').onclick;$('#bAll').onclick=()=>{f();if(P.wall){makeWallSet();buildUI()}}}
