<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster Labs</title>
<style>
:root{--bg:#0d0d0f;--card:#151518;--card2:#1c1c21;--line:#2a2a31;--tx:#ececf0;--mu:#8b8b96;--ac:#d6ff3f}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:40px 32px 80px}
header{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:20px;align-items:start;margin:0 auto 36px;max-width:1600px}
header .meta{padding-top:6px}
@media (max-width:600px){header{grid-template-columns:1fr}}
.tabs{display:flex;gap:56px;align-items:flex-start;margin:0}
.tab{all:unset;cursor:pointer;font-size:56px;line-height:.95;letter-spacing:-.03em;font-weight:800;color:#3a3a42;transition:color .15s}
.tab span{color:inherit}
.tab:hover{color:#6a6a74}
.tab.on{color:var(--ac);cursor:default}
.tab:focus-visible{outline:2px solid var(--ac);outline-offset:6px;border-radius:4px}
section[hidden]{display:none}
.meta{color:var(--mu);max-width:520px}
section{max-width:1600px;margin:0 auto 48px}
.ghead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ghead h3{margin:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
.ghead span{color:var(--mu);font-size:13px}
.card.wide .strip img{aspect-ratio:1/1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:20px;max-width:1600px;margin:0 auto}
a.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s,background .15s}
a.card:hover{border-color:var(--ac);background:var(--card2);transform:translateY(-2px)}
a.card:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.strip img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:#222;display:block}
.strip img:nth-child(n+2){transition:transform .2s}
a.card:hover .strip img{transform:scale(1.015)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0}
h2{margin:0;font-size:22px;letter-spacing:-.01em;font-weight:700}
.go{color:var(--mu);font-size:13px;white-space:nowrap}
a.card:hover .go{color:var(--ac)}
p{margin:6px 0 0;color:var(--mu)}
.note{margin-top:8px;font-size:12px;color:#c9a24a}
.note code{background:#000;padding:1px 5px;border-radius:4px;color:var(--tx)}
@media (max-width:600px){body{padding:24px 16px 60px}.tab{font-size:40px}.tabs{gap:48px}.grid{grid-template-columns:1fr}.strip{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1 class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="0">Poster<br><span>Labs</span></button>
    <button class="tab" role="tab" data-tab="1">Typog<br><span>raphy</span></button>
  </h1>
  <div class="meta" id="meta"></div>
</header>
<main id="groups"></main>
<script>
const GROUPS=[
 ['Постерные лабы','Текст + генеративный слой. Превью — случайные постеры.',[
  ['layer','Layer Lab','Layer-Lab/layer-lab.html','Два слоя текста: читаемый швейцарский и сломанный, прогнанный через эффекты до нечитаемости.'],
  ['geo','Geo Lab','Geo-Lab/geo-lab.html','Текст + анимированный геометрический паттерн: полосы, сдвиги, квадродеревья, кольца, плетёнка.'],
  ['line','Line Lab','Line-Lab/line-lab.html','Текст + поле линий: веера, string art, оп-арт волны, туннели, перспективные сетки.'],
  ['stroke','Stroke Lab','Stroke-Lab/stroke-lab.html','Текст + поле коротких штрихов: тире, вращающиеся бруски, кресты, потоки, оверпринт.'],
  ['grid','Grid Lab','Grid-Lab/grid-lab.html','Текст + сетка из экземпляров фигур: квадродерево, зоны, глифы, мозаика.'],
  ['gradient','Gradient Lab','Gradient-Lab/gradient-lab.html','Текст + формы с градиентной заливкой: пилюли, арки, веера, трубки, щупальца, градиентные буквы.'],
  ['carpet','Carpet Lab','Carpet-Lab/carpet-lab.html','Симметричный ковёр с ворсом: поле, медальон, бордюр; заголовок вплетён в узор.'],
  ['creature','Creature Lab','Creature-Lab/creature-lab.html','Существо из фигур в центре листа, текст по краям. 9 скинов × 8 тел.'],
  ['typewriter','Typewriter Lab','Typewriter-Lab/typewriter-lab.html','Весь постер набран на моноширинной сетке: большие буквы и картинки собраны из маленьких знаков.'],
  ['photo','Photo Lab','Photo-Lab/photo-lab.html','Фото + цепочка фотоэффектов (полосы, плитки, смаз, кольца, осколки) и швейцарский текст.'],
  ['dance','Dance Motion Lab','Dance-Motion-Lab/dance-motion.html','Постер из танцевального видео: поза через MediaPipe, следы движения, экспорт PNG/SVG/MP4.'],
  ['poster','Poster Lab','Poster-Lab/poster-lab.html','Первая лаба: типографика, пиксели и фото-ремиксы; Random / Remix / Colors, экспорт PNG, WebM, MP4.'],
]],
 ['Шрифтовые','Инструменты для шрифтов: кинетика, паттерны, спецификации вариативных осей.',[
  ['type','Type Lab','Type-Lab/type-lab.html','Кинетика и постеры для любых шрифтов: загрузи файл, выбери пресет, экспортируй.'],
  ['patterns','Type Patterns','Type-Patterns/index.html','Шрифтовые паттерны: узоры из букв, раскраска в 1–3 цвета, контур, зацикленная анимация.'],
  ['field','Type Field','Type%20Field%209/Type%20Field.html','Спецификации вариативных шрифтов: 18 пресетов (волны, рябь, шахматка, анатомия глифа), загрузка своего шрифта.','wide'],
]],
];
const N=4, root=document.getElementById('groups');
for(const [title,sub,labs] of GROUPS){
  const sec=document.createElement('section');
  sec.innerHTML=`<div class="grid"></div>`;
  const grid=sec.querySelector('.grid');
  for(const [id,name,url,desc,note] of labs){
    const wide=note==='wide', nt=wide?'':note;
    const a=document.createElement('a');
    a.className='card'+(wide?' wide':'');a.href=url;a.target='_blank';a.rel='noopener';
    const imgs=Array.from({length:N},(_,i)=>`<img loading="lazy" src="_index/previews/${id}-${i+1}.jpg" alt="${name} — пример ${i+1}" onerror="this.style.visibility='hidden'">`).join('');
    a.innerHTML=`<div class="strip">${imgs}</div>
      <div class="row"><h2>${name}</h2><span class="go">открыть ↗</span></div>
      <p>${desc}</p>${nt?`<p class="note">${nt}</p>`:''}`;
    grid.appendChild(a);
  }
  root.appendChild(sec);
}
/* tabs: Poster Labs / Typography; the choice is kept in the URL hash */
const secs=[...root.children], tabs=[...document.querySelectorAll('.tab')];
function show(i){
  tabs.forEach((t,k)=>{t.classList.toggle('on',k===i);t.setAttribute('aria-selected',k===i)});
  secs.forEach((x,k)=>x.hidden=k!==i);
  document.getElementById('meta').textContent=GROUPS[i][1];
  history.replaceState(null,'',i?'#typography':'#labs');
}
tabs.forEach((t,k)=>t.onclick=()=>show(k));
show(location.hash==='#typography'?1:0);
</script>
</body>
</html>
