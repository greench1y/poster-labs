<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carpet Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&family=Archivo:wght@400;500;700;900&family=Archivo+Black&family=Anton&family=Unbounded:wght@800&family=Rubik+Mono+One&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<style>
/* minimal UI: white, hairlines, one neutral sans, grey labels, no ornaments — the poster is the only colour */
:root{--bg:#f4f4f4;--panel:#fff;--line:#d4d4d4;--tx:#111;--mut:#555;--hov:#ececec;--trk:#bdbdbd}
@media (prefers-color-scheme: dark){:root{--bg:#0d0d0d;--panel:#161616;--line:#3a3a3a;--tx:#f2f2f2;--mut:#b0b0b0;--hov:#242424;--trk:#555}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 "Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:1fr 300px;height:100vh}
#stage{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:14px 20px}
#top .logo{font-weight:700;margin-right:14px}
#top .sp{flex:1}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:none;border:0;padding:6px 10px;color:var(--tx);font-weight:500;cursor:pointer;white-space:nowrap;border-radius:6px;transition:color .12s,background .12s}
button:hover{color:var(--tx);background:var(--hov)}
button kbd{font:inherit;font-weight:400;color:var(--mut);margin-left:4px}
#view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 32px 24px}
canvas#cv{max-width:100%;max-height:100%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.06)}
#bar{display:flex;gap:12px;align-items:center;padding:12px 20px 16px}
#bar button{width:32px;padding:6px 0;text-align:center}
#bar input[type=range]{flex:1}
#tlab{color:var(--mut);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
#panel{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:8px 0 40px}
details{border-bottom:1px solid var(--line);padding:0 20px}
details:last-of-type{border-bottom:0}
summary{cursor:pointer;padding:12px 0;user-select:none;list-style:none;display:flex;align-items:center;gap:6px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"";order:-1;width:5px;height:5px;border-right:1.5px solid var(--tx);border-bottom:1.5px solid var(--tx);transform:rotate(-45deg);margin:0 6px 0 1px;transition:transform .15s}
details[open]>summary::after{transform:rotate(45deg)}
details[open]{padding-bottom:12px}
summary .tag{font-weight:400;color:var(--mut)}
summary button.dice{order:5}summary input.hdr{order:6}
summary button.dice{margin-left:auto;padding:3px;line-height:0;color:var(--mut)}
summary button.dice:hover{color:var(--tx)}
summary button.dice svg{width:17px;height:17px}
summary input.hdr{margin:0 0 0 6px;cursor:pointer}
summary:not(:has(.dice))>input.hdr{margin-left:auto}
details.off>summary{color:var(--mut)}
details.off>*:not(summary){opacity:.5}
.row{display:grid;grid-template-columns:88px 1fr 34px;gap:10px;align-items:center;margin:7px 0}
.row.wide{grid-template-columns:88px 1fr}
.row label{color:var(--mut);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.row select,.row input[type=text],textarea{width:100%;background:var(--panel);border:1px solid var(--trk);border-radius:6px;padding:5px 7px;outline:none}
.row select:focus,.row input[type=text]:focus,textarea:focus{border-color:var(--mut)}
textarea{resize:vertical;min-height:30px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--trk)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;background:var(--tx);border:0}
input[type=range]::-moz-range-track{height:2px;background:var(--trk)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--tx);border:0}
.row input[type=color]{width:100%;height:24px;border:1px solid var(--trk);border-radius:6px;background:transparent;padding:2px;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
input[type=checkbox]{accent-color:var(--tx);width:15px;height:15px}
.row input[type=checkbox]{justify-self:start;margin:0}
.inks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.inks input{width:100%;height:24px;border:1px solid var(--trk);border-radius:6px;background:transparent;padding:2px;cursor:pointer}
.inks input.dim{opacity:.25}
.hint{color:var(--mut);margin:6px 0 8px;line-height:1.45}
#top button.on{background:var(--hov)}
#bWall{display:inline-flex;align-items:center;gap:6px}
#cWall{margin:0;pointer-events:none} /* the button toggles; the box only shows the state */
button:disabled{opacity:.35;cursor:default}
canvas#wall{max-width:100%;max-height:100%;display:none}
#app.wallon canvas#cv{display:none}
#app.wallon canvas#wall{display:block}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:var(--tx);color:var(--panel);padding:7px 12px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}#panel{border-left:0;border-top:1px solid var(--line)}}
.inks{grid-template-columns:repeat(4,1fr)}
.subh{color:var(--mut);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px}
.chips button{padding:3px 7px;border:1px solid var(--trk);border-radius:5px;font-weight:400;font-size:12px;color:var(--mut)}
.chips button.on{background:var(--tx);color:var(--panel);border-color:var(--tx)}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="top">
      <div class="logo">Carpet Lab <span style="font-weight:400;color:var(--mut);font-size:11px" title="build marker">r48</span></div>
      <button id="bAll" title="Randomize everything except text and format">Random <kbd>R</kbd></button>
      <button id="bDay" title="Carpet of the day: the same carpet for everyone on a given date">Day <kbd>D</kbd></button>
      <button id="bCar" title="Randomize the carpet (recipes after the references)">Carpet <kbd>K</kbd></button>
      <button id="bSym" title="Randomize symmetry and space warps">Symmetry <kbd>S</kbd></button>
      <button id="bWv" title="Randomize stitch, leading and wear">Weave <kbd>V</kbd></button>
      <button id="bTxt" title="Randomize the text × carpet interaction">Text <kbd>T</kbd></button>
      <button id="bLay" title="Randomize the readable layout">Layout <kbd>L</kbd></button>
      <button id="bCol" title="Random palette">Colors <kbd>C</kbd></button>
      <button id="bWall" title="Preview a row of static banners on a wall"><input type="checkbox" id="cWall" tabindex="-1"> Wall <kbd>B</kbd></button>
      <span class="sp"></span>
      <button id="bPng">PNG ×2</button>
      <button id="bMp4">MP4</button>
    </div>
    <div id="view"><canvas id="cv"></canvas><canvas id="wall"></canvas></div>
    <div id="bar">
      <button id="bPlay" title="Play / pause (space)">❚❚</button>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <span id="tlab">0.0s</span>
    </div>
  </div>
  <div id="panel"></div>
</div>
<div id="toast"></div>
<input type="file" id="fFont" accept=".ttf,.otf,.woff,.woff2" hidden>
<script>
'use strict';
/* Carpet Lab — two layers: a readable Swiss text layer and an animated GPU carpet.
   The carpet is three slots — Field (lattice, rings, bands, panels, patchwork), Medallion (stepped / nested shapes) and Border (bands of motifs) —
   folded by a global symmetry, rendered smooth or as stitches (pixel, graph paper, cross-stitch, beads, tesserae, knots), with stained-glass leading. */
/* ================= basics ================= */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, CAP=.72;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
let RNG=Math.random;const R=()=>RNG(), ri=(a,b)=>a+Math.floor(R()*(b-a+1)), rf=(a,b)=>a+R()*(b-a), pick=a=>a[Math.floor(R()*a.length)];
function hsh(n){const x=Math.sin(n*127.1+P.seed*.0137)*43758.5453;return x-Math.floor(x)}
function fmt(v){return Math.abs(v)>=100?Math.round(v):(Math.round(v*100)/100)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),1600)}

/* ================= data ================= */
const FORMATS={'3:4':[3,4],'4:5':[4,5],'2:3':[2,3],'A-series 1:√2':[1,Math.SQRT2],'F4 895×1280':[895,1280],'1:1':[1,1],'9:16':[9,16],'16:9':[16,9]};
const READ_FONTS={'Inter':'"Inter"','Helvetica':'"Helvetica Neue",Helvetica,Arial,sans-serif','Space Grotesk':'"Space Grotesk"','IBM Plex Sans':'"IBM Plex Sans"','Archivo':'"Archivo"','IBM Plex Mono':'"IBM Plex Mono"','Instrument Serif':'"Instrument Serif"'};
/* former broken-layer faces now live in the shared title list */
Object.assign(READ_FONTS,{'Archivo Black':'"Archivo Black"','Anton':'"Anton"','Unbounded':'"Unbounded"','Rubik Mono One':'"Rubik Mono One"','Bricolage':'"Bricolage Grotesque"'});
const TEMPLATES={band:'Title band',center:'Centered title',giant:'Giant title',cells:'Letter cells',scatter:'Scattered words',columns:'Columns',bigdate:'Big date',corners:'Corners',stagger:'Staggered list',vertical:'Vertical title',repeat:'Header + footer',axis:'Axis',bands:'Bands'};
const RMOTION={none:'None',reveal:'Line reveal',slide:'Column slide',jump:'Grid jumps',rise:'Row drift',track:'Tracking',marquee:'Marquee title',step:'Step templates',drift:'Grid breathe'};

};

const STITCH=['Smooth','Pixel','Graph paper','Cross-stitch','Beads','Tesserae','Knots'];

const TMODES={none:'None',woven:'Woven letters',swap:'Motif swap',recolor:'Recolor inside',invert:'Invert inside',finer:'Finer stitch inside',coarser:'Coarser stitch inside',knock:'Knockout',window:'Window',lead:'Lead outline',mirror:'Mirrored letters',push:'Push apart'};
const TMK=Object.keys(TMODES);
const TPLACE={woven:'Woven in',plates:'On plates',margin:'Carpet panel',free:'Free'};
const PLSTYLES=['Box','Rounded','Stepped','Pointed'];
const MSIDES={top:'Top',bottom:'Bottom',tb:'Top + bottom',left:'Left',sides:'Sides'};
const PLCOLS=[['border','Border color'],['ground','Ground'],['line','Line color'],['accent','Accent'],['ink1','Ink 1'],['ink2','Ink 2'],['ink3','Ink 3'],['text','Text color']];

/* [name, colours (1st = ground, rest = inks, up to 7), text, accent, line] — the first fourteen are the references */
const PALETTES=[
 ['Cross-stitch',['#eef1f5','#f6c21a','#3f8fe0','#8fcf5a','#f07ab0','#f59a2c','#8a6ad8','#e8463a'],'#2a2a3a','#e8463a','#3f8fe0'],
 ['Indigo madder',['#1b2440','#a8322a','#e9d9b4','#d9a441','#2f5d8a','#6b2b2b'],'#e9d9b4','#d9a441','#10162b'],
 ['Saffron field',['#d9a23a','#8e2a1b','#1d2b3a','#efe2c2','#5f7a3a','#c4541f'],'#1d2b3a','#8e2a1b','#1d2b3a'],
 ['Ivory and black',['#ece3d0','#1a1613','#8a2b1c','#b88b4a','#4a5a45','#2f2a26'],'#1a1613','#8a2b1c','#1a1613'],
 ['Moss and rust',['#2b2a1e','#b4501f','#d8c58c','#5d6b32','#7a2e1a','#3b4a3e'],'#d8c58c','#b4501f','#14130d'],

function mkWarp(type,on,o={}){return Object.assign({on,type,op:0,p:WARPS[type].ps.map(q=>q[4]),sp:0,pu:0},o)}
/* one slot. x1..x4 depend on the slot: Field x1 ring shape, x2 sectors/panels · Medallion lay shape, D rings, x1 placement, x2 size, x3 halo, x4 steps ·
   Border D bands, x1 corners, x2 width, x3 guard lines */
function mkSlot(o={}){return Object.assign({on:true,lay:0,D:6,asp:1,n:3,w:.6,size:1,rot:0,pick:0,cmode:0,ink:0,tbg:0,mo:0,cyc:1,mot:[1,9,20],x1:0,x2:2,x3:0,x4:0,mv:0,gd:0,fl:false,cs:0},o)}
const DEF={wall:false,wallN:5,wallMode:'mix',wallPeople:2,wallTex:true,
 fmt:'3:4',q:.75,aa:true,loop:8,seed:1234,
 title:'Carpet\nLab',sub:'Rugs, glass & stitches',date:'14.01–28.02.2027',place:'Hall 3, Kunsthalle',credit:'@carpet.lab',
 tpl:'center',rfont:'Inter',tw:900,tspan:1,body:14,mid:2.4,lead:1.15,cols:8,rows:12,margin:38,gutter:12,stairs:0,rcase:'upper',rcol:'text',band:false,rblend:'source-over',grid:false,

  const tt=String(P.title||'').replace(/\s+/g,' ').trim().toUpperCase(),words=[...(tt?[tt]:[]),...String(P.desc||'').toUpperCase().split(/\s+/).filter(Boolean)];if(!words.length)return;
  const W=G.W,H=G.H,B=P.slots[2],bwp=Math.max(B.on?B.x2:0,.06)*H,ib=bwp/2,S=P.body*G.u,PI=Math.PI;
  const w=W-2*ib,h=H-2*ib,Pm=2*(w+h),N=words.length,sp=Pm/N,maxw=Math.max(...words.map(x=>x.length))*.72;
  const z=Math.max(S*.45,Math.min(S,bwp*.5,sp/(maxw*1.25)));
  for(let i=0;i<N;i++){ /* every plate sits on the border's centre line; t runs clockwise from the top centre, (i+.5)/N is mirror-symmetric */
    let s=((i+(tt?0:.5))/N)*Pm,cx,cy,rot=0,side;const hw=words[i].length*z*.36+z*.5;
    if(s<w/2){side='t';cx=W/2+s;cy=ib}
    else{s-=w/2;
      if(s<h){side='r';cx=W-ib;cy=ib+s;rot=PI/2}
      else{s-=h;
        if(s<w){side='b';cx=W-ib-s;cy=H-ib;rot=PI}
        else{s-=w;
          if(s<h){side='l';cx=ib;cy=H-ib-s;rot=-PI/2}
          else{s-=h;side='t';cx=ib+s;cy=ib}}}}
    if(side==='t'||side==='b')cx=Math.max(bwp+hw,Math.min(W-bwp-hw,cx));else cy=Math.max(bwp+hw,Math.min(H-bwp-hw,cy));
    const hh=z*CAP;mk({k:'sub',s:words[i],sz:z,al:'center',rot,wt:i===0&&tt?800:600,ls:.1,x:cx+Math.sin(rot)*hh/2,y:cy-Math.cos(rot)*hh/2});
  }
}
function letterItems(G,T){
  const W=G.W,H=G.H,cx=W/2,cy=H/2,S=P.body*G.u,it=[],tw=titleWoven()?Math.min(P.tw,500):P.tw,lay=P.tlay,B=P.slots[2],bwp=B.on?B.x2*H:0,PI=Math.PI;
  const mk=o=>{o=Object.assign({wt:400,al:'left',rot:0,lh:P.lead,ls:0},o);o.big=o.k==='title';if(!o.big)o.sz=Math.min(o.sz,S*1.45);if(o.vb!=null)o.y=o.vb-blockH(o);it.push(o);return o};
  const inset=lay==='inscr'?bwp+S*.9:G.m;
  descWords(G,mk);
  if(false)[['sub',T.sub.split('\n')[0],'left',0],['date',T.date,'right',0],['place',T.place.split('\n')[0],'left',1],['credit',T.credit,'right',1]].forEach(([k,s,al,bt])=>{
    const o={k,s:String(s).toUpperCase(),sz:S,al,wt:600,ls:.1,x:al==='left'?inset:W-inset};if(bt)o.vb=H-inset;else o.y=inset;mk(o)});
  if(!P.tx)return it; /* Text × carpet off: no title in the carpet */
  const tl=(((P.wov||'').trim()?applyCase(P.wov,P.rcase):T.title).trim()||' ').replace(/\s+/g,' '),L=[...tl.replace(/ /g,'')];if(!L.length)L.push('.');
  const capH=lay==='inscr'?Math.max(.04*H,Math.min(bwp*.8,.12*H)):(P.st>0?.125:.1)*H,sz=capH/CAP,h=capH;
  const put=(ch,x,y,rot,z)=>{const hh=(z||sz)*CAP;mk({k:'title',s:ch,x:x+Math.sin(rot)*hh/2,y:y-Math.cos(rot)*hh/2,sz:z||sz,wt:tw,al:'center',rot,lh:1})};
  const m=G.m+capH*.6;
  if(lay==='ring'){
    const n=L.length,N=n>=3?Math.min(n,24):4,R0=Math.min(P.trad*H,.5*W-capH*1.2),cH=Math.min(capH,2*PI*R0/N/1.4); /* one letter per axis of the carpet's radial symmetry */
    for(let i=0;i<N;i++){const a=-PI/2+i*2*PI/N;put(L[i%n],cx+R0*Math.cos(a),cy+R0*Math.sin(a),a+PI/2,cH/CAP)}
  }else if(lay==='cross'){ /* all letters on every arm; if they would be too small, the first word only */
    const lim=(P.tdiag?(W/2-G.m)/.7071:W/2-G.m)-.08*H,fcap=k=>lim/(1.45*(k-1)+1.1);
    if(P.tsplit){ /* different letters on different axes: letter i goes to arm i%4, so every letter appears once and can be bigger */
      const mN=Math.ceil(Math.max(4,L.length)/4)*4,kmax=mN/4,cS=Math.max(.03*H,Math.min(.12*H,fcap(kmax))),zs=cS/CAP,stp=cS*1.45,r00=.08*H+cS*.5;
      for(let j=0;j<4;j++){const th=-PI/2+j*PI/2+(P.tdiag?PI/4:0);
        for(let k=0;k<kmax;k++){const i=j+4*k;if(i>=mN)break;const r=r00+k*stp;put(L[i%L.length],cx+r*Math.cos(th),cy+r*Math.sin(th),th+PI/2,zs)}}
    }else{
    const w1=[...tl.split(' ')[0]];let LL=L,cH=Math.min(.1*H,fcap(L.length));
    if(cH<.055*H&&w1.length<L.length){LL=w1;cH=Math.min(.1*H,fcap(w1.length))}
    cH=Math.max(cH,.03*H);const zz=cH/CAP,step=cH*1.45,r0=.08*H+cH*.5,n=LL.length;
    for(let j=0;j<4;j++){const th=-PI/2+j*PI/2+(P.tdiag?PI/4:0),seq=(P.tmir&&j%2)?LL.slice().reverse():LL;
      for(let k=0;k<n;k++){const r=r0+k*step;put(seq[k],cx+r*Math.cos(th),cy+r*Math.sin(th),th+PI/2,zz)}}
    }
  }else if(lay==='pinwheel'){
    const d0=P.trad*H,pw=tl.length>8?tl.split(' ')[0]:tl; /* long titles: the first word only */
    for(let j=0;j<4;j++){const th=-PI/2+j*PI/2,d=j%2?Math.min(d0,.5*W-capH*.9-G.m):d0;
      const z=Math.min(sz*.8,fit(pw,tw,Math.min(W,H)*.36));
      put(pw,cx+d*Math.cos(th),cy+d*Math.sin(th),th+PI/2,z)}
  }else if(lay==='inscr'){
    const ib=bwp/2,step=capH*1.3,seq=[...L,null];let idx=0;
    [[ib,0,1,0,0],[W-ib,0,0,1,PI/2],[W-ib,H-ib,-1,0,PI],[ib,H-ib,0,-1,3*PI/2]].forEach(([x0,y0,dx,dy,rot],s)=>{
      const sx=s===0?ib:s===1?W-ib:s===2?W-ib:ib,sy=s===0?ib:s===1?ib:s===2?H-ib:H-ib;
      const len=(dx?W:H)-2*ib-capH*2.4,n=Math.max(0,Math.floor(len/step)+1),off=(len-(n-1)*step)/2+capH*1.2;
      for(let k=0;k<n;k++){const ch=seq[idx%seq.length];idx++;if(ch==null)continue;const t=off+k*step;put(ch,sx+(dx?dx*t:0),sy+(dy?dy*t:0),rot)}});
  }
  return it;
}
const wovenText=()=>((P.wov||'').trim()?P.wov:P.title)||'';
/* ring layout: one letter per symmetry axis, kept in step with the text that is set into the carpet */
function ringSync(){if(P.tlay!=='ring')return;const n=[...wovenText().replace(/\s+/g,'')].length,N=n>=3?Math.min(n,24):4,k=(P.tsymk===2&&N*2<=24)?2:1,v=N*k;
  if(P.sym!==5||P.symN!==v||P.symRot!==-90||P.symSpin!==0){P.sym=5;P.symN=v;P.symRot=-90;P.symSpin=0}}
function layoutText(W,H,ph){ringSync();
  const G=grid(W,H,ph);STEP=P.stairs*(G.cw+G.g);
  const T={};['title','sub','date','place','credit'].forEach(k=>T[k]=applyCase(P[k]||'',P.rcase));
  let name=(titleWoven()&&P.twfull)?'giant':P.tpl;
  if(P.rmo==='step'){const keys=Object.keys(TEMPLATES),st=Math.floor(ph*Math.max(2,P.rmoSpd*3));name=keys[(keys.indexOf(P.tpl)+st)%keys.length]}
  const mg=P.tplace==='margin';
  const items=mg?marginItems(G,T):(useLetters()?letterItems(G,T):tplItems(name,G,T));
  if(!mg||['reveal','track','marquee'].includes(P.rmo))animItems(items,G,ph);
  dctx.setTransform(1,0,0,1,0,0);dctx.clearRect(0,0,W,H);
  if(!P.tshow)return {G,items:[]}; /* copy layer hidden: no text and no mask */
  {const ts=items.filter(i=>i.k==='title');TCAP=ts.length?Math.max(.04,Math.min(...ts.map(i=>i.sz*CAP*(i.sy||1)/H))):.1}
  drawPlates(items,G);
  drawHalo(items,G);
  items.forEach(it=>{if(inMask(it))drawItem(dctx,it)});
  return {G,items};
}
function drawTextTop(c,L,W,H){
  c.save();c.globalCompositeOperation=P.rblend;
  L.items.forEach(it=>{if(!inMask(it))drawItem(c,it)});
  if(P.tfill==='solid'||P.tmode==='none'||P.tplace==='margin'||P.tplace==='plates')c.drawImage(dcv,0,0);
  c.restore();
  const G=L.G;
  if(P.grid&&!exporting){c.save();c.globalAlpha=.5;c.strokeStyle='#ff2bd6';c.lineWidth=Math.max(1,G.u*.8);
    for(let i=0;i<G.cols;i++)c.strokeRect(G.x(i),G.m,G.cw,H-2*G.m);
    for(let j=0;j<G.rows;j++){c.beginPath();c.moveTo(G.m,G.y(j));c.lineTo(W-G.m,G.y(j));c.stroke()}c.restore()}
}

/* ================= main render ================= */
function render(ph){
  ensureSize();applyVariations();
  const L=layoutText(RW,RH,ph);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  if(gl){renderCarpet(ph);ctx.drawImage(glc,0,0)}else{ctx.fillStyle=P.pal[0];ctx.fillRect(0,0,RW,RH)}
  drawTextTop(ctx,L,RW,RH);
}
let clock=0,playing=true,last=performance.now(),dirty=true;
const phase=()=>{const L=P.loop;return (((clock%L)+L)%L)/L};
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!exporting&&P.wall){if(dirty){dirty=false;try{renderWall(phase())}catch(e){console.error(e)}}}
  else if(!exporting){
    if(playing){clock+=dt;dirty=true}
    if(dirty){dirty=false;const ph=phase();try{render(ph)}catch(e){console.error(e)}
      $('#scrub').value=Math.round(ph*1000);$('#tlab').textContent=(ph*P.loop).toFixed(1)+'s'}
  }
  requestAnimationFrame(frame);
}

/* fvar reader (axes of a variable font): TTF/OTF/WOFF; WOFF2 is brotli-compressed and can't be read here */
async function readFvar(buf){
  const dv=new DataView(buf);
  const tag=o=>String.fromCharCode(dv.getUint8(o),dv.getUint8(o+1),dv.getUint8(o+2),dv.getUint8(o+3));
  const sig=tag(0);
  const inflate=async u8=>{const ds=new DecompressionStream('deflate');const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())};
  const grab=async name=>{
    if(sig==='wOFF'){const n=dv.getUint16(12);
      for(let i=0;i<n;i++){const o=44+i*20;if(tag(o)===name){const off=dv.getUint32(o+4),cl=dv.getUint32(o+8),ol=dv.getUint32(o+12);
        const raw=new Uint8Array(buf,off,cl);const u8=cl<ol?await inflate(raw):raw.slice();return new DataView(u8.buffer,u8.byteOffset,u8.byteLength)}}
      return null}
    if(sig==='wOF2')throw new Error('woff2');
    const base=sig==='ttcf'?dv.getUint32(12):0,n=dv.getUint16(base+4);
    for(let i=0;i<n;i++){const o=base+12+i*16;if(tag(o)===name)return new DataView(buf,dv.getUint32(o+8),dv.getUint32(o+12))}
    return null};
  const tbl=await grab('fvar');if(!tbl)return [];
  const names={};
  try{const nt=await grab('name');if(nt){const cnt=nt.getUint16(2),so=nt.getUint16(4);
    for(let i=0;i<cnt;i++){const o=6+i*12,pid=nt.getUint16(o),id=nt.getUint16(o+6),len=nt.getUint16(o+8),off=nt.getUint16(o+10);
      if(names[id]&&pid!==3)continue;let t='';
      if(pid===3||pid===0){for(let j=0;j<len;j+=2)t+=String.fromCharCode(nt.getUint16(so+off+j))}
      else if(pid===1){for(let j=0;j<len;j++)t+=String.fromCharCode(nt.getUint8(so+off+j))}
      if(t)names[id]=t}}}catch(e){}
  const ao=tbl.getUint16(4),cnt=tbl.getUint16(8),sz=tbl.getUint16(10),axes=[];
  const t4=o=>String.fromCharCode(tbl.getUint8(o),tbl.getUint8(o+1),tbl.getUint8(o+2),tbl.getUint8(o+3)),fx=o=>tbl.getInt32(o)/65536;
  for(let i=0;i<cnt;i++){const o=ao+i*sz,tg=t4(o);axes.push({tag:tg,min:fx(o+4),def:fx(o+8),max:fx(o+12),name:names[tbl.getUint16(o+18)]||AXNAMES[tg]||tg})}
  return axes;
}
const AXNAMES={wght:'Weight',wdth:'Width',slnt:'Slant',ital:'Italic',opsz:'Optical size'};
let fontCount=0;
$('#fFont').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;e.target.value='';
  try{
    const buf=await f.arrayBuffer();let axes=[],note='';
    try{axes=await readFvar(buf.slice(0))}
    catch(err){if(err&&err.message==='woff2'){axes=[{tag:'wght',min:100,def:400,max:900,name:'Weight'},{tag:'wdth',min:50,def:100,max:200,name:'Width'}];
      note='WOFF2: axes can\'t be read, showing typical wght/wdth. Load TTF/OTF for the exact axes.'}}
    const fam='LLUser'+(++fontCount),wa=axes.find(a=>a.tag==='wght'),wd=axes.find(a=>a.tag==='wdth');
    let ff=null,lastErr=null;
    for(const desc of [()=>{const d={};if(wa&&wa.min>=1&&wa.max<=1000)d.weight=`${wa.min} ${wa.max}`;if(wd)d.stretch=`${wd.min}% ${wd.max}%`;return d},()=>({}),()=>({weight:'100 900'})]){
      try{ff=new FontFace(fam,buf.slice(0),desc());await ff.load();break}catch(err){lastErr=err;ff=null}}
    if(!ff)throw lastErr||new Error('browser rejected the font');
    document.fonts.add(ff);
    let name=f.name.replace(/\.[^.]+$/,'');while(READ_FONTS[name]&&!USERF[name])name+=' *';
    USERF[name]={axes};READ_FONTS[name]=`"${fam}"`;
    const vals={};axes.forEach(a=>vals[a.tag]=a.def);
    P.rfont=name;P.rax=vals;
    lastVar='';changed();buildUI();toast('Font loaded: '+name+(axes.length?` · ${axes.length} axes`:''));
    if(note)setTimeout(()=>alert(note),50);
  }catch(err){alert('Could not load this font: '+(err&&err.message||err))}
};

$('#bAll').onclick=doAll;$('#bDay').onclick=doDay;$('#bCar').onclick=doCar;$('#bSym').onclick=doSym;$('#bWv').onclick=doWv;$('#bTxt').onclick=doTxt;$('#bLay').onclick=doLay;$('#bCol').onclick=doCol;
$('#bPng').onclick=exportPNG;$('#bMp4').onclick=exportMP4;
$('#bWall').onclick=()=>{setWall(!P.wall);changed();buildUI()};
/* on the wall Random also reshuffles the other banners, the people and the wall */
{const f=$('#bAll').onclick;$('#bAll').onclick=()=>{f();if(P.wall){makeWallSet();buildUI()}}}
const setPlay=v=>{playing=v;$('#bPlay').textContent=v?'❚❚':'▶'};
$('#bPlay').onclick=()=>setPlay(!playing);
$('#scrub').oninput=e=>{setPlay(false);clock=e.target.value/1000*P.loop;dirty=true};
window.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='r'){doAll();if(P.wall){makeWallSet();buildUI()}}else if(k==='k')doCar();else if(k==='s')doSym();else if(k==='v')doWv();else if(k==='t')doTxt();else if(k==='l')doLay();else if(k==='c')doCol();else if(k==='d')doDay();
  else if(k===' '){e.preventDefault();setPlay(!playing)}
  else if(k===']')stepPreset(1);else if(k==='[')stepPreset(-1);
  else if(k==='b'){setWall(!P.wall);changed();buildUI()}
});
fixText();setWall(!!P.wall);buildUI();
const preload=Object.values(READ_FONTS).flatMap(f=>[300,400,500,700,900].map(w=>`${w} 30px ${f}`));
Promise.all(preload.map(f=>document.fonts.load(f).catch(()=>{}))).then(()=>{fontsTick++;dirty=true});
document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>{fontsTick++;dirty=true});
requestAnimationFrame(frame);
</script>
</body>
</html>
