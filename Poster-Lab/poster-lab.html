    else pos=Math.hypot(l.x-W/2,l.y-H/2)/maxD;
    let u=pos-t+(l.jit-.5)*P.uJit*.18;u=((u%1)+1)%1;               // бегущая волна, целый цикл за луп
    // фронт (рост) → плато (залив) → спад
    const plat=P.uPlateau*(1-rise-fall);
    let g=sm(0,rise,1-u)*(1-sm(0,fall,(1-u)-rise-plat));
    // 1-u: расстояние позади фронта (0 — фронт, 1 — далеко позади)
    const s=1+P.uGrow*g;
    if(g>.04&&(usePhoto||useColor)&&g>.5)big.push([l,s]);
    const k=Math.round(clamp(g*1.2,0,1)*10);
    if(g<=.5||useColor||!usePhoto){
      c.fillStyle=g>.5&&useColor?acc:cols[k];
      if(g<.02)c.fillText(l.ch,l.x,l.y);
      else{c.save();c.translate(l.x,l.y-L.fs*.3);c.scale(s,s);c.fillStyle=g>.5&&useColor?acc:cols[k];c.fillText(l.ch,0,L.fs*.3);c.restore()}
    }
  }
  if(usePhoto&&big.length){
    if(uMask.width!==W||uMask.height!==H){uMask.width=W;uMask.height=H}
    uMx.setTransform(1,0,0,1,0,0);uMx.globalCompositeOperation='source-over';uMx.clearRect(0,0,W,H);
    uMx.font=fontStr(L.fs);uMx.textAlign='center';uMx.textBaseline='alphabetic';uMx.fillStyle='#000';
    for(const [l,s] of big){uMx.save();uMx.translate(l.x,l.y-L.fs*.3);uMx.scale(s,s);uMx.fillText(l.ch,0,L.fs*.3);uMx.restore()}
    uMx.globalCompositeOperation='source-in';uMx.drawImage(tex,0,0);uMx.globalCompositeOperation='source-over';
    c.save();if(P.uFill==='photo+color')c.globalCompositeOperation='multiply';   // фото тонируется цветом шейпа
    c.drawImage(uMask,0,0);c.restore();
  }
}

/* ---------- Mode V: Crystal Facets (фото как грани стекла/алмаза: ячейки Вороного, каждая со своим сдвигом/поворотом/зумом фото; грани шевелятся) ---------- */
let vLay={key:'',seeds:[]};
function vLayout(){
  const key=[W,H,P.seed,P.vN,P.vSpread,P.vShift,P.vTurn,P.vZoom].join('|');
  if(vLay.key===key)return vLay.seeds;
  const rg=rng(P.seed*149+3), D=Math.PI/180, seeds=[];
  for(let i=0;i<P.vN;i++){
    // неравномерное распределение: часть центров кучкуется → крупные и мелкие грани
    const cl=rg()<P.vSpread*.5, bx=cl?W*(.2+rg()*.6):W*rg(), by=cl?H*(.2+rg()*.6):H*rg();
    seeds.push({bx,by,k:1+Math.floor(rg()*2),ph:[rg()*TAU,rg()*TAU,rg()*TAU],
      ox:(rg()*2-1)*P.vShift*W*.12, oy:(rg()*2-1)*P.vShift*W*.12, a:(rg()*2-1)*P.vTurn*14*D, z:1+P.vZoom*.28*(rg()*1.2-.2), sh:rg()*2-1});
  }
  vLay.key=key;vLay.seeds=seeds;return seeds;
}
function vCell(i,pts,m){
  let poly=[[-m,-m],[W+m,-m],[W+m,H+m],[-m,H+m]];
  const [px,py]=pts[i];
  for(let j=0;j<pts.length&&poly.length;j++){
    if(j===i)continue;
    const [qx,qy]=pts[j], nx=qx-px, ny=qy-py, mx=(px+qx)/2, my=(py+qy)/2;
    const out=[];
    for(let k=0;k<poly.length;k++){
      const a=poly[k], b=poly[(k+1)%poly.length];
      const da=(a[0]-mx)*nx+(a[1]-my)*ny, db=(b[0]-mx)*nx+(b[1]-my)*ny;     // ≤0 — ближе к i
      if(da<=0)out.push(a);
      if((da<0&&db>0)||(da>0&&db<0)){const t=da/(da-db);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}
    }
    poly=out;
  }
  return poly;
}
// фото с зеркальным продолжением за краями: сдвиг/поворот граней не открывает пустоту у края листа
const vTexC=mk(),vTx=vTexC.getContext('2d');let vTexKey='',vPad=0;
function vTexture(){
  const key=[srcVer,W,H].join('|'), pad=Math.ceil(Math.max(W,H)*.3);
  if(vTexKey===key)return vTexC;
  const src2=srcAlpha();
  vTexC.width=W+2*pad;vTexC.height=H+2*pad;vTx.setTransform(1,0,0,1,0,0);vTx.clearRect(0,0,vTexC.width,vTexC.height);
  for(const fy of [-1,0,1])for(const fx of [-1,0,1]){            // 3×3 плитки; соседние отражены зеркально
    vTx.save();vTx.translate(pad+fx*W+W/2,pad+fy*H+H/2);vTx.scale(fx?-1:1,fy?-1:1);
    vTx.drawImage(src2,-W/2,-H/2);vTx.restore();
  }
  vTexKey=key;vPad=pad;return vTexC;
}
const vFx=mk(),vFxx=vFx.getContext('2d');
function renderV(c,ph){
  c.setTransform(1,0,0,1,0,0);c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const seeds=vLayout(), tex=vTexture(), pad=vPad, w=P.vWiggle, N=seeds.length;
  const pts=seeds.map(s=>[s.bx+w*W*.06*Math.sin(ph*s.k+s.ph[0]), s.by+w*H*.05*Math.sin(ph*s.k+s.ph[1])]);
  // активная грань с зерном и блером (одна за раз; меняется vSwap раз за луп, с короткой перекрёстной сменой)
  const act=new Map(), rgA=rng(P.seed*7+1), order=[...Array(N).keys()].sort(()=>rgA()-.5);
  if(P.vSwap<=0)act.set(order[0],1);
  else{
    const sg=P.vSwap, t=ph/TAU*sg, k=Math.min(sg-1,Math.floor(t)), f=t-k, fade=.18;
    const wIn=Math.min(1,f/fade), wOut=Math.min(1,(1-f)/fade);
    act.set(order[k%N],Math.min(wIn,wOut,1));
    if(f<fade)act.set(order[((k-1+sg)%sg)%N],1-wIn);                       // предыдущая затухает
  }
  for(let i=0;i<N;i++){
    const s=seeds[i], poly=vCell(i,pts,10);if(poly.length<3)continue;
    let cx=0,cy=0;poly.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=poly.length;cy/=poly.length;
    const ox=s.ox+w*W*.015*Math.sin(ph*s.k+s.ph[2]), oy=s.oy+w*W*.015*Math.cos(ph*s.k+s.ph[2]), a=s.a+w*.04*Math.sin(ph*s.k+s.ph[0]+1), z=s.z+w*.03*Math.sin(ph+s.ph[1]);
    const path=()=>{c.beginPath();c.moveTo(poly[0][0],poly[0][1]);for(let k=1;k<poly.length;k++)c.lineTo(poly[k][0],poly[k][1]);c.closePath()};
    const aw=act.get(i)||0;
    const tr=()=>{c.translate(cx+ox,cy+oy);c.rotate(a);c.scale(z,z);c.translate(-cx,-cy)};
    c.save();path();c.clip();tr();c.drawImage(tex,-pad,-pad);c.restore();
    if(aw>0&&(P.vBlur>0||P.vGrain>0)){
      // прогрессивные блер и зерно: нарастают вдоль грани от 0 до максимума (градиентная маска)
      const th=s.ph[2], dx=Math.cos(th), dy=Math.sin(th);
      let t0=1e9,t1=-1e9;poly.forEach(p=>{const t=p[0]*dx+p[1]*dy;t0=Math.min(t0,t);t1=Math.max(t1,t)});
      const mid=(t0+t1)/2, mx=cx-dx*(cx*dx+cy*dy-mid), my=cy-dy*(cx*dx+cy*dy-mid), h=(t1-t0)/2;
      const mkGrad=(cx2)=>{const gr=cx2.createLinearGradient(mx-dx*h,my-dy*h,mx+dx*h,my+dy*h);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.25,'rgba(0,0,0,.08)');gr.addColorStop(1,'rgba(0,0,0,1)');return gr};
      if(vFx.width!==W||vFx.height!==H){vFx.width=W;vFx.height=H}
      if(P.vBlur>0){
        vFxx.setTransform(1,0,0,1,0,0);vFxx.globalCompositeOperation='source-over';vFxx.globalAlpha=1;vFxx.clearRect(0,0,W,H);
        vFxx.save();vFxx.beginPath();vFxx.moveTo(poly[0][0],poly[0][1]);for(let k=1;k<poly.length;k++)vFxx.lineTo(poly[k][0],poly[k][1]);vFxx.closePath();vFxx.clip();
        vFxx.translate(cx+ox,cy+oy);vFxx.rotate(a);vFxx.scale(z,z);vFxx.translate(-cx,-cy);
        vFxx.filter=`blur(${(P.vBlur*16*RS).toFixed(1)}px)`;vFxx.drawImage(tex,-pad,-pad);vFxx.filter='none';vFxx.restore();
        vFxx.globalCompositeOperation='destination-in';vFxx.fillStyle=mkGrad(vFxx);vFxx.fillRect(0,0,W,H);vFxx.globalCompositeOperation='source-over';
        c.save();c.globalAlpha=aw;c.drawImage(vFx,0,0);c.restore();
      }
      if(P.vGrain>0){
        if(!noisePat)initNoise();
        vFxx.setTransform(1,0,0,1,0,0);vFxx.globalCompositeOperation='source-over';vFxx.globalAlpha=1;vFxx.clearRect(0,0,W,H);
        vFxx.save();vFxx.beginPath();vFxx.moveTo(poly[0][0],poly[0][1]);for(let k=1;k<poly.length;k++)vFxx.lineTo(poly[k][0],poly[k][1]);vFxx.closePath();vFxx.clip();
        const q=Math.floor(ph/TAU*18);vFxx.translate(Math.floor(hash01(q,1)*256),Math.floor(hash01(q,2)*256));vFxx.scale(RS,RS);
        vFxx.fillStyle=noisePat;vFxx.fillRect(-256,-256,(W+256)/RS+256,(H+256)/RS+256);vFxx.restore();
        vFxx.setTransform(1,0,0,1,0,0);vFxx.globalCompositeOperation='destination-in';vFxx.fillStyle=mkGrad(vFxx);vFxx.fillRect(0,0,W,H);vFxx.globalCompositeOperation='source-over';
        c.save();c.globalCompositeOperation='overlay';c.globalAlpha=Math.min(1,P.vGrain*.9*aw);c.drawImage(vFx,0,0);c.restore();
      }
    }
    if(P.vShade>0){
      c.save();path();
      const sh=s.sh*P.vShade*(1+.3*w*Math.sin(ph+s.ph[0]));
      c.fillStyle=sh>0?`rgba(255,255,255,${sh*.6})`:`rgba(0,0,0,${-sh*.6})`;c.fill();c.restore();
    }
  }
  if(P.tOn)drawTextLayer(c,ph,P.tAlpha,P.tBlend);
}

/* ---------- Mode W: Mirror Folds (фото многократно отражено само в себя зеркальными линиями: параллельные / радиальные / случайные) ---------- */
const wA=mk(),wAx=wA.getContext('2d'),wB=mk(),wBx=wB.getContext('2d');
function renderW(c,ph){
  c.setTransform(1,0,0,1,0,0);c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  for(const cv2 of [wA,wB])if(cv2.width!==W||cv2.height!==H){cv2.width=W;cv2.height=H}
  const tex=srcAlpha(), D=Math.PI/180, rg=rng(P.seed*163+5), N=P.wN;
  // исходное фото с зумом и дрейфом
  let cur=wA, oth=wB, cx=wAx, ox=wBx;
  cx.setTransform(1,0,0,1,0,0);cx.globalCompositeOperation='source-over';cx.clearRect(0,0,W,H);
  const z=P.wZoom, dx=P.wPan*W*.04*Math.sin(ph), dy=P.wPan*H*.03*Math.sin(ph+1.3);
  cx.save();cx.translate(W/2+dx,H/2+dy);cx.scale(z,z);cx.translate(-W/2,-H/2);cx.drawImage(tex,0,0);cx.restore();
  const L=(W+H)*2, base=P.wAngle*D, mv=P.wMove;
  for(let i=0;i<N;i++){
    let px,py,th;
    rg();const jx=rg(), jy=rg(), jt=rg()*2-1, k=1+Math.floor(rg()*2), pa=rg()*TAU;
    if(P.wMode==='parallel'){px=W*(.5+(jx-.5)*P.wSpread*1.1);py=H/2;th=base+Math.PI/2+jt*P.wTilt*.5}
    else if(P.wMode==='radial'){px=W/2+(jx-.5)*P.wSpread*W*.3;py=H/2+(jy-.5)*P.wSpread*H*.3;th=base+i*Math.PI/N+jt*P.wTilt*.2}
    else{px=W*(.5+(jx-.5)*P.wSpread*1.1);py=H*(.5+(jy-.5)*P.wSpread*1.1);th=base+rg()*Math.PI+jt*P.wTilt}
    // сохраняется сторона, где лежит центр кадра (по базовому положению линии) — зеркалим противоположную, так кадр не бывает пустым
    const scn=(W/2-px)*(-Math.sin(th))+(H/2-py)*Math.cos(th), side=scn>0?-1:1;
    // движение зеркал (целые циклы за луп)
    th+=mv*.22*Math.sin(ph*k+pa);px+=mv*W*.06*Math.sin(ph*k+pa+1.1);py+=mv*H*.04*Math.sin(ph*k+pa+2.2);
    const dxn=Math.cos(th), dyn=Math.sin(th), nx=-dyn*side, ny=dxn*side;
    ox.setTransform(1,0,0,1,0,0);ox.globalCompositeOperation='source-over';ox.clearRect(0,0,W,H);ox.drawImage(cur,0,0);
    ox.save();
    ox.beginPath();ox.moveTo(px-dxn*L,py-dyn*L);ox.lineTo(px+dxn*L,py+dyn*L);ox.lineTo(px+dxn*L+nx*L,py+dyn*L+ny*L);ox.lineTo(px-dxn*L+nx*L,py-dyn*L+ny*L);ox.closePath();ox.clip();
    ox.clearRect(0,0,W,H);
    const a=2*dxn*dxn-1, b=2*dxn*dyn, d=2*dyn*dyn-1, e=px-(a*px+b*py), f=py-(b*px+d*py);
    ox.setTransform(a,b,b,d,e,f);ox.drawImage(cur,0,0);
    ox.restore();
    [cur,oth]=[oth,cur];[cx,ox]=[ox,cx];
  }
  c.drawImage(cur,0,0);
  if(P.tOn)drawTextLayer(c,ph,P.tAlpha,P.tBlend);
}

/* ---------- Mode X: Photo Rings (фото нарезано на концентрические кольца; каждое вращается со своей скоростью/направлением/сдвигом; часть колец — с текстом) ---------- */
let xLay={key:'',rings:[]};
function xLayout(){
  const key=[W,H,P.seed,P.xRings,P.xWidthVar,P.xHole,P.xRadius,P.xDir,P.xSpeed,P.xCx,P.xCy,P.xTextShare,P.xOffset].join('|');
  if(xLay.key===key)return xLay;
  const rg=rng(P.seed*173+9), N=Math.min(16,P.xRings), cx=W/2+P.xCx*W*.35, cy=H/2+P.xCy*H*.35;
  const Rmax=Math.min(W,H)/2*P.xRadius;              // радиус самого большого кольца; может выходить за край листа
  const r0=Rmax*P.xHole, span=Rmax-r0, ws=[];let tot=0;
  for(let i=0;i<N;i++){const w=1+P.xWidthVar*(rg()*2-1)*.85;ws.push(w);tot+=w}
  const rings=[];let r=r0;
  for(let i=0;i<N;i++){
    const w=ws[i]/tot*span, rr0=r, rr1=r+w;r=rr1;
    rings.push({r0:rr0,r1:rr1,off:(rg()*2-1)*Math.PI*P.xOffset,
      k:1+Math.floor(rg()*P.xSpeed),dir:P.xDir==='clockwise'?1:P.xDir==='counter-clockwise'?-1:(rg()<.5?-1:1),txt:rg()<P.xTextShare,ci:i,ph:rg()*TAU});
  }
  xLay={key,rings,cx,cy};return xLay;
}
function renderX(c,ph){
  c.setTransform(1,0,0,1,0,0);c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const L=xLayout(), tex=srcAlpha(), pl=pal().filter(x=>x.toLowerCase()!==P.bg.toLowerCase());
  const ws=[...P.text.replace(/\s+/g,' ').trim()];if(!ws.length)ws.push(' ');ws.push(' ');
  const R=L.rings.length?L.rings[L.rings.length-1].r1:0, kS=Math.max(.01,2*R/Math.min(W,H));   // фото растянуто по радиусу самого большого кольца → поворот не открывает срезов
  for(const rg of L.rings){
    if(rg.r1-rg.r0<1)continue;
    const th=rg.off+(P.xMotion==='spin'?rg.dir*rg.k*ph:rg.dir*.35*Math.sin(ph*rg.k+rg.ph));
    c.save();
    c.beginPath();c.arc(L.cx,L.cy,rg.r1,0,TAU);c.moveTo(L.cx+rg.r0,L.cy);c.arc(L.cx,L.cy,rg.r0,0,TAU,true);c.clip();
    if(rg.txt){
      const col=pl[rg.ci%Math.max(1,pl.length)]||P.fg, rm=(rg.r0+rg.r1)/2, w=rg.r1-rg.r0, fs=Math.min(w*.62*P.xTextSize,rm*.9), D=Math.ceil(rg.r1*2)+2;
      const ckey=[W,H,P.text,P.font,P.weight,varStr(),P.xTextSize,col,rg.r0|0,rg.r1|0].join('|');
      if(D<=2000){                                                   // кольцо с текстом рисуется один раз в кэш, дальше только поворачивается
        if(!rg.cache||rg.ckey!==ckey){
          const cc=rg.cache||mk();cc.width=D;cc.height=D;const x=cc.getContext('2d');
          xRingText(x,D/2,D/2,rg,col,fs,ws,0);rg.cache=cc;rg.ckey=ckey;
        }
        c.restore();c.save();
        c.beginPath();c.arc(L.cx,L.cy,rg.r1,0,TAU);c.moveTo(L.cx+rg.r0,L.cy);c.arc(L.cx,L.cy,rg.r0,0,TAU,true);c.clip();
        c.translate(L.cx,L.cy);c.rotate(th);c.drawImage(rg.cache,-D/2,-D/2);
      }else{c.fillStyle=col;c.fillRect(0,0,W,H);xRingText(c,L.cx,L.cy,rg,col,fs,ws,th)}
    }else{
      c.translate(L.cx,L.cy);c.rotate(th);c.scale(kS,kS);
      c.drawImage(tex,-W/2,-H/2);
    }
    c.restore();
  }
}

// рисует кольцо с текстом (заливка кольца цветом + строка по окружности) вокруг (cx,cy), повёрнутое на th
function xRingText(c,cx,cy,rg,col,fs,ws,th){
  c.save();
  c.beginPath();c.arc(cx,cy,rg.r1,0,TAU);c.moveTo(cx+rg.r0,cy);c.arc(cx,cy,rg.r0,0,TAU,true);c.fillStyle=col;c.fill('evenodd');
  const rm=(rg.r0+rg.r1)/2;
  if(fs>=5){
    c.font=fontStr(fs);c.fillStyle=textOn(col);c.textAlign='center';c.textBaseline='middle';
    const adv=ch=>(ch===' '?.32:ch.codePointAt(0)>0x2E80?1:.58)*fs, wd=ws.map(adv), per=wd.reduce((a,b)=>a+b,0);
    const circ=TAU*rm, reps=Math.max(1,Math.round(circ/per)), kk=circ/(reps*per);       // целое число повторов по кольцу
    let sacc=0;
    for(let r2=0;r2<reps;r2++)for(let i=0;i<ws.length;i++){
      const wch=wd[i]*kk, a=(sacc+wch/2)/rm+th;sacc+=wch;
      if(ws[i]===' ')continue;
      c.save();c.translate(cx+Math.cos(a)*rm,cy+Math.sin(a)*rm);c.rotate(a+Math.PI/2);c.fillText(ws[i],0,0);c.restore();
    }
  }
  c.restore();
}

/* ---------- Mode Y: Border Web (узлы всегда на границе листа и соединены не подряд; фото видно внутри получившейся фигуры; текст вдоль связей) ---------- */
function yPerim(sv){
  const Pm=2*(W+H), d=(((sv%1)+1)%1)*Pm;
  if(d<W)return [d,0];if(d<W+H)return [W,d-W];if(d<2*W+H)return [W-(d-W-H),H];return [0,H-(d-2*W-H)];
}
function yStatesGen(){
  const N=P.yN,K=P.yStates,st=[];
  for(let k=0;k<K;k++){
    const rg=rng(P.seed*191+k*23+7), off=rg(), v=[];
    for(let i=0;i<N;i++)v.push((off+(i+rg()*.9)/N)%1);
    st.push(v);
  }
  return st;
}
function yNodes(ph){
  const st=yStatesGen(),K=st.length,t=(ph/TAU)*K,k=Math.min(K-1,Math.floor(t)),f=t-k;
  const hold=P.yHold,p=f<hold?0:tmEase[P.yEase]((f-hold)/Math.max(1e-6,1-hold));
  const a=st[k],b=st[(k+1)%K];
  return a.map((v,i)=>{const d=((b[i]-v+1.5)%1)-.5;return yPerim(v+d*p)});            // по границе кратчайшим путём
}
function yCycles(N){
  const rg=rng(P.seed*191+99), next=new Array(N);
  if(P.yMode==='random'){const idx=[...Array(N).keys()];for(let i=N-1;i>0;i--){const j=Math.floor(rg()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}for(let i=0;i<N;i++)next[idx[i]]=idx[(i+1)%N];}
  else for(let i=0;i<N;i++)next[i]=(i+P.yStep)%N;
  const seen=new Array(N).fill(false),cycles=[];
  for(let i=0;i<N;i++){if(seen[i])continue;const cy=[];let j=i;while(!seen[j]){seen[j]=true;cy.push(j);j=next[j]}cycles.push(cy)}
  return {next,cycles};
}
function renderY(c,ph){
  c.setTransform(1,0,0,1,0,0);c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const nodes=yNodes(ph), N=nodes.length, {next,cycles}=yCycles(N), tex=srcAlpha(), pl=pal();
  const colA=pl.find(x=>x.toLowerCase()!==P.bg.toLowerCase())||P.fg;
  const path=()=>{c.beginPath();for(const cy of cycles){if(cy.length<2)continue;c.moveTo(nodes[cy[0]][0],nodes[cy[0]][1]);for(let i=1;i<cy.length;i++)c.lineTo(nodes[cy[i]][0],nodes[cy[i]][1]);c.closePath()}};
  const paintFill=()=>{
    if(P.yFill==='color'){c.fillStyle=colA;c.fillRect(0,0,W,H);return}
    if(P.yFill==='tint'){c.fillStyle=pl[1]||colA;c.fillRect(0,0,W,H);c.globalCompositeOperation='multiply'}
    c.drawImage(tex,0,0);c.globalCompositeOperation='source-over';
  };
  if(P.yInvert){
    paintFill();                                                  // фото везде, фигура закрашивается фоном
    c.save();path();c.fillStyle=P.bg;c.fill(P.yRule);c.restore();
  }else{
    if(P.yFill==='color')c.drawImage(tex,0,0);                    // при цветной заливке фото остаётся на фоне
    c.save();path();c.clip(P.yRule);paintFill();c.restore();
  }
  if(P.yLine>0){c.save();c.strokeStyle=P.fg;c.lineWidth=P.yLine*RS;c.lineJoin='round';path();c.stroke();c.restore()}
  if(P.yTextOn)yText(c,nodes,next);
}
// текст вдоль каждой связи: размер подгоняется под длину хорды
function yText(c,nodes,next){
  const ws=words();if(!ws.length)return;
  c.save();c.fillStyle=P.fg;c.textAlign='center';c.textBaseline='middle';
  let wi=0;
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i], b=nodes[next[i]], dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy);
    const nw=1+(i%2), txt=Array.from({length:nw},()=>ws[(wi++)%ws.length]).join(' ').toUpperCase();
    if(len<W*.12)continue;
    c.font=fontStr(100);const w100=c.measureText(txt).width||100;
    const fs=Math.min(100*len*.8/w100,W*.05*P.yTextSize);if(fs<5)continue;
    let ang=Math.atan2(dy,dx);if(ang>Math.PI/2||ang<-Math.PI/2)ang+=Math.PI;       // читаемо слева направо
    const off=P.ySide==='above'?-fs*.62:P.ySide==='below'?fs*.62:0;
    c.save();c.translate((a[0]+b[0])/2,(a[1]+b[1])/2);c.rotate(ang);c.font=fontStr(fs);c.fillText(txt,0,off);c.restore();
  }
  c.restore();
}

/* ---------- Mode Z: Grid Stretch (фото по сетке, ширина колонок/строк меняется → фото деформируется; часть ячеек — другие кропы или текст, вписанный в ячейку) ---------- */
function zWeights(n,k,tag){
  const rg=rng(P.seed*211+k*29+tag), w=[];let t=0;
  for(let i=0;i<n;i++){const v=Math.max(.12,1+P.zVar*(rg()*3.2-1.1));w.push(v);t+=v}
  return w.map(v=>v/t);
}
function zEdges(n,ph,tag){
  const K=P.zStates, t=(ph/TAU)*K, k=Math.min(K-1,Math.floor(t)), f=t-k;
  const hold=P.zHold, p=f<hold?0:tmEase[P.zEase]((f-hold)/Math.max(1e-6,1-hold));
  const a=zWeights(n,k,tag), b=zWeights(n,(k+1)%K,tag), e=[0];
  for(let i=0;i<n;i++)e.push(e[i]+a[i]+(b[i]-a[i])*p);
  return e;                                                         // нормированные границы 0..1
}
let zRoles={key:'',r:[],crops:[]};
function zRolesGet(){
  const key=[P.seed,P.zShuffle,P.zCols,P.zRows,P.zInsert,P.zText,P.zSolid].join('|');
  if(zRoles.key===key)return zRoles;
  const rg=rng(P.seed*223+3+P.zShuffle*977), r=[], crops=[];
  for(let j=0;j<P.zRows;j++)for(let i=0;i<P.zCols;i++){
    const q=rg();r.push(q<P.zText?'t':q<P.zText+P.zInsert?'i':q<P.zText+P.zInsert+P.zSolid?'s':'b');
    const sz=.18+rg()*.35;crops.push({x:rg()*(1-sz),y:rg()*(1-sz),s:sz,ph:rg()*TAU});
  }
  zRoles={key,r,crops};return zRoles;
}
function zCellText(c,ws,dx,dy,dw,dh,i,j,wi0){
  const n=2+((i+j)%3), lines=Array.from({length:n},(_,k)=>ws[(wi0+k)%ws.length]);
  const pad=Math.min(dw,dh)*.08;
  c.font=fontStr(100);const wmax=Math.max(...lines.map(t=>c.measureText(t).width||100));
  const fs=Math.min(100*(dw-pad*2)/wmax,(dh-pad*2)/(lines.length*1.12))*P.zTextSize;
  if(fs<5)return;
  c.save();c.beginPath();c.rect(dx,dy,dw,dh);c.clip();
  const colBg=P.zTextBg==='color';
  c.fillStyle=colBg?textOn(c.fillStyle&&typeof c.fillStyle==='string'&&c.fillStyle[0]==='#'?c.fillStyle:'#888888'):(P.zTextColor==='fg'?P.fg:P.bg);
  c.font=fontStr(fs);c.textAlign='left';c.textBaseline='top';
  lines.forEach((t,k)=>c.fillText(t,dx+pad,dy+pad+k*fs*1.12));
  c.restore();
}
function renderZ(c,ph){
  c.setTransform(1,0,0,1,0,0);c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const C=P.zCols,R=P.zRows, ex=zEdges(C,ph,1), ey=zEdges(R,ph,2), tex=srcAlpha(), ro=zRolesGet(), ws=words();
  const X=i=>Math.round(ex[i]*W), Y=j=>Math.round(ey[j]*H);
  // 1) основа: равномерные ячейки источника → неравномерные ячейки листа (деформация)
  for(let j=0;j<R;j++)for(let i=0;i<C;i++){
    const dx=X(i),dy=Y(j),dw=X(i+1)-dx,dh=Y(j+1)-dy;if(dw<=0||dh<=0)continue;
    c.drawImage(tex,i*W/C,j*H/R,W/C,H/R,dx,dy,dw+.5,dh+.5);
  }
  // 2) ячейки с другими кропами и с текстом
  let wi=0;
  for(let j=0;j<R;j++)for(let i=0;i<C;i++){
    const role=ro.r[j*C+i], dx=X(i),dy=Y(j),dw=X(i+1)-dx,dh=Y(j+1)-dy;if(dw<=0||dh<=0)continue;
    if(role==='i'){
      const cr=ro.crops[j*C+i], sw=W*cr.s, sh=sw*dh/dw, sx=cr.x*W+P.zStates*0+W*.02*Math.sin(ph+cr.ph), sy=cr.y*H;
      c.save();c.beginPath();c.rect(dx,dy,dw,dh);c.clip();
      if(P.zGray)c.filter='grayscale(1)';
      c.drawImage(tex,clamp(sx,0,W-sw),clamp(sy,0,Math.max(0,H-sh)),sw,Math.min(sh,H),dx,dy,dw,dh);
      c.filter='none';c.restore();
    }else if(role==='s'||(role==='t'&&P.zTextBg==='color')){
      const pl2=pal().filter(x=>x.toLowerCase()!==P.bg.toLowerCase());c.fillStyle=pl2[(i*3+j*5)%Math.max(1,pl2.length)]||P.fg;c.fillRect(dx,dy,dw+.5,dh+.5);
      if(role==='t'&&ws.length)zCellText(c,ws,dx,dy,dw,dh,i,j,wi);
      if(role==='t')wi+=2+((i+j)%3);
    }else if(role==='t'&&ws.length){
      zCellText(c,ws,dx,dy,dw,dh,i,j,wi);wi+=2+((i+j)%3);
    }
  }
  // 3) линии и узлы сетки
  const gcol=P.zGridColor==='fg'?P.fg:P.bg;
  if(P.zLines>0){c.save();c.strokeStyle=gcol;c.lineWidth=P.zLines*RS;c.beginPath();for(let i=1;i<C;i++){c.moveTo(X(i),0);c.lineTo(X(i),H)}for(let j=1;j<R;j++){c.moveTo(0,Y(j));c.lineTo(W,Y(j))}c.stroke();c.restore()}
  if(P.zNodes){
    const ns=Math.max(3,Math.round(8*RS));c.fillStyle=gcol;
    for(let j=1;j<R;j++)for(let i=1;i<C;i++)c.fillRect(X(i)-ns/2,Y(j)-ns/2,ns,ns);
  }
}

/* ---------- Glitch post ---------- */
let noiseTile=null,noisePat=null;
function initNoise(){
  noiseTile=mk(256,256);const x=noiseTile.getContext('2d'),id=x.createImageData(256,256);
  for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}
  x.putImageData(id,0,0);noisePat=g.createPattern(noiseTile,'repeat');
}
const dispT=mk(),dispTx=dispT.getContext('2d');
// дисплейс «шире к краям»: постоянное нелинейное растяжение содержимого к краям листа по обеим осям
function dispWarp(ph){
  const a=P.gDisp*.48;
  if(a<.004)return;
  if(dispT.width!==W||dispT.height!==H){dispT.width=W;dispT.height=H}
  const sw=Math.max(2,Math.round(2*RS)), srcU=u=>u*(1+a)-a*u*u*u, der=u=>Math.max(.15,1+a-3*a*u*u);
  dispTx.setTransform(1,0,0,1,0,0);dispTx.clearRect(0,0,W,H);
  for(let x=0;x<W;x+=sw){                                         // горизонтальный проход: work → dispT
    const u=((x+sw/2)-W/2)/(W/2), sc=W/2+srcU(u)*W/2, w=sw*der(u);
    dispTx.drawImage(work,sc-w/2,0,w,H,x,0,sw+.6,H);
  }
  wctx.setTransform(1,0,0,1,0,0);wctx.clearRect(0,0,W,H);
  const sh=Math.max(2,Math.round(2*RS));
  for(let y=0;y<H;y+=sh){                                         // вертикальный проход: dispT → work
    const u=((y+sh/2)-H/2)/(H/2), sc=H/2+srcU(u)*H/2, h=sh*der(u);
    wctx.drawImage(dispT,0,sc-h/2,W,h,0,y,W,sh+.6);
  }
}
function post(ph){
  if(!P.gOn){g.globalAlpha=1;g.drawImage(work,0,0);return}
  if(P.gDisp>0)dispWarp(ph);
  const tq=Math.floor(ph/TAU*P.gSteps-1e-9);
  let s=work;
  if(P.gPix>1){
    const px=P.gPix*RS, tw=Math.ceil(W/px), th=Math.ceil(H/px);
    tmp2.width=tw;tmp2.height=th;t2ctx.imageSmoothingEnabled=true;t2ctx.drawImage(work,0,0,tw,th);
    wctx.imageSmoothingEnabled=false;wctx.drawImage(tmp2,0,0,tw,th,0,0,tw*px,th*px);wctx.imageSmoothingEnabled=true;
  }
  g.globalAlpha=1;g.fillStyle=P.bg;g.fillRect(0,0,W,H);
  if(P.gWarp>0||P.gBands>0){
    const bh=Math.max(2,Math.round(H/160));
    for(let y=0,bi=0;y<H;y+=bh,bi++){
      let off=0;
      if(P.gWarp>0)off+=P.gWarp*W*.04*Math.sin(y*.012+ph*P.gK)*Math.sin(y*.004+1);
      const gb=Math.floor(y/(bh*(2+Math.floor(hash01(Math.floor(y/(H/14)),3)*5))));
      if(P.gBands>0&&hash01(gb+tq*17,11)<P.gBands*.5)off+=(hash01(gb+tq*17,5)-.5)*2*P.gBandAmp*W;
      const hh=Math.min(bh,H-y);
      if(off===0)g.drawImage(s,0,y,W,hh,0,y,W,hh);
      else{g.drawImage(s,0,y,W,hh,off,y,W,hh);g.drawImage(s,0,y,W,hh,off-Math.sign(off)*W,y,W,hh)}
    }
  }else g.drawImage(s,0,0);
  if(P.gRgb>0){
    const d=Math.max(1,Math.round(P.gRgb*RS*(.65+.35*Math.sin(ph*Math.max(1,P.gK)))));
    const id=g.getImageData(0,0,W,H),dt=id.data,o=new Uint8ClampedArray(dt);
    for(let y=0;y<H;y++){const row=y*W;for(let x=0;x<W;x++){
      const i=(row+x)*4;
      dt[i]=o[(row+Math.min(W-1,x+d))*4];
      dt[i+2]=o[(row+Math.max(0,x-d))*4+2];
    }}
    g.putImageData(id,0,0);
  }
  if(P.gScan>0){g.fillStyle=`rgba(0,0,0,${.35*P.gScan})`;const sp=Math.max(2,Math.round(3*RS)),lh=Math.max(1,Math.round(RS));for(let y=0;y<H;y+=sp)g.fillRect(0,y,W,lh)}
  if(P.gNoise>0){
    if(!noisePat)initNoise();
    g.save();g.globalAlpha=P.gNoise*.35;g.globalCompositeOperation='overlay';
    g.translate(Math.floor(hash01(tq,1)*256),Math.floor(hash01(tq,2)*256));
    g.scale(RS,RS);g.fillStyle=noisePat;g.fillRect(-256,-256,(W+256)/RS+256,(H+256)/RS+256);g.restore();
  }
}

/* ---------- main render ---------- */
function render(ph){
  if(work.width!==W||work.height!==H){work.width=W;work.height=H}
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  if(src.width!==W||src.height!==H)buildSrc();
  wctx.globalAlpha=1;wctx.filter='none';wctx.imageSmoothingEnabled=true;
  if(P.mode==='A')renderA(wctx,ph);
  else if(P.mode==='C')renderC(wctx,ph);
  else if(P.mode==='E')renderE(wctx,ph);
  else if(P.mode==='F')renderF(wctx,ph);
  else if(P.mode==='G')renderG(wctx,ph);
  else if(P.mode==='H')renderH(wctx,ph);
  else if(P.mode==='I')renderI(wctx,ph);
  else if(P.mode==='J')renderJ(wctx,ph);
  else if(P.mode==='K')renderK(wctx,ph);
  else if(P.mode==='L')renderL(wctx,ph);
  else if(P.mode==='M')renderM(wctx,ph);
  else if(P.mode==='N')renderN(wctx,ph);
  else if(P.mode==='O')renderO(wctx,ph);
  else if(P.mode==='P')renderP(wctx,ph);
  else if(P.mode==='Q')renderQ(wctx,ph);
  else if(P.mode==='R')renderR(wctx,ph);
  else if(P.mode==='S')renderS(wctx,ph);
  else if(P.mode==='T')renderT(wctx,ph);
  else if(P.mode==='U')renderU(wctx,ph);
  else if(P.mode==='V')renderV(wctx,ph);
  else if(P.mode==='W')renderW(wctx,ph);
  else if(P.mode==='X')renderX(wctx,ph);
  else if(P.mode==='Y')renderY(wctx,ph);
  else if(P.mode==='Z')renderZ(wctx,ph);
  else{buildComposite(ph);if(P.mode==='B')renderB(wctx,ph);else renderD(wctx,ph)}
  post(ph);
}

/* ---------- loop / clock ---------- */
let clock=0,playing=true,last=performance.now(),dirty=true,recording=false,exporting=false;
function frame(now){
  const dt=(now-last)/1000;last=now;
  if(playing){clock+=dt;dirty=true}
  if(dirty&&!exporting){
    dirty=false;
    const L=P.loop, tt=((clock%L)+L)%L;
    render(TAU*tt/L);
    $('#scrub').value=Math.round(tt/L*1000);
    $('#tlab').textContent=tt.toFixed(1)+'s';
  }
  requestAnimationFrame(frame);
}

function fmt(v){return Math.abs(v)>=100?Math.round(v):(Math.round(v*100)/100)}
const DICE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor"/></svg>';
function mkDice(fn){
  const b=document.createElement('button');b.type='button';b.className='dice';b.title='Randomize this group only';b.innerHTML=DICE_SVG;
  b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();fn()});

}
const NO_RAND=['text','eCaption','palette','bg','fg','format','res'];
function randomizeSection(sec){
  const R=Math.random;
  sec.items.forEach(it=>{
    const k=it.k;if(NO_RAND.includes(k))return;
    if(it.t==='range'){
      let v;
      if(k==='tAlpha')v=.5+R()*.5;
      else if(sec.glitch&&it.min===0&&R()<.5)v=0;
      else{const hi=(sec.glitch&&it.min===0)?it.max*.7:it.max;v=it.min+R()*(hi-it.min)}
      v=it.step>=1?Math.round(v):Math.round(v/it.step)*it.step;
      P[k]=parseFloat(clamp(v,it.min,it.max).toFixed(4));
    }else if(it.t==='sel'){
      const o=it.o[Math.floor(R()*it.o.length)];P[k]=typeof it.o[0]==='number'?Number(o):o;
    }else if(it.t==='chk'){P[k]=R()<.35}
    else if(it.t==='font'){P[k]=FONTS[Math.floor(R()*FONTS.length)][1]}
  });
  if(sec.show==='D'||sec.show==='E'||sec.show==='F')P.seed=Math.floor(R()*99999);
  syncUI();
  if(sec.items.some(i=>i.src))srcDirty();
  dirty=true;
}

          if(inp.value==='__up'){$('#fFont').click();inp.value=P.font;return}
          v=inp.value;
        }else v=inp.value;
        P[it.k]=v;if(val)val.textContent=fmt(v);
        if(it.k==='font'){const ax=$('#axesSec');if(ax)ax.style.display=(axInfo.length&&v.startsWith('UserFont'))?'':'none';applyVariations()}
        if(it.src||it.k==='bg')srcDirty();
        if(it.k==='format'||it.k==='res'){sizeFor();srcDirty()}
        dirty=true;
      });
    });
    panel.appendChild(d);
  });
  syncUI();
}

function recordLive(preferMp4){
  if(recording||exporting)return;
  if(!window.MediaRecorder){alert('MediaRecorder is not supported in this browser');return}
  const list=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  if(preferMp4)list.unshift('video/mp4;codecs=avc1','video/mp4');
  const mime=list.find(m=>MediaRecorder.isTypeSupported(m));
  const prevRes=P.res, er=+$('#expRes').value;
  if(er!==prevRes){P.res=er;sizeFor();srcDirty();render(0)}
  const rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:14e6});
  const ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
  rec.onstop=()=>{recording=false;$('#bWebm').textContent='WebM';if(P.res!==prevRes){P.res=prevRes;sizeFor();srcDirty()}dl(new Blob(ch,{type:mime}),`poster-${P.mode}-${P.seed}.${mime.includes('mp4')?'mp4':'webm'}`)};
  clock=0;playing=true;$('#bPlay').textContent='❚❚';recording=true;$('#bWebm').textContent='● recording…';
  rec.start();setTimeout(()=>rec.stop(),P.loop*1000+150);
}

/* MP4: покадровый оффлайн-рендер через WebCodecs + mp4-muxer (ровный луп, не зависит от реального времени) */
async function exportMP4(){
  if(exporting||recording)return;
  if(!window.VideoEncoder||!window.VideoFrame||!window.Mp4Muxer){
    alert('MP4 via WebCodecs is unavailable (needs Chrome/Edge/Safari 16.4+ and internet to load the muxer). Trying real-time recording.');
    return recordLive(true);
  }
  const btn=$('#bMp4'), fps=+$('#fps').value, q=+$('#qual').value, N=Math.round(P.loop*fps);
  const wasPlaying=playing;playing=false;exporting=true;
  const prevRes=P.res, er=+$('#expRes').value;
  try{
    if(er!==prevRes){P.res=er;sizeFor();srcDirty()}
    render(0);
    const w=cv.width,h=cv.height,bitrate=Math.round(w*h*fps*q);
    let codec=null;
    for(const c of ['avc1.640033','avc1.640028','avc1.4d0028','avc1.42001f']){
      try{const s=await VideoEncoder.isConfigSupported({codec:c,width:w,height:h,bitrate,framerate:fps});if(s.supported){codec=c;break}}catch(e){}
    }
    if(!codec)throw new Error('H.264 is not supported for '+w+'×'+h+' — reduce the size or use WebM');
    const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:w,height:h},fastStart:'in-memory'});
    let err=null;
    const enc=new VideoEncoder({output:(ch,meta)=>muxer.addVideoChunk(ch,meta),error:e=>{err=e}});
    enc.configure({codec,width:w,height:h,bitrate,framerate:fps});
    for(let i=0;i<N;i++){
      if(err)throw err;
      render(TAU*i/N);
      const vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
      enc.encode(vf,{keyFrame:i%fps===0});vf.close();
      while(enc.encodeQueueSize>6)await new Promise(r=>setTimeout(r,2));
      if(i%4===0){btn.textContent=`MP4 ${Math.round(i/N*100)}%`;await new Promise(r=>setTimeout(r,0))}
    }
    await enc.flush();if(err)throw err;
    muxer.finalize();
    dl(new Blob([muxer.target.buffer],{type:'video/mp4'}),`poster-${P.mode}-${P.seed}.mp4`);
  }catch(e){alert('MP4 error: '+(e&&e.message||e))}
  finally{if(P.res!==prevRes){P.res=prevRes;sizeFor();srcDirty()}exporting=false;playing=wasPlaying;dirty=true;btn.textContent='MP4'}
}

/* --- чтение таблицы fvar (оси вариативного шрифта): TTF/OTF/WOFF; WOFF2 (brotli) не читается --- */
async function readFvar(buf){
  let dv=new DataView(buf);
  const tag=o=>String.fromCharCode(dv.getUint8(o),dv.getUint8(o+1),dv.getUint8(o+2),dv.getUint8(o+3));
  const sig=tag(0);
  let tbl=null,nameTbl=null;
  const inflate=async u8=>{
    const ds=new DecompressionStream('deflate');
    const w=ds.writable.getWriter();w.write(u8);w.close();
    return new Uint8Array(await new Response(ds.readable).arrayBuffer());
  };
  const grab=async(name)=>{
    if(sig==='wOFF'){
      const n=dv.getUint16(12);
      for(let i=0;i<n;i++){
        const o=44+i*20;
        if(tag(o)===name){
          const off=dv.getUint32(o+4),cl=dv.getUint32(o+8),ol=dv.getUint32(o+12);
          const raw=new Uint8Array(buf,off,cl);
          const u8=cl<ol?await inflate(raw):raw.slice();
          return new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
        }
      }
      return null;
    }
    if(sig==='wOF2')throw new Error('woff2');
    let base=0;
    if(sig==='ttcf')base=dv.getUint32(12);
    const n=dv.getUint16(base+4);
    for(let i=0;i<n;i++){
      const o=base+12+i*16;
      if(tag(o)===name){const off=dv.getUint32(o+8),len=dv.getUint32(o+12);return new DataView(buf,off,len)}
    }
    return null;
  };
  tbl=await grab('fvar');if(!tbl)return [];
  try{nameTbl=await grab('name')}catch(e){}
  const names={};
  if(nameTbl){
    try{
      const cnt=nameTbl.getUint16(2),so=nameTbl.getUint16(4);
      for(let i=0;i<cnt;i++){
        const o=6+i*12,pid=nameTbl.getUint16(o),id=nameTbl.getUint16(o+6),len=nameTbl.getUint16(o+8),off=nameTbl.getUint16(o+10);
        if(names[id]&&pid!==3)continue;
        let s='';
        if(pid===3||pid===0){for(let j=0;j<len;j+=2)s+=String.fromCharCode(nameTbl.getUint16(so+off+j))}
        else if(pid===1){for(let j=0;j<len;j++)s+=String.fromCharCode(nameTbl.getUint8(so+off+j))}
        if(s)names[id]=s;
      }
    }catch(e){}
  }
  const ao=tbl.getUint16(4),cnt=tbl.getUint16(8),sz=tbl.getUint16(10),axes=[];
  const t4=o=>String.fromCharCode(tbl.getUint8(o),tbl.getUint8(o+1),tbl.getUint8(o+2),tbl.getUint8(o+3));
  const fx=o=>tbl.getInt32(o)/65536;
  for(let i=0;i<cnt;i++){
    const o=ao+i*sz,tg=t4(o);
    axes.push({tag:tg,min:fx(o+4),def:fx(o+8),max:fx(o+12),name:names[tbl.getUint16(o+18)]||AXNAMES[tg]||tg});
  }
  return axes;
}
const AXNAMES={wght:'Weight',wdth:'Width',slnt:'Slant',ital:'Italic',opsz:'Optical size'};
let fontCount=0;
function buildAxesUI(){
  let d=$('#axesSec');
  if(!d){d=document.createElement('details');d.id='axesSec';d.open=false;
    const textSec=[...$('#panel').children].find(x=>x.textContent.startsWith('Text')&&x.tagName==='DETAILS');
    $('#panel').insertBefore(d,textSec?textSec.nextSibling:null)}
  d.innerHTML='<summary>Font axes (variable)</summary>';
  d.style.display=(axInfo.length&&P.font.startsWith('UserFont'))?'':'none';
  axInfo.forEach(a=>{
    const row=document.createElement('div');row.className='row';
    const step=(a.max-a.min)>20?1:.01;
    row.innerHTML=`<label title="${a.tag}">${a.name}</label><input type="range" min="${a.min}" max="${a.max}" step="${step}"><span class="v"></span>`;
    const inp=row.querySelector('input'),v=row.querySelector('.v');
    inp.value=axVals[a.tag];v.textContent=fmt(axVals[a.tag]);
    inp.oninput=()=>{axVals[a.tag]=parseFloat(inp.value);v.textContent=fmt(axVals[a.tag]);applyVariations()};
    row.ondblclick=()=>{axVals[a.tag]=a.def;inp.value=a.def;v.textContent=fmt(a.def);applyVariations()};
    d.appendChild(row);
  });
  const ch=document.createElement('div');ch.className='chips';
  ch.innerHTML='<button>Random axes</button><button>Reset axes</button>';
  ch.children[0].onclick=()=>{axInfo.forEach(a=>{axVals[a.tag]=a.min+Math.random()*(a.max-a.min)});buildAxesUI();applyVariations()};
  ch.children[1].onclick=()=>{axInfo.forEach(a=>{axVals[a.tag]=a.def});buildAxesUI();applyVariations()};
  d.appendChild(ch);
}
async function loadUserFont(f){
  const buf=await f.arrayBuffer();
  let axes=[],note='';
  try{axes=await readFvar(buf.slice(0))}
  catch(err){
    if(err&&err.message==='woff2'){
      // WOFF2 сжат brotli — оси не прочитать, даём типовые вручную
      axes=[{tag:'wght',min:100,def:400,max:900,name:'Weight'},{tag:'wdth',min:50,def:100,max:200,name:'Width'},{tag:'slnt',min:-15,def:0,max:0,name:'Slant'}];
      note='WOFF2: axes cannot be read, showing typical ones (wght/wdth/slnt). Upload TTF/OTF for exact axes.';
    }else note='Could not read axes: '+(err&&err.message||err);
  }
  const fam='UserFont'+(++fontCount);
  const wa=axes.find(a=>a.tag==='wght'),wd=axes.find(a=>a.tag==='wdth');
  let ff=null,lastErr=null;
  const tries=[()=>{const d={};if(wa)d.weight=`${wa.min} ${wa.max}`;if(wd)d.stretch=`${wd.min}% ${wd.max}%`;return d},()=>({}),()=>({weight:'100 900'})];
  for(const mkDesc of tries){
    try{ff=new FontFace(fam,buf.slice(0),mkDesc());await ff.load();break}catch(err){lastErr=err;ff=null}
  }
  if(!ff)throw new Error('browser rejected the font: '+(lastErr&&lastErr.message||lastErr));
  document.fonts.add(ff);
  P.font=`${fam}, sans-serif`;
  axInfo=axes;axVals={};axes.forEach(a=>axVals[a.tag]=a.def);
  if(wa)P.weight=Math.round(wa.def);
  const sel=ctl.font.inp;
  const op=document.createElement('option');op.value=P.font;op.textContent='★ '+f.name+(axes.length?' (variable)':'');sel.insertBefore(op,sel.lastChild);
  sel.value=P.font;
  buildAxesUI();applyVariations();
  if(note)console.warn(note),setTimeout(()=>alert(note),50);
}
$('#fFont').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  try{await loadUserFont(f)}catch(err){console.error(err);alert('Font load error: '+(err&&err.message||err))}
};
