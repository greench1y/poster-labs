<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster Lab</title>
<style>
:root{--bg:#0e0e0f;--panel:#161618;--line:#2a2a2e;--tx:#e8e8ea;--mut:#8b8b93;--ac:#ff5a1f}
@media (prefers-color-scheme: light){:root{--bg:#ececee;--panel:#fafafa;--line:#d6d6da;--tx:#161618;--mut:#6b6b73}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 -apple-system,"Helvetica Neue",Arial,sans-serif}
#app{display:grid;grid-template-columns:1fr 330px;height:100vh}
#stage{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;width:100%;max-width:1000px}
.tabs button{border:1px solid var(--line);border-radius:8px;background:transparent;padding:7px 0;position:relative;text-align:center;font-weight:700}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs button[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:12px;line-height:1;padding:6px 9px;border-radius:6px;white-space:nowrap;z-index:50;pointer-events:none}
.tabs button[data-tip]:hover::before{content:"";position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top:0;border-bottom-color:#111;z-index:50;pointer-events:none}
.tabs button.on{background:var(--ac);color:#fff}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
#view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
#view.drag::after{content:"Drop photo here";position:absolute;inset:10px;border:2px dashed var(--ac);border-radius:12px;display:flex;align-items:center;justify-content:center;background:#0008;color:#fff;font-size:18px}
canvas#cv{max-width:100%;max-height:100%;box-shadow:0 10px 40px #0006;background:#fff}
#bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
#bar select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
#bar input[type=range]{min-width:120px}
#bar input[type=range]{flex:1}
#sceneName{padding:12px 16px 10px;font-weight:700;font-size:15px;border-bottom:1px solid var(--line)}
#panel{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:6px 0}
details{border-bottom:1px solid var(--line);padding:6px 14px 10px}
summary{cursor:pointer;font-weight:600;padding:6px 0;user-select:none}
summary input.hdr{float:right;margin:3px 2px 0 0;width:16px;height:16px;accent-color:var(--ac);cursor:pointer}
details.off>*:not(summary){opacity:.45}
summary button.dice{float:right;border:0;background:none;padding:2px 4px;margin:1px 8px 0 0;cursor:pointer;color:var(--mut);line-height:0;border-radius:6px}
summary button.dice:hover{color:var(--ac);background:var(--bg)}
summary button.dice svg{width:18px;height:18px}
.row{display:grid;grid-template-columns:104px 1fr 38px;gap:8px;align-items:center;margin:5px 0}
.row label{color:var(--mut);font-size:12px}
.row .v{color:var(--mut);font-size:11px;text-align:right}
.row.wide{grid-template-columns:104px 1fr}
.row input[type=range]{width:100%;accent-color:var(--ac)}
.row select,.row input[type=text],.row input[type=number],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.row input[type=color]{width:100%;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:2px}
textarea{height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{padding:4px 9px;font-size:12px}
.pals{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:4px}
.pal{display:flex;flex-direction:column;gap:3px;padding:5px;text-align:left;font-size:11px}
.pal .sw{display:flex;height:16px;border-radius:4px;overflow:hidden;outline:1px solid var(--line)}
.pal .sw i{flex:1}
.pal.on{border-color:var(--ac);outline:1px solid var(--ac)}
#loopbox{display:flex;align-items:center;gap:6px;color:var(--mut);white-space:nowrap}
#loopbox input{width:56px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}#panel{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="top">
      <div class="tabs" id="tabs"></div>
      <div class="acts">
        <button id="bPhoto">Upload photo</button>
        <button id="bRemix">Remix</button>
        <button id="bRand">Random</button>
        <button id="bColors" title="Random colors (C)">Colors</button>
      </div>
    </div>
    <div id="view"><canvas id="cv"></canvas></div>
    <div id="bar">
      <select id="expRes" title="Export size (long side, px)"><option value="720">720 px</option><option value="1080">1080 px</option><option value="1440">1440 px</option><option value="1920" selected>1920 px</option><option value="2160">2160 px</option></select>
      <select id="fps" title="FPS"><option value="30">30 fps</option><option value="60">60 fps</option></select>
      <select id="qual" title="Quality"><option value="0.1">~ Mbps</option><option value="0.2" selected>~ Mbps</option><option value="0.35">~ Mbps</option></select>
      <button id="bPng">PNG</button>
      <button id="bWebm">WebM</button>
      <button id="bMp4" class="pri">MP4</button>
      <span style="width:6px"></span>
      <button id="bPlay">❚❚</button>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <label id="loopbox" title="Loop length (seconds)">Loop <input type="number" id="loopLen" min="1" max="60" step="1" value="6"> s</label>
      <span id="tlab" style="width:64px;text-align:right;color:var(--mut)">0.0s</span>
    </div>
  </div>
  <div id="panel"></div>
</div>
<input type="file" id="fPhoto" accept="image/*" hidden>
<input type="file" id="fFont" accept=".ttf,.otf,.woff,.woff2" hidden>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>

function adjustPixels(cx){
  if(P.pBright===0&&P.pContrast===1&&!P.pGray&&!P.pInvert)return;
  const id=cx.getImageData(0,0,W,H),d=id.data,b=P.pBright*255,c=P.pContrast;
  for(let i=0;i<d.length;i+=4){
    let r=d[i],gg=d[i+1],bl=d[i+2];
    if(P.pGray){r=gg=bl=0.2126*r+0.7152*gg+0.0722*bl}
    r=(r-128)*c+128+b;gg=(gg-128)*c+128+b;bl=(bl-128)*c+128+b;
    if(P.pInvert){r=255-r;gg=255-gg;bl=255-bl}
    d[i]=r;d[i+1]=gg;d[i+2]=bl;
  }
  cx.putImageData(id,0,0);
}
function photoRect(){

  const sc=Math.max(W/iw,H/ih)*P.pZoom, dw=iw*sc, dh=ih*sc;

}

}

function hsl2hex(h,s,l){
  h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;
  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');
}
const textOn=hex=>lumOf(...hex2rgb(hex))>.55?'#111111':'#ffffff';
function randomPalette(){
  const R=Math.random, h=R()*360;
  const dh=[[0,25,-25,50,-50],[0,180,20,200,-20],[0,120,240,60,180],[0,150,210,30,-30]][Math.floor(R()*4)];
  const sat=55+R()*40;
  const c=dh.map(d=>hsl2hex(h+d,sat*(.8+R()*.4),38+R()*34));
  let bg,fg;const m=R();
  if(m<.35){bg=hsl2hex(h+R()*40,15+R()*35,6+R()*8);fg=hsl2hex(h+dh[1],sat,72+R()*14)}
  else if(m<.75){bg=hsl2hex(h+R()*30,10+R()*30,91+R()*6);fg=hsl2hex(h+dh[2],sat*.8,10+R()*10)}
  else{bg=c[0];fg=textOn(bg)}
  return {n:'random',c,bg,fg};
}

/* ---------- Text layer + composite ---------- */
const comp=mk(), cctx=comp.getContext('2d');
hiddenHost.appendChild(comp);
let tlay={key:'',rows:[]};
const mw=s=>{cctx.font=fontStr(100);return cctx.measureText(s).width||50};
function layoutText(off){
  const STY=P.tStyle;
  const wd=words();if(!wd.length)return [];
  const key=[W,H,P.seed,STY,P.tSize,P.text,P.font,P.weight,varStr(),off].join('|');
  if(tlay.key===key)return tlay.rows;
  const r=rng(P.seed*31+5), m=Math.round(W*.05), avail=W-2*m, rows=[];
  const pick=i=>wd[((i+off)%wd.length+wd.length)%wd.length];
  let y=0;
  const add=o=>{o.y=y;o.h=o.fs*1.06;y+=o.h;rows.push(o)};
  if(STY==='justified'){
    let wi=0;
    while(y<H&&rows.length<90){
      const cap=H*.2/P.tSize*(.4+.6*r());
      const a=pick(wi++),wa=mw(a);let fs=100*avail/wa,b=null;
      if(fs>cap){b=pick(wi++);fs=Math.min(cap,100*avail/(wa+mw(b)+25))}
      add({k:'j',t:a,t2:b,fs,x:m});
    }
  }else if(STY==='stack'){
    let wi=0;
    while(y<H&&rows.length<90){
      const a=pick(wi++);
      add({k:'c',t:a,fs:Math.min(H*(.07+.13*r())/P.tSize,100*avail/mw(a)),al:['left','center','right'][Math.floor(r()*3)],x:m});
    }
  }else if(STY==='strips'){
    const n=Math.max(3,Math.round(12*P.tSize)), rh=H/n;
    for(let i=0;i<n;i++){
      const s=Array.from({length:wd.length},(_,j)=>pick(i*2+j)).join('  ✦  ')+'  ✦  ';
      rows.push({k:'s',t:s,fs:rh*.9,cy:(i+.5)*rh,dir:i%2?1:-1});
    }
    tlay={key,rows};return rows;
  }else{
    const n=Math.round(16*P.tSize);
    for(let i=0;i<n;i++){
      const a=pick(i);
      rows.push({k:'p',t:a,fs:Math.min(H*(.04+.28*r()*r()),100*avail/mw(a)),x:r()*W,cy:r()*H,rot:r()<.25?-Math.PI/2:0,p0:r()*TAU});
    }
    tlay={key,rows};return rows;
  }
  while(rows.length>2){const l=rows[rows.length-1];if(y-l.h>=H*.9){y-=l.h;rows.pop()}else break}
  const sc=H/y;rows.forEach(o=>o.cy=(o.y+o.h/2)*sc);
  tlay={key,rows};return rows;
}
function drawTextLayer(c,ph,alpha,blend){
  if(P.tStyle==='protocol'){lTypo(c,ph,0,true,false,alpha,blend,false);return}   // protocol без линейки (линейка только в сцене L)
  const STY=P.tStyle
  const off=(STY==='justified'||STY==='stack')?Math.floor(ph/TAU*P.tAnim):0;
  const rows=layoutText(off);if(!rows.length)return;
  const pl=pal();
  c.save();c.globalAlpha=alpha;c.globalCompositeOperation=blend;c.textBaseline='middle';c.lineJoin='round';
  const col=i=>P.tColor==='palette'?(pl[i%pl.length]||P.fg):P.tColor==='bg'?P.bg:P.fg;
  const put=(s,x,y,fs,cl)=>{
    if(P.tOutline){c.strokeStyle=cl;c.lineWidth=Math.max(1,fs*.035);c.strokeText(s,x,y)}
    else{c.fillStyle=cl;c.fillText(s,x,y)}
  };
  rows.forEach((o,i)=>{
    c.font=fontStr(o.fs);const cl=col(i);
    if(o.k==='j'){c.textAlign='left';put(o.t,o.x,o.cy,o.fs,cl);if(o.t2){c.textAlign='right';put(o.t2,W-o.x,o.cy,o.fs,cl)}}
    else if(o.k==='c'){c.textAlign=o.al;put(o.t,o.al==='left'?o.x:o.al==='right'?W-o.x:W/2,o.cy,o.fs,cl)}
    else if(o.k==='s'){
      c.textAlign='left';const lw=c.measureText(o.t).width||100;
      const sh=P.tAnim>0?((o.dir*P.tAnim*lw*ph/TAU)%lw+lw)%lw:0;
      for(let x=-sh;x<W;x+=lw)put(o.t,x,o.cy,o.fs,cl);
    }else{
      c.save();const dx=P.tAnim>0?Math.sin(ph+o.p0)*W*.02:0;
      c.translate(o.x+dx,o.cy);c.rotate(o.rot);c.textAlign='center';put(o.t,0,0,o.fs,cl);c.restore();
    }
  });
  c.restore();
}
function buildComposite(ph){
  if(comp.width!==W||comp.height!==H){comp.width=W;comp.height=H}

/* ---------- Mode A: Typo-Mosaic ---------- */
function renderA(c,ph){

    else if(shape==='square'){const z=cell*s;c.fillRect(x-z/2,y-z/2,z,z)}

      const chr=ch[P.aRand?Math.floor(hs(i+Math.floor(ph/TAU*P.gSteps)*0)*n):((i+shift)%n+n)%n]||'·';

}

/* ---------- Mode B: Slice & Shift ---------- */
function renderB(c,ph){
  c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const hz=P.bDir==='h', n=P.bCount, main=hz?H:W, cross=hz?W:H, sz=main/n;
  const epoch=Math.floor(ph/TAU*P.bEpochs-1e-9);
  const rg=rng(P.seed*131+Math.max(0,epoch)*977);
  const order=[...Array(n).keys()];
  const swaps=Math.round(P.bShuffle*n);
  for(let k=0;k<swaps;k++){const a=Math.floor(rg()*n),b=Math.floor(rg()*n);[order[a],order[b]]=[order[b],order[a]]}
  const ln=words().join('  ✦  ')+'  ✦  ';
  for(let i=0;i<n;i++){
    const pos=i*sz, j=order[i];
    const wob=Math.sin(ph*P.bK+i*.42)+.5*Math.sin(ph*P.bK*2+i*.9+1.3);
    const off=P.bAmp*cross*wob*.66;

    c.clip();
    if(hash01(i,7)<P.bText){

      const fs=sz*.95;c.font=fontStr(fs);c.fillStyle=P.fg;c.textBaseline='middle';c.textAlign='left';
      const lw=c.measureText(ln).width||100, dir=i%2?1:-1;
      const sh=((dir*P.bK*lw*ph/TAU+off*.3)%lw+lw)%lw;
      if(hz){for(let x=-sh;x<W;x+=lw)c.fillText(ln,x,pos+sz/2)}
      else{c.translate(pos+sz/2,0);c.rotate(Math.PI/2);for(let x=-sh;x<H;x+=lw)c.fillText(ln,x,0)}
    }else{
      if(P.bGray)c.filter='grayscale(1)';
      const w2=cross*st;
      for(const k of [-1,0,1]){
        const o=off+k*cross, x0=o-(w2-cross)/2;
        if(hz)c.drawImage(comp,0,j*sz,W,sz+1,x0,pos,w2,sz+1);

}
const hash01=(i,s)=>{const x=Math.sin((i+1)*91.7+s*37.3+P.seed*13.1)*43758.5453;return x-Math.floor(x)};

/* ---------- Mode D: Grid Collage ---------- */
let dCache={key:'',cells:[]};

  if(dCache.key===key)return dCache.cells;
  const r=rng(P.seed*7919+1), cells=[], min=Math.min(W,H)*.07;

    if(d<=0||(d<P.dDepth-1&&r()<.14)||(w<min*1.6&&h<min*1.6)){cells.push({x,y,w,h});return}

function renderD(c,ph){
  c.fillStyle=P.bg;c.fillRect(0,0,W,H);

  cells.forEach((k,idx)=>{

    if(w<=1||h<=1)return;
    c.save();rr(c,x,y,w,h,P.dRound*RS);c.clip();
    const zf=1+P.dZoom*k.rx*(k.type==='photo'?1:.3);
    const sw=Math.min(W,w/zf*1), sh=Math.min(H,h/zf*1);
    const ox=P.dShift*w*Math.sin(ph*P.dK+k.p0), oy=P.dShift*h*Math.cos(ph*P.dK+k.p0*1.3);
    let sx=(k.alien?k.rx*(W-sw):k.x+(k.w-sw)/2)+ox, sy=(k.alien?k.ry*(H-sh):k.y+(k.h-sh)/2)+oy;
    sx=clamp(sx,0,W-sw);sy=clamp(sy,0,H-sh);

    }else if(k.type==='pix'){

      tmp.width=tw;tmp.height=th;tctx.imageSmoothingEnabled=true;

      const [R,G,B]=hex2rgb(bgc.length>=4?bgc:'#888');c.fillStyle=lumOf(R,G,B)>.55?'#111':'#fff';

/* ---------- luminance map (для C и островов E) ---------- */
let lumMap={key:'',w:0,h:0,d:null,rgb:null};
function getLum(){
  const key=srcVer+'|'+W+'|'+H;
  if(lumMap.key===key)return lumMap;
  const lw=Math.max(8,Math.ceil(W/8)),lh=Math.max(8,Math.ceil(H/8));
  samp.width=lw;samp.height=lh;smctx.imageSmoothingEnabled=true;smctx.drawImage(src,0,0,lw,lh);
  const id=smctx.getImageData(0,0,lw,lh).data,d=new Float32Array(lw*lh);
  for(let i=0;i<lw*lh;i++)d[i]=lumOf(id[i*4],id[i*4+1],id[i*4+2]);
  lumMap={key,w:lw,h:lh,d,rgb:id};return lumMap;

function lumIdx(m,x,y){
  const xi=clamp((x/W*m.w)|0,0,m.w-1),yi=clamp((y/H*m.h)|0,0,m.h-1);return yi*m.w+xi;

/* ---------- Mode C: Text Field (текст-поле, управляемое фото; арка/перспектива) ---------- */
function renderC(c,ph){
  c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  if(P.cPhoto>0){
    c.save();c.globalAlpha=P.cPhoto;if(P.cPhotoGray)c.filter='grayscale(1)';
    c.drawImage(src,0,0);c.restore();
  }
  const m=getLum(), pl=pal();
  const str=[...P.text.replace(/\s+/g,' ')];str.push(' ');
  const n=str.length;
  // защита от тормозов: ограничиваем число глифов на кадр (~3500), увеличивая шаг при необходимости
  let S=P.cSize*RS;
  while((H/S)*(W/(S*.6))>3500)S+=1;
  const lh=S, rowsN=Math.ceil(H/lh)+2;
  const wch=ch=>(ch===' '?.32:ch.codePointAt(0)>0x2E80?1:.58)*S;
  const wd=str.map(wch), per=wd.reduce((a,b)=>a+b,0)||S;
  const bgL=lumOf(...hex2rgb(P.bg));
  const buckets=new Map();
  for(let r=-1;r<rowsN;r++){
    const y0=(r+.5)*lh, v=clamp(y0/H,0,1), dir=r%2?1:-1;
    const off=P.cStagger?hash01(r,3)*per:0;
    const sh=dir*P.cScroll*per*ph/TAU+off;
    let x=-(((sh%per)+per)%per), i=0;
    while(x<W+S){
      const w=wd[i%n], ch=str[i%n]; i++;
      const xc=x+w/2; x+=w;
      if(ch===' ')continue;
      const u=(xc/W-.5)*2;
      const yy=y0-P.cArch*H*.3*(1-u*u)*(1-v*.6);
      const k=lumIdx(m,xc,yy), lum=m.d[k];
      const dv=P.cDrive==='dark'?1-lum:lum;
      let f=P.cMinS+(1+P.cScale-P.cMinS)*dv;
      f*=clamp(1+P.cPersp*(u*u-.3),.3,3);
      const fs0=S*f;
      if(fs0<3)continue;
      // квантуем размер (~20% шаг): шрифт ставится один раз на группу, а не на каждую букву
      const fs=Math.max(3,Math.round(Math.exp(Math.round(Math.log(fs0)*5)/5)));
      let col;
      if(P.cColor==='fg')col=P.fg;
      else if(P.cColor==='photo'){const q=k*4;col=`rgb(${m.rgb[q]&0xF8},${m.rgb[q+1]&0xF8},${m.rgb[q+2]&0xF8})`}
      else if(P.cColor==='palette')col=pl[(Math.floor(dv*pl.length*.999)+r)%pl.length]||P.fg;
      else{const L=lum*P.cPhoto+bgL*(1-P.cPhoto);col=L>.5?'#111111':'#ffffff'}
      const key=fs+'|'+col;
      let bk=buckets.get(key);if(!bk){bk={fs,col,a:[]};buckets.set(key,bk)}
      const px=xc+(dv-.5)*P.cSpread*S*2;
      const py=yy+Math.sin(ph*P.cWaveK+xc*.012+r*.5)*P.cWave*S*.6*dv;
      bk.a.push(ch,px,py);
    }
  }
  c.textBaseline='middle';c.textAlign='center';
  for(const bk of buckets.values()){
    c.font=fontStr(bk.fs);c.fillStyle=bk.col;
    const a=bk.a;
    for(let j=0;j<a.length;j+=3)c.fillText(a[j],a[j+1],a[j+2]);
  }
}

/* ---------- Mode E: Layout Remix (авто-вёрстка: крупный набор + острова из пикселизованного фото) ---------- */
let eCache={key:'',L:null};
function layoutE(epoch){
  const key=[W,H,P.seed,epoch,P.text,P.font,P.weight,varStr(),P.eSize,P.eIslands,P.eIslandSize,P.eStyle,P.eCell,P.eCaps,P.eCaption,P.eDecor].join('|');
  if(eCache.key===key)return eCache.L;
  const r=rng(P.seed*977+3+epoch*7919), wd=words();
  const mg=Math.round(W*.06), avail=W-2*mg, rows=[];
  if(wd.length){
    let y=0,wi=Math.floor(r()*wd.length);const pick=()=>wd[(wi++)%wd.length];
    while(y<H&&rows.length<60){
      const a=pick(),wa=mw(a),cap=H*(.06+.12*r())/P.eSize;
      let fs=100*avail/wa,b=null;
      if(fs>cap){b=pick();fs=Math.min(cap,100*avail/(wa+mw(b)+30))}
      rows.push({t:a,t2:b,fs,y});y+=fs*1.02;
    }
    const sc=H/y;rows.forEach(o=>{o.cy=(o.y+o.fs*.5)*sc});
  }
  const styles=['dots','pixels','mono'], islands=[];
  for(let i=0;i<P.eIslands;i++){
    const s=Math.min(W,H)*(.12+.3*r()*P.eIslandSize);
    const w=Math.min(W*.9,s*(.7+.8*r())), h=Math.min(H*.9,s*(.7+.8*r()));
    const cw=.2+.5*r();
    islands.push({w,h,x:r()*(W-w),y:r()*(H-h),cw,cx:r()*(1-cw),cy:r(),cell:P.eCell*RS*(.6+.9*r()),
      style:P.eStyle==='mix'?styles[Math.floor(r()*3)]:P.eStyle,p0:r()*TAU,k:1+Math.floor(r()*2),ci:Math.floor(r()*1000)});
  }
  const caps=[],cf=Math.max(8,W*.011),cwid=W*.17;
  for(let i=0;i<P.eCaps;i++){
    const words2=P.eCaption.split(/\s+/).filter(Boolean),lines=[];let cur='';
    words2.forEach(w=>{const t=cur?cur+' '+w:w;if(mw(t)*cf/100>cwid&&cur){lines.push(cur);cur=w}else cur=t});
    if(cur)lines.push(cur);
    caps.push({x:r()*(W-cwid),y:r()*(H-cf*lines.length*1.2),lines,fs:cf});
  }
  const decor=[];
  for(let i=0;i<P.eDecor;i++)decor.push({x:r()*W,y:r()*H,r:W*(.006+.012*r()),ring:r()<.6});
  const L={rows,islands,caps,decor};eCache={key,L};return L;
}
function drawIsland(c,o,ph,bgL,pl){
  const pulse=(1-P.ePulse)+P.ePulse*(.5+.5*Math.sin(ph*o.k+o.p0));
  const cols=Math.max(2,Math.floor(o.w/o.cell)), rows=Math.max(2,Math.floor(o.h/o.cell));
  const cwid=o.w/cols, chei=o.h/rows;
  let sw=Math.min(W,o.cw*W), sh=Math.min(H,sw*o.h/o.w);
  const sx=clamp(o.cx*(W-sw)+Math.sin(ph+o.p0)*P.ePan*W*.08,0,W-sw);
  const sy=clamp(o.cy*(H-sh)+Math.cos(ph+o.p0)*P.ePan*H*.08,0,H-sh);
  samp.width=cols;samp.height=rows;smctx.imageSmoothingEnabled=true;
  smctx.drawImage(src,sx,sy,sw,sh,0,0,cols,rows);

  const mono=o.style==='mono', pix=o.style==='pixels';
  // автоконтраст по острову: форма читается даже на плавных фото

    const v=clamp(((bgL>.5?1-lum:lum)-vmin)/vr,0,1);

    else if(P.eColor==='palette')col=pl[(Math.floor(v*pl.length*.999)+o.ci)%pl.length]||P.fg;
    else col=`rgb(${R},${G},${B})`;
    c.fillStyle=col;

function renderE(c,ph){
  c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const epoch=P.eSwap>0?Math.floor(ph/TAU*P.eSwap-1e-9+1e-9)%P.eSwap:0;
  const L=layoutE(Math.max(0,epoch)), pl=pal(), bgL=lumOf(...hex2rgb(P.bg));
  const mg=Math.round(W*.06);
  const islands=()=>L.islands.forEach(o=>drawIsland(c,o,ph,bgL,pl));
  if(!P.eOver)islands();
  c.fillStyle=P.fg;c.textBaseline='middle';
  L.rows.forEach((o,i)=>{
    c.font=fontStr(o.fs);
    const cy=o.cy+Math.sin(ph*2+i*.8)*P.eWave*o.fs*.12;
    c.textAlign='left';c.fillText(o.t,mg,cy);
    if(o.t2){c.textAlign='right';c.fillText(o.t2,W-mg,cy)}
  });
  L.caps.forEach(o=>{
    c.font=fontStr(o.fs);c.textAlign='left';c.textBaseline='top';
    o.lines.forEach((s,j)=>c.fillText(s,o.x,o.y+j*o.fs*1.2));
  });

/* ---------- Mode F: Index Blocks (силуэт из блоков: кроп / смир / пустые + моно-подписи + путь) ---------- */
let maskC={key:'',w:0,h:0,d:null};
function getMask(){
  const key=[srcVer,W,H,P.fMask,P.fThresh,P.fInvert].join('|');

  const lw=Math.max(8,Math.ceil(W/6)),lh=Math.max(8,Math.ceil(H/6)),d=new Uint8Array(lw*lh).fill(1);
  if(P.fMask!=='none'){
    const mc=mk(lw,lh),x=mc.getContext('2d',{willReadFrequently:true});
    const iw=photo.naturalWidth||photo.width, ih=photo.naturalHeight||photo.height;
    const sc=Math.max(W/iw,H/ih)*P.pZoom, dw=iw*sc, dh=ih*sc, kk=lw/W;
    x.drawImage(photo,(W-dw)*P.pX*kk,(H-dh)*P.pY*kk,dw*kk,dh*kk);
    const id=x.getImageData(0,0,lw,lh).data;
    let hasA=false;for(let i=3;i<id.length;i+=4)if(id[i]<250){hasA=true;break}
    if(P.fMask==='alpha'||(P.fMask==='auto'&&hasA)){

function maskCov(m,x,y,w,h){

  const y0=clamp(Math.floor(y/H*m.h),0,m.h-1),y1=clamp(Math.ceil((y+h)/H*m.h),y0+1,m.h);

let fCache={key:'',L:null};
function layoutF(){

  if(fCache.key===key)return fCache.L;

  const wt=[['photo',P.fPhoto],['smearH',P.fSmearH],['smearV',P.fSmearV],['empty',P.fEmpty],['flat',P.fFlat]];
  const tot=wt.reduce((a,b)=>a+b[1],0)||1;
  let y=-Math.round(r()*u);

function routePoly(pts,type){

      const a=pts[i-1],b=pts[i];

function drawRoute(c,pts,q,col,ph,type){

/* ---------- Mode G: Scanner (линия «залипает» и тянет пиксели; отдельно для слоя фото и слоя текста) ---------- */
const lyP=mk(),lyPx=lyP.getContext('2d'),lyT=mk(),lyTx=lyT.getContext('2d'),scP=mk(),scPx=scP.getContext('2d'),scT=mk(),scTx=scT.getContext('2d');

function scanLayer(c,srcCv,k,ph){
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';
  c.clearRect(0,0,W,H);c.drawImage(srcCv,0,0);

  const L=vert?H:W, Lp=vert?W:H, T=k.tiles, tl=L/T;

    for(let q=0;q<Lp;q+=step){
      const qn=(q+step/2)/Lp, bi=Math.floor(q/step), bw=Math.min(step,Lp-q);
      const wv=Math.sin(qn*TAU*k.K+ph*k.waveT+t*k.tshift*1.3)+.5*Math.sin(qn*TAU*k.K*2.3+ph*k.waveT*2+1.7+t);

        else{c.clearRect(q,o,bw,s-o+1);c.drawImage(srcCv,q,s,bw,1,q,o,bw,s-o+1)}

        else{c.clearRect(o,q,s-o+1,bw);c.drawImage(srcCv,s,q,1,bw,o,q,s-o+1,bw)}
        if(mir){
          const m=Math.min(s-o,e-s);

/* ---------- Mode H: Path Flow (траектория: фото-лента «развёрнутая» вдоль пути, текст на пути, тонкая линия) ---------- */
function hControl(ph){

    else if(P.hShape==='spiral'){const a=t*TAU*2.2,rr=(.08+.42*t)*Math.min(W,H)*(.6+A);x=W/2+Math.cos(a)*rr;y=H/2+Math.sin(a)*rr}
    else if(P.hShape==='loop'){const a=t*TAU;x=W/2+Math.sin(a)*W*.36;y=H/2+Math.sin(2*a)*H*.42*A}
    else if(P.hShape==='zigzag'){x=m+t*(W-2*m);y=H/2+((i%2)?1:-1)*H*.4*A}
    else{x=m+t*(W-2*m);y=clamp(H*(.5+(r()-.5)*1.6*A),H*.08,H*.92)}
    x+=Math.sin(ph+i*1.9)*P.hWobble*W*.04;y+=Math.cos(ph+i*2.6)*P.hWobble*H*.04;
    pts.push([x,y,i]);
  }

}
function hSamples(pts){
  const poly=routePoly(pts,'curve'), cum=[0];
  for(let i=1;i<poly.length;i++)cum.push(cum[i-1]+Math.hypot(poly[i][0]-poly[i-1][0],poly[i][1]-poly[i-1][1]));
  const total=cum[cum.length-1], ds=Math.max(3,4*RS), N=Math.max(2,Math.floor(total/ds));
  const xs=new Float32Array(N),ys=new Float32Array(N),as=new Float32Array(N);
  let j=1;
  for(let i=0;i<N;i++){
    const s=i/(N-1)*total;
    while(j<poly.length-1&&cum[j]<s)j++;
    const seg=cum[j]-cum[j-1]||1, u=clamp((s-cum[j-1])/seg,0,1);
    xs[i]=poly[j-1][0]+(poly[j][0]-poly[j-1][0])*u;ys[i]=poly[j-1][1]+(poly[j][1]-poly[j-1][1])*u;
  }
  for(let i=0;i<N;i++){const a=Math.max(0,i-2),b=Math.min(N-1,i+2);as[i]=Math.atan2(ys[b]-ys[a],xs[b]-xs[a])}

}
function hRibbon(c,cl,e,E,ph){
  const baseW=W*.11*P.hWidth/Math.sqrt(E), off=(e-(E-1)/2)*W*.11*P.hWidth*P.hEchoGap/Math.sqrt(E);
  const N=cl.N, sw=src.width, sh=src.height;
  const wAt=i=>{const t=i/(N-1);return baseW*(1-P.hTaper*Math.abs(2*t-1))*(1+P.hPulse*Math.sin(t*TAU*P.hPulseK+ph+e*.7))};

    const cropH=sh*P.hCrop, cy0=(sh-cropH)*clamp(.5+(e-(E-1)/2)*.22*P.hShift,0,1);
    const sliceW=Math.max(1,sw*cl.ds/cl.total*1.6);
    for(let i=0;i<N;i++){
      const w=wAt(i);if(w<.6)continue;
      const a=cl.a[i],cs=Math.cos(a),sn=Math.sin(a),cx=cl.x[i]-sn*off,cy=cl.y[i]+cs*off;
      const u=(((i/(N-1))+P.hFlow*ph/TAU+e*.13*P.hShift)%1+1)%1;
      c.setTransform(cs,sn,-sn,cs,cx,cy);
      c.drawImage(src,Math.min(sw-sliceW,u*sw),cy0,sliceW,cropH,-cl.ds*.8,-w/2,cl.ds*1.6,w);

      const w=wAt(i),a=cl.a[i],nx=-Math.sin(a),ny=Math.cos(a);
      L.push([cl.x[i]+nx*(off+w/2),cl.y[i]+ny*(off+w/2)]);R.push([cl.x[i]+nx*(off-w/2),cl.y[i]+ny*(off-w/2)]);

/* ---------- Mode I: Floating Pieces (фото режется на куски-шейпы, они плавают и соединены линиями по порядку) ---------- */
let iCache={key:'',L:null};
function layoutI(){

  if(iCache.key===key)return iCache.L;
  const r=rng(P.seed*271+11), n=P.iN, pcs=[], m=Math.min(W,H)*.06;
  const shapes=['round','circle','pill','arch','square'];
  for(let i=0;i<n;i++){
    const sz=Math.min(W,H)*(.11+.2*Math.pow(r(),1.4))*P.iSize;
    let shape=P.iShape==='mix'?shapes[Math.floor(r()*shapes.length)]:P.iShape;
    let w=sz*(.75+.5*r()), h=sz*(.75+.5*r());
    if(shape==='circle')h=w;

  }

    for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){
      const A=pcs[a],B=pcs[b],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,min=(A.rad+B.rad)*.85;

    }
    pcs.forEach(o=>{o.x=clamp(o.x,m+o.w/2,W-m-o.w/2);o.y=clamp(o.y,m+o.h/2,H-m-o.h/2)});

function iShapePath(c,o,w,h){
  const rn=P.iRound;

  else if(o.shape==='arch'){c.beginPath();c.moveTo(-w/2,h/2);c.lineTo(-w/2,0);c.arc(0,0,w/2,Math.PI,0);c.lineTo(w/2,h/2);c.closePath()}
  else if(o.shape==='pill')rr(c,-w/2,-h/2,w,h,Math.min(w,h)/2);
  else if(o.shape==='square')rr(c,-w/2,-h/2,w,h,0);

const linkType=j=>P.ilType==='mix'?['curve','ortho','arc','straight'][j%4]:P.ilType;
function iInside(o,lx,ly){
  const hw=o.w/2,hh=o.h/2;

  if(o.shape==='arch'){if(ly>hh||Math.abs(lx)>hw)return false;return ly>=0||lx*lx+ly*ly<=hw*hw}

// точка на реальной границе куска (с учётом формы и поворота) в направлении цели; inset — небольшой заход внутрь, чтобы линия всегда касалась куска

function iDrawLinks(c,links,ph){

    const col=P.ilColor==='palette'?(pl[j%pl.length]||P.fg):P.ilColor==='contrast'?(bgL>.5?'#111111':'#ffffff'):P.fg;
    const poly=iLinkPoly(lk.a,lk.b,type,P.ilBend*(j%2?1:-1),j,lk.mid), seg=[];let tot=0;

function renderI(c,ph){
  c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  if(P.tOn&&!P.iTextOver)drawTextLayer(c,ph,P.tAlpha,P.tBlend);
  const {pcs,order}=layoutI(), pl=pal(), wd=words(), amp=P.iFloat*Math.min(W,H)*.045;
  const cur=pcs.map(o=>({x:o.x+Math.sin(ph*o.kx+o.p0)*amp*(.5+o.ax),y:o.y+Math.cos(ph*o.ky+o.p1)*amp*(.5+o.ay),rot:o.rot0+Math.sin(ph+o.p0)*P.iSpin*.35}));

  const links=[];
  if(P.ilOn){
    const n=order.length, cnt=P.iClose&&n>2?n:n-1;
    for(let k=0;k<cnt;k++){
      const ia=order[k],ib=order[(k+1)%n],A=pcs[ia],B=pcs[ib],pa=cur[ia],pb=cur[ib];
      const inset=(P.ilAbove?0:2)*RS;

        links.push({a:iAnchor(A,pa,mid[0],mid[1],inset),b:iAnchor(B,pb,mid[0],mid[1],inset),mid});

      const o=pcs[i],p=cur[i];
      c.save();c.translate(p.x,p.y);c.rotate(p.rot);
      iShapePath(c,o,o.w,o.h);c.save();c.clip();

        const bgc=pl[o.ci%pl.length]||P.fg;c.fillStyle=bgc;c.fillRect(-o.w/2,-o.h/2,o.w,o.h);
        const word=wd.length?wd[o.wi%wd.length]:'';

      }else{
        const z=Math.max(.25,P.iZoom), sw=Math.min(W,o.w/z), sh=Math.min(H,o.h/z);

      }
      c.restore();
      if(P.iOutline){c.strokeStyle=P.fg;c.lineWidth=Math.max(1,RS*1.2);iShapePath(c,o,o.w,o.h);c.stroke()}

      }
      c.restore();
    });
  }
  if(P.ilAbove)iDrawLinks(c,links,ph);
  if(P.tOn&&P.iTextOver)drawTextLayer(c,ph,P.tAlpha,P.tBlend);
}

/* ---------- Mode J: Echo Trail (копии объекта: первая плывёт по постеру, остальные повторяют путь с задержкой) ---------- */

let jSpr=new Map(), jKey='';

    rows.forEach(([rx,ry,len,ang])=>{

      x.save();x.translate(rx,ry);x.rotate(ang);x.beginPath();x.rect(-len/2,-bfs,len,bfs*2);x.clip();x.fillText(t,0,0);x.restore();
    });
  }

}
function renderJ(c,ph){
  c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const wd=words(), nw=Math.max(1,wd.length), N=P.jN, th0=ph;
  // размах пути считаем по реальному размеру объекта, чтобы он не уезжал за край постера
  const lead=jSprite((((P.jWordStart)%nw)+nw)%nw,'lead');
  const ax=Math.max(0,(W-lead.width)/2)*.96*P.jRange, ay=Math.max(0,(H-lead.height)/2)*.96*P.jRange;
  const mono='"Courier New", Menlo, Monaco, monospace';
  for(let k=N-1;k>=0;k--){
    const th=th0-k*P.jSpacing;let x,y;
    if(P.jPath==='circle'){x=W/2+ax*Math.cos(th);y=H/2+ay*Math.sin(th)}
    else if(P.jPath==='figure8'){x=W/2+ax*Math.sin(th);y=H/2+ay*Math.sin(2*th)}
    else if(P.jPath==='wave'){x=W/2+ax*Math.sin(th);y=H/2+ay*.5*Math.sin(3*th+.6)}
    else{x=W/2+ax*Math.sin(P.jFx*th+.4);y=H/2+ay*Math.sin(P.jFy*th)}
    const wi=(((P.jWordStart+(P.jWordCycle?k:0))%nw)+nw)%nw;
    const spr=jSprite(wi,k===0?'lead':'fol');
    c.save();
    c.translate(x,y);c.rotate(P.jTilt*.5*Math.sin(th+.5));const gs=Math.pow(1+P.jGrow,k);c.scale(gs,gs);c.drawImage(spr,-spr.width/2,-spr.height/2);
    if(P.jNums&&spr._belt){
      const fs=Math.max(8,H*.014);c.font=`400 ${Math.round(fs)}px ${mono}`;c.fillStyle=P.fg;c.textAlign='left';c.textBaseline='top';
      c.fillText(String(k+1).padStart(2,'0'),-spr._ow/2,-spr._oh/2-spr._o-Math.max(8,H*.032*P.jtSize)*1.9);
    }
    c.restore();
  }
}

/* ---------- Mode K: Stagger Tiles ---------- */
function renderK(c,ph){
  {const t=P.tOn;P.tOn=false;buildComposite(ph);P.tOn=t}
  c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const nc=Math.max(1,P.kCols), nr=Math.max(1,P.kRows), tw=W/nc, th=H/nr;
  const curve=(u,n)=>{const h=Math.max(.5,(n-1)/2);return P.kCurve==='mirror'?Math.abs(u):P.kCurve==='ease'?Math.sign(u)*Math.pow(Math.abs(u)/h,2)*h:u};
  const sk=P.kSkew*tw*3;
  for(let j=0;j<nr;j++){
    const y0=Math.round(j*th), y1=Math.round((j+1)*th), cy=(y0+y1)/2;
    const uy=nr>1?(j-(nr-1)/2):0;
    for(let i=0;i<nc;i++){
      const x0=Math.round(i*tw), x1=Math.round((i+1)*tw), cx=(x0+x1)/2;
      const ux=nc>1?(i-(nc-1)/2):0;
      const t=.5+.5*Math.sin(ph*P.kK+(i+j)*P.kDelay-Math.PI/2);
      const m=(1-P.kAnim)+P.kAnim*t;
      const ox=curve(ux,nc)*P.kShiftX*tw*m, oy=curve(uy,nr)*P.kShiftY*th*m;
      const sx=1+P.kStretch*(nc>1?ux/(nc/2):0)*m;
      c.save();
      c.beginPath();
      if(sk){c.moveTo(x0-sk,y0);c.lineTo(x1-sk,y0);c.lineTo(x1+sk,y1);c.lineTo(x0+sk,y1);c.closePath()}
      else c.rect(x0,y0,x1-x0,y1-y0);
      c.clip();
      c.translate(cx,0);c.scale(sx,1);c.translate(-cx,0);
      c.drawImage(comp,ox,oy);
      c.restore();
    }
  }
  if(P.kaOn)kArcText(c,ph);
}

function kArcText(c,ph){
  const str=[...P.text.replace(/\s+/g,' ').trim()];if(!str.length)return;str.push(' ');
  const fs=Math.max(8,W*.03*P.kaSize), adv=ch=>(ch===' '?.32:ch.codePointAt(0)>0x2E80?1:.58)*fs;
  const wd=str.map(adv), per=wd.reduce((a,b)=>a+b,0), rg=rng(P.seed*53+7), pl=pal();
  c.save();c.font=fontStr(fs);c.fillStyle=P.fg;c.textAlign='center';c.textBaseline='middle';
  for(let n=0;n<P.kaN;n++){
    const cx=W/2+(rg()-.5)*W*P.kaSpread*1.2, cy=H/2+(rg()-.5)*H*P.kaSpread*1.2;
    const R=Math.max(fs*2,Math.min(W,H)*(.3+rg()*.55)), a0=rg()*TAU, dir=n%2?1:-1;
    const circ=TAU*R, reps=Math.max(1,Math.round(circ/per)), k=circ/(reps*per);   // целое число повторов по кольцу → бесшовный луп
    if(P.kaColor==='palette')c.fillStyle=pl[n%pl.length];
    const sh=dir*per*k*ph/TAU;
    let s=0;
    for(let r=0;r<reps;r++)for(let i=0;i<str.length;i++){
      const w=wd[i]*k, sc=s+w/2;s+=w;
      if(str[i]===' ')continue;
      const a=a0+(sc+sh)/R;
      c.setTransform(1,0,0,1,0,0);c.translate(cx+Math.cos(a)*R,cy+Math.sin(a)*R);c.rotate(a+Math.PI/2);
      c.fillText(str[i],0,0);
    }
  }
  c.restore();
}

/* ---------- Mode L: Scan Reveal ---------- */
function renderL(c,ph){
  {const t=P.tOn;P.tOn=false;buildComposite(ph);P.tOn=t}   // фото отдельно, текст — отдельным слоем сверху
  c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const vert=P.lDir==='down'||P.lDir==='up', rev=P.lDir==='up'||P.lDir==='left';
  const t=ph/TAU, p1=clamp(t/.9,0,1);                 // 90% лупа рисуется, 10% пауза, затем кадр исчезает
  // фото двигается вместе с линией скана → результат длиннее оригинала в (1+растяжение) раз; чтобы он влез в кадр, исходник уменьшается
  const sc=Math.min(P.lScale,1/(1+P.lStretch)), rw=W*sc, rh=H*sc;
  const L=vert?rh:rw, X=vert?rw:rh, st=Math.max(1,Math.round(P.lStep*RS));
  const nOut=Math.max(1,Math.ceil(L/st*(1+P.lStretch))), Lo=nOut*st;
  const ox=vert?(W-rw)*(.5+.5*P.lPosX):(W-Lo)*(.5+.5*P.lPosX), oy=vert?(H-Lo)*(.5+.5*P.lPosY):(H-rh)*(.5+.5*P.lPosY);
  const lat=(x,o)=>{const i=Math.floor(x),f=x-i,a=hash01(i,o),b=hash01(i+1,o),u=(1-Math.cos(f*Math.PI))/2;return a+(b-a)*u};
  // ход исходника относительно линии скана: v — сколько пикселей фото проходит за пиксель результата.
  // v<1 растягивает, v>1 «съедает» кусок, v<0 — фото ведут назад, и кадры повторяются. В среднем фото считывается целиком.
  const v=new Float32Array(nOut);let sv=0;
  // профиль хода: цепочка фаз со своим режимом (медленно / назад / быстро / очень быстро / ровно), режимы плавно перетекают друг в друга
  const rg=rng(P.seed*17+3), RG=[()=>.12+rg()*.25,()=>-(.5+rg()*1.1),()=>1.8+rg()*1.4,()=>3.5+rg()*3,()=>.8+rg()*.5];
  const nk=P.lSegs+1, kv=[];let prev=-1;
  for(let i=0;i<nk;i++){let r;do{r=Math.floor(rg()*RG.length)}while(r===prev);prev=r;kv.push(RG[r]())}
  for(let k=0;k<nOut;k++){
    const us=(k+.5)/nOut, x=us*(nk-1), i0=Math.min(nk-2,Math.floor(x)), f=x-i0, u=(1-Math.cos(f*Math.PI))/2;
    const prof=kv[i0]+(kv[i0+1]-kv[i0])*u;
    v[k]=1+(prof-1)*P.lVar+P.lVar*.25*((lat(us*P.lFreq*4,52)*2-1));sv+=v[k];
  }
  const cn=sv>1e-3?L/(st*sv):1/(1+P.lStretch);
  if(P.lGray)c.filter='grayscale(1)';
  let sp=0;
  for(let k=0;k<nOut;k++){
    const us=(k+.5)/nOut, ds=v[k]*cn*st, smid=sp+ds/2, slen=Math.max(.6,Math.abs(ds));sp+=ds;
    if(us>p1)break;
    const w=(lat(us*P.lFreq*2,41)*2-1)+.5*(lat(us*P.lFreq*5,42)*2-1)+P.lRough*(lat(us*P.lFreq*17,43)*2-1)*.6+P.lRough*(hash01(k,44)-.5)*.35;
    const wb=P.lWob, wx=Math.sin(us*TAU*3+ph)+.6*Math.sin(us*TAU*7-2*ph+1), wy=Math.sin(us*TAU*4+ph+2)+.5*Math.sin(us*TAU*9-ph);   // лёгкий зацикленный дисплейс
    const off=Math.round(P.lAmp*X*.3*w+wb*wx*X*.012);
    const dpos=rev?Lo-(k+1)*st:k*st;
    let spos=clamp((rev?L-smid-slen/2:smid-slen/2)+wb*wy*L*.006,0,Math.max(0,L-slen));
    if(vert)c.drawImage(comp,0,spos/sc,W,slen/sc,ox+off,oy+dpos,rw,st);
    else c.drawImage(comp,spos/sc,0,slen/sc,H,ox+dpos,oy+off,st,rh);
  }
  c.filter='none';
  if(P.tOn){
    if(P.tStyle==='protocol')lTypo(c,ph,p1,vert,rev,P.tAlpha,P.tBlend,true);
    else drawTextLayer(c,ph,P.tAlpha,P.tBlend);                      // текст — отдельный слой, виден всегда
  }
}
// «Протокол сканирования»: два гигантских слова и два параграфа в случайных местах, линейка вдоль оси скана с маркером линии
function lTypo(c,ph,p1,vert,rev,alpha,blend,ruler){
  const ws=words(); if(!ws.length)return;
  const m=W*.035, up=x=>x.toUpperCase();
  const cl=P.tColor==='bg'?P.bg:P.tColor==='palette'?(pal()[0]||P.fg):P.fg;
  c.save();c.globalAlpha=alpha;c.globalCompositeOperation=blend;c.fillStyle=cl;c.strokeStyle=cl;
  const rg=rng(P.seed*29+11);        // позиции случайные, но привязаны к seed (Remix → новая раскладка)
  // 1) два гигантских слова в случайных местах холста
  const big=(txt)=>{
    c.font=fontStr(100);const w100=c.measureText(txt).width||100;
    const tw=W*(.55+rg()*.4), fs=Math.min(100*tw/w100,H*.2*P.tSize);
    c.font=fontStr(fs);c.textAlign='left';c.textBaseline='alphabetic';
    const mt=c.measureText(txt), w=mt.width, asc=mt.actualBoundingBoxAscent||fs*.72;
    const x=m+rg()*Math.max(0,W-2*m-w), y=m+asc+rg()*Math.max(0,H-2*m-asc);
    c.fillText(txt,x,y);
  };
  big(up(ws[0]));big(up(ws.length>1?ws[ws.length-1]:ws[0]));
  // 2) два параграфа мелкого текста в случайных местах; каждый плавно едет (целый цикл за луп)
  const fs=Math.max(8,W*.016*P.tSize), lh=fs*1.35;
  c.font=fontStr(fs);c.textAlign='left';c.textBaseline='top';
  const body=ws.slice(1,-1).concat(ws).map(up);
  for(let col=0;col<2;col++){
    const cw=W*(.16+rg()*.12), bh=H*(.16+rg()*.16);
    const bx=m+rg()*Math.max(0,W-2*m-cw), by=m+rg()*Math.max(0,H-2*m-bh);
    const lines=[];let cur='';
    for(const wd of body){const t=cur?cur+' '+wd:wd;if(c.measureText(t).width>cw&&cur){lines.push(cur);cur=wd}else cur=t}
    if(cur)lines.push(cur);
    const T=Math.max(lines.length,1)*lh, sh=(((ph/TAU)*T*(col?-1:1))%T+T)%T;
    c.save();c.beginPath();c.rect(bx-2,by,cw+4,bh);c.clip();
    for(let r=-1;r<bh/lh+2;r++){
      const li=(((Math.floor(r+sh/lh))%lines.length)+lines.length)%lines.length;
      c.fillText(lines[li],bx,by+r*lh-(sh%lh));
    }
    c.restore();
  }
  // 3) линейка вдоль оси скана и маркер текущей позиции линии (только в сцене L)
  if(!ruler){c.restore();return}
  const LF=vert?H:W, x0=m*.5, step=LF/60;
  c.lineWidth=Math.max(1,W*.0016);c.font=fontStr(Math.max(7,W*.011));c.textBaseline='middle';
  const hd=rev?LF*(1-p1):LF*p1;
  c.beginPath();
  for(let i=0;i<=60;i++){
    const q=i*step, major=i%5===0, len=major?W*.014:W*.007;
    if(vert){c.moveTo(x0,q);c.lineTo(x0+len,q)}else{c.moveTo(q,H-x0);c.lineTo(q,H-x0-len)}
  }
  c.stroke();
  c.beginPath();
  if(vert){c.moveTo(x0,hd);c.lineTo(x0+W*.03,hd-W*.009);c.lineTo(x0+W*.03,hd+W*.009)}
  else{c.moveTo(hd,H-x0);c.lineTo(hd-W*.009,H-x0-W*.03);c.lineTo(hd+W*.009,H-x0-W*.03)}
  c.closePath();c.fill();
  const num=String(Math.round(p1*1000)).padStart(4,'0');
  c.textAlign='left';
  if(vert)c.fillText(num,x0+W*.036,hd);else c.fillText(num,hd+W*.012,H-x0-W*.036);
  c.restore();
}

/* ---------- Mode M: Worm Type (слова — «черви»: буквы раздельно внутри толстой извилистой капсулы) ---------- */
let wormLay={key:'',worms:[],T:0};
const wormLayer=mk(),wormLx=wormLayer.getContext('2d');
function layoutWorms(){
  const wd=words();if(!wd.length)return {worms:[],T:0};
  const key=[W,H,P.seed,P.text,P.mN,P.mScale,P.mSpacing,P.mCurl,P.mGap].join('|');
  if(wormLay.key===key)return wormLay;
  const rg=rng(P.seed*71+13), list=[];
  for(let i=0;i<P.mN;i++)list.push([...wd[i%wd.length]]);
  // толщина подбирается так, чтобы черви занимали ~45% холста
  let units=0;list.forEach(ch=>units+=Math.max(1,ch.length)*P.mSpacing+.6);
  const T=Math.min(W,H)*.2<Math.sqrt(.36*W*H/units)?Math.min(W,H)*.2:Math.sqrt(.36*W*H/units);
  const th=T*P.mScale, step=th*P.mSpacing, ds=th*.4;
  const gcell=th*.5, gw=Math.ceil(W/gcell), gh=Math.ceil(H/gcell), occ=new Uint8Array(gw*gh);
  const rad=th*(.5+P.mGap)/gcell;
  const order=list.map((c,i)=>i).sort((a,b)=>list[b].length-list[a].length);
  const worms=new Array(list.length);
  const mkPath=(n,len)=>{
    const n2=Math.max(2,Math.ceil(len/ds)), x0=th+rg()*(W-2*th), y0=th+rg()*(H-2*th), a0=rg()*TAU;
    const p1=th*(7+rg()*7), p2=th*(3+rg()*5), f1=rg()*TAU, f2=rg()*TAU, A=P.mCurl*.5/th*ds;
    const pts=[];let x=x0,y=y0,a=a0;
    for(let j=0;j<n2;j++){
      pts.push(x,y);
      const s=j*ds;a+=A*(Math.sin(TAU*s/p1+f1)+.6*Math.sin(TAU*s/p2+f2))*2.2;
      x+=Math.cos(a)*ds;y+=Math.sin(a)*ds;
    }
    return pts;
  };
  const hits=pts=>{
    let h=0;
    for(let j=0;j<pts.length;j+=2){
      const x=pts[j],y=pts[j+1];
      if(x<th*.5||x>W-th*.5||y<th*.5||y>H-th*.5){h+=50;continue}
      const cx=Math.floor(x/gcell),cy=Math.floor(y/gcell);
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const gx=cx+dx,gy=cy+dy;if(gx>=0&&gy>=0&&gx<gw&&gy<gh&&occ[gy*gw+gx])h++}
    }
    return h;
  };
  const mark=pts=>{
    const r=Math.ceil(rad);
    for(let j=0;j<pts.length;j+=2){
      const cx=Math.floor(pts[j]/gcell),cy=Math.floor(pts[j+1]/gcell);
      for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(dx*dx+dy*dy>r*r)continue;const gx=cx+dx,gy=cy+dy;if(gx>=0&&gy>=0&&gx<gw&&gy<gh)occ[gy*gw+gx]=1}
    }
  };
  for(const i of order){
    const ch=list[i], len=(Math.max(1,ch.length)-1)*step+th;
    let best=null,bh=1e9;
    for(let t=0;t<80&&bh>0;t++){const pts=mkPath(ch.length,len), h=hits(pts);if(h<bh){bh=h;best=pts}}
    mark(best);
    worms[i]={pts:best,len,ch,ph:rg()*TAU,pr:rg(),ci:i};
  }
  wormLay={key,worms,T:th,step};return wormLay;
}
function renderM(c,ph){
  c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  if(P.mBgOn){c.save();c.globalCompositeOperation=P.mBgBlend;c.drawImage(src,0,0);c.restore()}
  const L=layoutWorms();if(!L.worms.length)return;
  const th=L.T, pl=pal().filter(x=>x.toLowerCase()!==P.bg.toLowerCase());if(!pl.length)pl.push(P.fg);
  if(wormLayer.width!==W||wormLayer.height!==H){wormLayer.width=W;wormLayer.height=H}
  wormLx.setTransform(1,0,0,1,0,0);wormLx.clearRect(0,0,W,H);
  // 1) анимированная осевая линия каждого червя (бегущая волна, целые циклы за луп)
  L.worms.forEach(w=>{w.photo=w.pr<P.mPhoto});   // доля фото-червей меняется без пересчёта раскладки
  const lines=L.worms.map(w=>{
    const n=w.pts.length/2, out=new Float32Array(w.pts.length), cum=new Float32Array(n);
    for(let j=0;j<n;j++){
      const j0=Math.max(0,j-1),j1=Math.min(n-1,j+1);
      let tx=w.pts[j1*2]-w.pts[j0*2],ty=w.pts[j1*2+1]-w.pts[j0*2+1];const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;
      const u=n>1?j/(n-1):0, d=P.mWig*th*.3*(.5+.5*Math.sin(Math.PI*u))*Math.sin(TAU*u*1.6-ph+w.ph);
      out[j*2]=w.pts[j*2]-ty*d;out[j*2+1]=w.pts[j*2+1]+tx*d;
      if(j>0)cum[j]=cum[j-1]+Math.hypot(out[j*2]-out[j*2-2],out[j*2+1]-out[j*2-1]);
    }
    return {out,cum,n};
  });
  const stroke=(cx,w,l,col)=>{
    cx.beginPath();cx.moveTo(l.out[0],l.out[1]);for(let j=1;j<l.n;j++)cx.lineTo(l.out[j*2],l.out[j*2+1]);
    cx.lineWidth=th;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle=col;cx.stroke();
  };
  // 2) цветные черви
  L.worms.forEach((w,i)=>{if(!w.photo)stroke(c,w,lines[i],pl[w.ci%pl.length])});
  // 3) фото-черви: маска-слой + source-in
  if(L.worms.some(w=>w.photo)){
    L.worms.forEach((w,i)=>{if(w.photo)stroke(wormLx,w,lines[i],'#000')});
    wormLx.globalCompositeOperation='source-in';wormLx.drawImage(src,0,0);wormLx.globalCompositeOperation='source-over';
    c.drawImage(wormLayer,0,0);
  }
  // 4) буквы
  const fs=th*.5*P.mLetter;
  c.font=fontStr(fs);c.textAlign='center';c.textBaseline='middle';
  L.worms.forEach((w,i)=>{
    const l=lines[i], n=w.ch.length, total=l.cum[l.n-1]||1, k0=(th*.5)/w.len;
    c.fillStyle=w.photo?P.fg:textOn(pl[w.ci%pl.length]);
    for(let k=0;k<n;k++){
      const f=n>1?(th*.5+k*L.step)/w.len:.5, target=Math.min(1,f)*total;
      let j=1;while(j<l.n-1&&l.cum[j]<target)j++;
      const sg=(l.cum[j]-l.cum[j-1])||1, q=clamp((target-l.cum[j-1])/sg,0,1);
      const x=l.out[(j-1)*2]+(l.out[j*2]-l.out[(j-1)*2])*q, y=l.out[(j-1)*2+1]+(l.out[j*2+1]-l.out[(j-1)*2+1])*q;
      if(P.mAlong){c.save();c.translate(x,y);c.rotate(Math.atan2(l.out[j*2+1]-l.out[(j-1)*2+1],l.out[j*2]-l.out[(j-1)*2]));c.fillText(w.ch[k],0,fs*.04);c.restore()}
      else c.fillText(w.ch[k],x,y+fs*.04);
    }
  });
}

/* ---------- Mode N: Soft Focus (фото всегда в блере: прогрессивный блер + растворение в фон, текст — чёткий отдельный слой) ---------- */
const NLV=6;
let nLev={key:'',lv:[]};
const nLayer=mk(),nLx=nLayer.getContext('2d');
function nLevels(rx,ry,rw,rh){
  const key=[srcVer,W,H,P.bg,P.nScale,P.nX,P.nY,P.nBlur,P.nMin,rx|0,ry|0].join('|');
  if(nLev.key===key)return nLev.lv;
  const pad=Math.ceil(P.nBlur*RS*2.4)+4;
  const base=mk(W+pad*2,H+pad*2),bx=base.getContext('2d');
  bx.fillStyle=P.bg;bx.fillRect(0,0,base.width,base.height);
  bx.drawImage(src,0,0,W,H,rx+pad,ry+pad,rw,rh);
  // продление краёв кадра, чтобы блер не «съедал» границы фото на краю холста
  if(rx<=0.5){bx.drawImage(src,0,0,1,H,0,ry+pad,pad,rh)}
  if(rx+rw>=W-.5){bx.drawImage(src,W-1,0,1,H,W+pad,ry+pad,pad,rh)}
  if(ry<=0.5){bx.drawImage(src,0,0,W,1,rx+pad,0,rw,pad)}
  if(ry+rh>=H-.5){bx.drawImage(src,0,H-1,W,1,rx+pad,H+pad,rw,pad)}
  const lv=[];
  for(let k=0;k<NLV;k++){
    const r=(P.nMin+(P.nBlur-P.nMin)*(k/(NLV-1)))*RS, c=mk(W,H),x=c.getContext('2d');
    if(r>.3)x.filter=`blur(${r.toFixed(1)}px)`;
    x.drawImage(base,-pad,-pad);x.filter='none';lv.push(c);
  }
  nLev={key,lv};return lv;
}
function renderN(c,ph){
  c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const vert=P.nDir==='down'||P.nDir==='up', rev=P.nDir==='up'||P.nDir==='left';
  const sc=P.nScale, rw=W*sc, rh=H*sc, rx=(W-rw)*(.5+.5*P.nX), ry=(H-rh)*(.5+.5*P.nY);
  const lv=nLevels(rx,ry,rw,rh), L=vert?rh:rw, st=Math.max(2,Math.round(3*RS)), n=Math.ceil(L/st);
  if(nLayer.width!==W||nLayer.height!==H){nLayer.width=W;nLayer.height=H}
  nLx.setTransform(1,0,0,1,0,0);nLx.globalCompositeOperation='source-over';nLx.globalAlpha=1;nLx.clearRect(0,0,W,H);
  const f0=P.nFocus+.45*P.nPull*Math.sin(ph);                 // «протяжка фокуса»: целая волна за луп
  const sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
  for(let i=0;i<n;i++){
    const a=i*st, len=Math.min(st,L-a), u0=(i+.5)*st/L, u=rev?1-u0:u0;
    const t=sm((u-f0)/P.nRamp)*(NLV-1), k=Math.min(NLV-2,Math.floor(t)), fr=t-k;
    const pos=rev?L-a-len:a, sx=vert?rx:rx+pos, sy=vert?ry+pos:ry, sw=vert?rw:len, sh=vert?len:rh;
    if(fr<.999||NLV<2){nLx.globalAlpha=1;nLx.drawImage(lv[k],sx,sy,sw,sh,sx,sy,sw,sh)}
    if(fr>.001){nLx.globalAlpha=fr;nLx.drawImage(lv[k+1],sx,sy,sw,sh,sx,sy,sw,sh)}
  }
  nLx.globalAlpha=1;
  // растворение в фон к «дальнему» краю фото
  if(P.nFade>0){
    const g=vert?nLx.createLinearGradient(0,ry,0,ry+rh):nLx.createLinearGradient(rx,0,rx+rw,0);
    const a0=Math.max(0,1-P.nFade);
    const stops=rev?[[0,0],[1-a0,1]]:[[a0,1],[1,0]];
    if(rev){g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(Math.min(1,P.nFade),'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,1)')}
    else{g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(a0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)')}
    nLx.globalCompositeOperation='destination-in';nLx.fillStyle=g;nLx.fillRect(0,0,W,H);nLx.globalCompositeOperation='source-over';
  }
  // медленный дрейф: лёгкий зум и сдвиг (зациклено)
  const d=P.nDrift, z=1+.1*d+.05*d*Math.sin(ph), ox=.02*W*d*Math.sin(ph+1), oy=.02*H*d*Math.sin(ph+2.2);
  c.save();c.translate(W/2+ox,H/2+oy);c.scale(z,z);c.translate(-W/2,-H/2);c.drawImage(nLayer,0,0);c.restore();
  if(P.tOn)drawTextLayer(c,ph,P.tAlpha,P.tBlend);   // текст — общий слой с вёрстками, чёткий, поверх размытого фото
}
/* ---------- Mode O: Cylinder (листы-фото, закреплённые на вертикальной оси и расходящиеся радиально по кругу; цилиндр вращается) ---------- */
const oHalf=mk(),oHx=oHalf.getContext('2d');
function renderO(c,ph){
  c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const sa=srcAlpha();      // прозрачный PNG остаётся прозрачным: листы видны друг сквозь друга
  const N=Math.max(3,P.oN), hh=H*P.oSize, cy=H/2+P.oAxisY*H*.35, cx=W/2+P.oAxis*W*.35, sw=Math.max(2,Math.round(2*RS));
  const R=W/2*P.oRadius, pk=Math.min(R/W,hh/H), Lw=W*pk, Lh=H*pk, step=TAU/N;
  const rot=P.oSpin==='swing'?Math.sin(ph)*step*1.5*P.oSteps:(P.oSpin==='left'?-1:1)*ph/TAU*step*P.oSteps;
  // листы от дальних к ближним: sinφ — глубина (>0 ближе к зрителю)
  const L=[];for(let k=0;k<N;k++){const f=rot+k*step;L.push({f,z:Math.sin(f),cs:Math.cos(f)})}
  L.sort((a,b)=>a.z-b.z);
  c.save();c.translate(W/2,H/2);c.scale(P.oScale,P.oScale);c.translate(-W/2,-H/2);
  for(const l of L){
    const wp=Lw*Math.abs(l.cs);if(wp<1)continue;
    const dir=l.cs>=0?1:-1, n=Math.max(1,Math.ceil(wp/sw));
    for(let j=0;j<n;j++){
      const t=(j+.5)/n, x=cx+dir*wp*(1-t), dw=wp/n+.8;
      const h=Lh*(1+P.oPersp*l.z*(1-t)), top=cy-h/2;            // у оси (t=1) высота одинаковая, свободный край меняется с глубиной
      const sxw=W/n, sx=t*W-sxw/2;
      c.drawImage(sa,Math.max(0,sx),0,sxw,H,x-dw/2,top,dw,h);
    }
  }
  c.restore();
  if(P.tOn)drawTextLayer(c,ph,P.tAlpha,P.tBlend);        // общий слой текста поверх
}

/* ---------- Mode P: Overlap Shapes (пересекающиеся шейпы: фото и заливка показываются только в нужных зонах — пересечения / одиночные / всё / снаружи; текстовые кольца) ---------- */
const pLay={key:'',sh:[]};
const pU=mk(),pUx=pU.getContext('2d'),pO=mk(),pOx=pO.getContext('2d'),pS=mk(),pSx=pS.getContext('2d'),pT=mk(),pTx=pT.getContext('2d'),pM=mk(),pMx=pM.getContext('2d'),pL=mk(),pLx=pL.getContext('2d');
function pLayout(){
  const key=[W,H,P.seed,P.pN,P.pShape,P.pSize,P.pSpread].join('|');
  if(pLay.key===key)return pLay.sh;
  const rg=rng(P.seed*43+9), kinds=['circle','ellipse','rounded','pill'], sh=[];
  for(let i=0;i<P.pN;i++){
    const kind=P.pShape==='mix'?kinds[Math.floor(rg()*kinds.length)]:P.pShape;
    const r=Math.min(W,H)*(.14+rg()*.2)*P.pSize, asp=kind==='circle'?1:(kind==='pill'?.45+rg()*.2:.55+rg()*.4);
    sh.push({kind,x:W*(.5+(rg()-.5)*(.35+1.0*P.pSpread)),y:H*(.5+(rg()-.5)*(.35+1.0*P.pSpread)),rx:r,ry:r*asp,rot:kind==='circle'?0:rg()*Math.PI,
      rad:.15+rg()*.25,k:1+Math.floor(rg()*2),ph:rg()*TAU,ph2:rg()*TAU,col:i,tr:rng(P.seed*7+i*13+1)()});

}
function pPath(c,s){
  if(s.kind==='circle'||s.kind==='ellipse'){c.beginPath();c.ellipse(0,0,s.rx,s.ry,0,0,TAU)}
  else{const r=s.kind==='pill'?Math.min(s.rx,s.ry):Math.min(s.rx,s.ry)*s.rad*2;rr(c,-s.rx,-s.ry,s.rx*2,s.ry*2,r)}
}
function pFill(c,s,col){
  c.save();c.translate(s.cx,s.cy);c.rotate(s.rot);c.scale(s.sc,s.sc);pPath(c,s);c.fillStyle=col;c.fill();c.restore();
}
function renderP(c,ph){
  c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const base=pLayout(), pl=pal(), mono=pl.find(x=>x.toLowerCase()!==P.bg.toLowerCase())||P.fg;
  for(const cv2 of [pU,pO,pS,pT,pM,pL])if(cv2.width!==W||cv2.height!==H){cv2.width=W;cv2.height=H}
  const sh=base.map(s=>({...s,cx:s.x+P.pMove*W*.06*Math.sin(ph*s.k+s.ph),cy:s.y+P.pMove*H*.06*Math.sin(ph*s.k+s.ph2+1),sc:1+.06*P.pMove*Math.sin(ph+s.ph2)}));
  const R=s=>Math.hypot(s.rx,s.ry)*s.sc*1.05;
  pUx.setTransform(1,0,0,1,0,0);pUx.clearRect(0,0,W,H);sh.forEach(s=>pFill(pUx,s,'#000'));      // объединение
  const needO=P.pFillRegion==='overlaps'||P.pFillRegion==='single'||P.pPhotoRegion==='overlaps'||P.pPhotoRegion==='single';
  if(needO){                                                                                   // пересечения (≥2 шейпов): попарно, в габаритах пары
    pOx.setTransform(1,0,0,1,0,0);pOx.clearRect(0,0,W,H);
    for(let i=0;i<sh.length;i++)for(let j=i+1;j<sh.length;j++){
      const a=sh[i],b=sh[j], ra=R(a), rb=R(b);
      if(Math.hypot(a.cx-b.cx,a.cy-b.cy)>ra+rb)continue;
      const x0=Math.max(0,Math.floor(Math.max(a.cx-ra,b.cx-rb))), y0=Math.max(0,Math.floor(Math.max(a.cy-ra,b.cy-rb))),
            x1=Math.min(W,Math.ceil(Math.min(a.cx+ra,b.cx+rb))), y1=Math.min(H,Math.ceil(Math.min(a.cy+ra,b.cy+rb)));
      if(x1<=x0||y1<=y0)continue;
      pTx.globalCompositeOperation='source-over';pTx.clearRect(x0,y0,x1-x0,y1-y0);
      pTx.save();pTx.beginPath();pTx.rect(x0,y0,x1-x0,y1-y0);pTx.clip();
      pFill(pTx,a,'#000');pTx.globalCompositeOperation='destination-in';pFill(pTx,b,'#000');pTx.restore();pTx.globalCompositeOperation='source-over';
      pOx.drawImage(pT,x0,y0,x1-x0,y1-y0,x0,y0,x1-x0,y1-y0);

    pSx.globalCompositeOperation='source-over';pSx.clearRect(0,0,W,H);pSx.drawImage(pU,0,0);pSx.globalCompositeOperation='destination-out';pSx.drawImage(pO,0,0);pSx.globalCompositeOperation='source-over';
  }

    if(nm==='union')return pU;if(nm==='overlaps')return pO;if(nm==='single')return pS;
    if(nm==='outside'){pMx.setTransform(1,0,0,1,0,0);pMx.globalCompositeOperation='source-over';pMx.clearRect(0,0,W,H);pMx.fillStyle='#000';pMx.fillRect(0,0,W,H);pMx.globalCompositeOperation='destination-out';pMx.drawImage(pU,0,0);pMx.globalCompositeOperation='source-over';return pM}
    return null;
  };
  const fm=region(P.pFillRegion);                                                              // заливка цветом
  if(fm){
    pLx.setTransform(1,0,0,1,0,0);pLx.globalCompositeOperation='source-over';pLx.clearRect(0,0,W,H);
    sh.forEach((s,i)=>pFill(pLx,s,P.pColor==='palette'?pl[i%pl.length]:mono));
    pLx.globalCompositeOperation='destination-in';pLx.drawImage(fm,0,0);pLx.globalCompositeOperation='source-over';
    c.drawImage(pL,0,0);
  }
  const pm=region(P.pPhotoRegion);                                                             // фото только в выбранной зоне
  if(pm){
    pLx.setTransform(1,0,0,1,0,0);pLx.globalCompositeOperation='source-over';pLx.clearRect(0,0,W,H);
    pLx.drawImage(srcAlpha(),0,0);
    pLx.globalCompositeOperation='destination-in';pLx.drawImage(pm,0,0);pLx.globalCompositeOperation='source-over';
    c.drawImage(pL,0,0);
  }

}
// текстовые кольца вдоль контуров шейпов (как в сцене K, но привязаны к шейпам)
function pRings(c,ph,sh){
  const str=[...P.text.replace(/\s+/g,' ').trim()];if(!str.length)return;str.push(' ');
  const fs=Math.max(8,W*.026*P.ptSize), adv=ch=>(ch===' '?.32:ch.codePointAt(0)>0x2E80?1:.58)*fs;
  const wd=str.map(adv), per=wd.reduce((a,b)=>a+b,0);
  c.save();c.font=fontStr(fs);c.fillStyle=P.fg;c.textAlign='center';c.textBaseline='middle';
  sh.forEach((s,n)=>{
    if(!(s.tr<P.ptShare))return;                    // ползунок: доля шейпов с текстовым кольцом
    const off=P.ptSide==='outside'?fs*.8:P.ptSide==='inside'?-fs*.8:0, rx=s.rx*s.sc+off, ry=s.ry*s.sc+off;
    if(rx<fs||ry<fs)return;
    const hh=((rx-ry)/(rx+ry))**2, circ=Math.PI*(rx+ry)*(1+3*hh/(10+Math.sqrt(4-3*hh))), reps=Math.max(1,Math.round(circ/per)), k=circ/(reps*per);   // целое число повторов → бесшовный луп
    const dir=n%2?1:-1, sh0=P.ptSpin?dir*per*k*ph/TAU:0;
    c.save();c.translate(s.cx,s.cy);c.rotate(s.rot);
    const M=240,ts=[0],cum=[0];let px=rx,py=0;
    for(let i=1;i<=M;i++){const t=i/M*TAU,x=rx*Math.cos(t),y=ry*Math.sin(t);cum.push(cum[i-1]+Math.hypot(x-px,y-py));px=x;py=y;ts.push(t)}
    const tot=cum[M];let sacc=0;
    for(let r=0;r<reps;r++)for(let i=0;i<str.length;i++){
      const w=wd[i]*k, sc2=sacc+w/2;sacc+=w;
      if(str[i]===' ')continue;
      const q=((((sc2+sh0)/circ)%1)+1)%1*tot;let lo=0,hi=M;
      while(hi-lo>1){const mid=(lo+hi)>>1;if(cum[mid]<q)lo=mid;else hi=mid}
      const f=(q-cum[lo])/((cum[hi]-cum[lo])||1), t=ts[lo]+(ts[hi]-ts[lo])*f;
      const x=rx*Math.cos(t), y=ry*Math.sin(t), tx2=-rx*Math.sin(t), ty2=ry*Math.cos(t);
      c.save();c.translate(x,y);c.rotate(Math.atan2(ty2,tx2));c.fillText(str[i],0,0);c.restore();
    }
    c.restore();
  });
  c.restore();
}

/* ---------- Mode Q: 3D Copies (копии фото в 3D; повороты задаёт общее правило: волна / нойз-поле по позиции / качание / оборот) ---------- */
const q3={key:'',items:[]};
function q3Layout(){
  const key=[W,H,P.seed,P.qN,P.qArrange,P.qSize,P.qSizeVar,P.qSpread,P.qCrop,P.qTilt,P.qRoll,P.qDepth].join('|');
  if(q3.key===key)return q3.items;
  const rg=rng(P.seed*83+21), items=[], D=Math.PI/180, N=P.qN;
  const cols=Math.max(1,Math.round(Math.sqrt(N*W/H))), rows=Math.ceil(N/cols), sp=P.qSpread;
  for(let i=0;i<N;i++){
    let x,y,sc;
    if(P.qArrange==='grid'){
      const c=i%cols, r=Math.floor(i/cols), cw=W*sp/cols, ch=H*sp/rows;
      x=W/2+(c-(cols-1)/2)*cw; y=H/2+(r-(rows-1)/2)*ch; sc=Math.min(cw,ch/(H/W))*P.qSize*2.2;
    }else{
      x=W*(.5+(rg()-.5)*(.25+.9*sp)); y=H*(.5+(rg()-.5)*(.25+.9*sp)); sc=W*P.qSize;
    }
    sc*=1-P.qSizeVar*.7*rg();
    const cs=1-P.qCrop*(.15+rg()*.6);
    items.push({x,y,u:x/W,v:y/H,sc,z:(rg()*2-1)*P.qDepth,
      ax:(rg()*2-1)*P.qTilt*D, ay:(rg()*2-1)*P.qTilt*D, az:(rg()*2-1)*P.qRoll*D,
      k:1+Math.floor(rg()*2), ph:[rg()*TAU,rg()*TAU,rg()*TAU], dir:rg()<.5?-1:1, cw:cs, cx:rg()*(1-cs), cy:rg()*(1-cs)});
  }
  q3.key=key;q3.items=items;return items;
}
// гладкий value-noise по 2D; движение по кругу в пространстве нойза → бесшовный луп
const qLat=(i,j,o)=>{const x=Math.sin(i*127.1+j*311.7+o*74.7+P.seed*19.3)*43758.5453;return x-Math.floor(x)};
function qNoise(x,y,o){
  const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=qLat(i,j,o),b=qLat(i+1,j,o),c=qLat(i,j+1,o),d=qLat(i+1,j+1,o);
  return (a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v)*2-1;

function q3Angles(it,ph){
  const D=Math.PI/180, T=P.qTilt*D, Rr=P.qRoll*D, m=P.qSpin, f=P.qFreq;
  if(P.qRule==='sway')return [it.ax+m*.5*Math.sin(ph*it.k+it.ph[0]),it.ay+m*.5*Math.sin(ph*it.k+it.ph[1]),it.az+m*.25*Math.sin(ph*it.k+it.ph[2]),it.z];
  if(P.qRule==='turn')return [it.ax,it.ay+it.dir*ph*it.k*m,it.az,it.z];
  const u=it.u*f*2, v=it.v*f*2*(H/W);
  const st=(o)=>qNoise(u,v,o);                                    // статичная неровность поля
  if(P.qRule==='noise'){
    const R=m*1.6, cx=Math.cos(ph)*R, cy=Math.sin(ph)*R;           // по окружности в пространстве нойза
    const dn=(o)=>qNoise(u+cx,v+cy,o);
    return [T*dn(1),T*dn(2),Rr*dn(3),P.qDepth*dn(4)];
  }
  const th=P.qDir*D, phi=TAU*f*(it.u*Math.cos(th)+it.v*Math.sin(th)*(H/W))-ph;   // бегущая волна
  return [T*((1-m)*st(1)+m*Math.sin(phi)),T*((1-m)*st(2)+m*Math.sin(phi+2.1)),Rr*((1-m)*st(3)+m*Math.sin(phi+4.2)),P.qDepth*((1-m)*st(4)+m*Math.cos(phi))];
}
function q3Draw(c,tex,it,ax,ay,az,zc){
  const asp=tex.height/tex.width, sw=it.sc;
  const ca=Math.cos(ax),sa=Math.sin(ax),cb=Math.cos(ay),sb=Math.sin(ay),cc=Math.cos(az),sc2=Math.sin(az);
  const d=2.5/(P.qPersp+.01), G=5, pts=[];
  for(let j=0;j<=G;j++)for(let i=0;i<=G;i++){
    const u=i/G, v=j/G;
    const X=(u-.5)*2, Y=(v-.5)*2*asp;
    const y1=Y*ca, z1=Y*sa;                                  // вокруг X
    const x2=X*cb+z1*sb, z2=-X*sb+z1*cb;                     // вокруг Y
    const x3=x2*cc-y1*sc2, y3=x2*sc2+y1*cc;                  // вокруг Z
    const k=d/Math.max(.3,d+z2+zc*3);

  const tw=it.cw*tex.width, th=it.cw*tex.height, tx0=it.cx*tex.width, ty0=it.cy*tex.height, m=.6;
  for(let j=0;j<G;j++)for(let i=0;i<G;i++){
    const a=pts[j*(G+1)+i], b=pts[j*(G+1)+i+1], c2=pts[(j+1)*(G+1)+i], d2=pts[(j+1)*(G+1)+i+1];
    for(const tri of [[a,b,c2],[b,d2,c2]]){
      const [p0,p1,p2]=tri;
      const u0=tx0+p0[2]*tw, v0=ty0+p0[3]*th, u1=tx0+p1[2]*tw, v1=ty0+p1[3]*th, u2=tx0+p2[2]*tw, v2=ty0+p2[3]*th;

/* ---------- Mode R: Box Room (копии фото как пять стенок коробки, вид изнутри; дальняя стенка движется) ---------- */

function renderR(c,ph){

  if(mv==='slide'||mv==='both'){ox=P.rSlide*W*.22*Math.cos(ph);oy=P.rSlide*H*.22*Math.sin(ph)}   // и/или уезжает вбок по кругу

  face(GD,GS,(a,t)=>[-hw,(t-.5)*H,Zd(a),1-a,t],full);                                // левая
  face(GD,GS,(a,t)=>[hw,(t-.5)*H,Zd(a),a,t],full);                                  // правая: край фото, смыкающийся с дальней стенкой — правый (отражение дальней стенки)
  face(GS,GD,(s,a)=>[(s-.5)*W,hh,Zd(a),s,a],full);                                       // пол: ноги к ногам дальней стенки
  face(GS,GD,(s,a)=>[(s-.5)*W,-hh,Zd(a),s,1-a],full);                                   // потолок: голова к голове дальней стенки

/* ---------- Mode S: Type Wall (стена из крупных букв; в строки встроены окна-шейпы, через которые видно фото) ---------- */

/* ---------- Mode T: Morph Shape (полигон с фото; вершины перетекают между состояниями с easing; текст вдоль границы) ---------- */

  const N=P.tmN, K=P.tmStates, st=[];
  for(let k=0;k<K;k++){
    const rg=rng(P.seed*113+k*17+5), rot=(rg()*2-1)*P.tmRot*.9, ox=(rg()*2-1)*P.tmRot*W*.08, oy=(rg()*2-1)*P.tmRot*H*.06, sc=1-P.tmRot*.2*rg();
    const v=[];

      const rad=1.12-P.tmJag*.7*Math.pow(rg(),1.1);
      v.push([W/2+ox+Math.cos(ang)*rad*W*.47*P.tmSize*sc, H/2+oy+Math.sin(ang)*rad*H*.42*P.tmSize*sc]);
    }

  const hold=P.tmHold, p=f<hold?0:tmEase[P.tmEase]((f-hold)/Math.max(1e-6,1-hold));

function renderT(c,ph){
  c.setTransform(1,0,0,1,0,0);c.fillStyle=P.bg;c.fillRect(0,0,W,H);
  const v=tmVerts(ph), N=v.length, pl=pal(), tex=srcAlpha();
  let cx=0,cy=0;v.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=N;cy/=N;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;v.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});
  const poly=()=>{c.beginPath();c.moveTo(v[0][0],v[0][1]);for(let i=1;i<N;i++)c.lineTo(v[i][0],v[i][1]);c.closePath()};
  const colA=pl.find(x=>x.toLowerCase()!==P.bg.toLowerCase())||P.fg;
  if(P.tmFill==='color')c.drawImage(tex,0,0);                   // при цветной заливке фото остаётся на фоне
  c.save();poly();c.clip();
  if(P.tmFill==='color'){c.fillStyle=colA;c.fillRect(0,0,W,H)}
  else{
    if(P.tmFill==='tint'){c.fillStyle=pl[1]||colA;c.fillRect(0,0,W,H);c.globalCompositeOperation='multiply'}

}
// текст вдоль рёбер (снаружи side=1 / внутри side=-1): ребро 0 — крупный заголовок (только снаружи), остальные — подписи; размер подгоняется под длину ребра

  const ws=words();if(!ws.length)return;
  const N=v.length, m=W*.01;
  c.save();c.fillStyle=col;c.textAlign='center';c.textBaseline='alphabetic';
  let wi=side>0?0:Math.floor(ws.length/2);

    if(len<W*.05)continue;
    let nx=dy/len, ny=-dx/len;                                           // нормаль наружу
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
    if(nx*(mx-cx)+ny*(my-cy)<0){nx=-nx;ny=-ny}

// крупная надпись по центру шейпа (слегка повёрнута вместе с состоянием)

/* ---------- Mode U: Letter Flood (строки текста; волна увеличивает буквы, они сливаются в шейп, в котором может быть фото) ---------- */

  tmp2.width=4;t2ctx.font=fontStr(fs);
